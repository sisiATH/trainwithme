<style>
  :root {

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
const db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const TRIAL_DAYS = 14;

// ============================================================
// UTILITIES
// ============================================================
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const ymd = (d) => { const dt = (d instanceof Date) ? d : new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; };
const parseYMD = (s) => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const fmt1 = (n) => (n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toFixed(1);
const fmt0 = (n) => (n===null||n===undefined||isNaN(n)) ? '—' : Math.round(Number(n)).toLocaleString();
function hexToRgb(hex) { const h=hex.replace('#',''); return {r:parseInt(h.substr(0,2),16),g:parseInt(h.substr(2,2),16),b:parseInt(h.substr(4,2),16)}; }
const toDisplayWeight = (kg,unit) => { if (kg===null||kg===undefined||kg==='') return null; return unit==='lbs' ? kg*2.20462 : kg; };
const fromDisplayWeight = (val,unit) => { if (val===null||val===undefined||val==='') return null; const n=Number(val); if (isNaN(n)) return null; return unit==='lbs' ? n/2.20462 : n; };
const isImperial = (unit) => unit==='lbs'||unit==='imperial';
const weightUnit = (unit) => isImperial(unit) ? 'lbs' : 'kg';
const heightUnit = (unit) => isImperial(unit) ? 'in' : 'cm';
const waterUnit  = (unit) => isImperial(unit) ? 'fl oz' : 'L';
const toDisplayHeight = (cm,unit) => { if (cm===null||cm===undefined||cm==='') return null; return isImperial(unit) ? cm/2.54 : cm; };
const fromDisplayHeight = (val,unit) => { if (val===null||val===undefined||val==='') return null; const n=Number(val); if (isNaN(n)) return null; return isImperial(unit) ? n*2.54 : n; };
const toDisplayWater = (L,unit) => { if (L===null||L===undefined||L==='') return null; return isImperial(unit) ? L*33.814 : L; };
const fromDisplayWater = (val,unit) => { if (val===null||val===undefined||val==='') return null; const n=Number(val); if (isNaN(n)) return null; return isImperial(unit) ? n/33.814 : n; };
function avg(arr,key) { const vals=arr.map(x=>x[key]).filter(v=>v!==null&&v!==undefined&&!isNaN(v)&&v>0); if (!vals.length) return null; return vals.reduce((a,b)=>a+b,0)/vals.length; }

function calcPhase(cycleDay,cycleLength,periodLength) {
  if (!cycleDay||!cycleLength) return null;
  if (cycleDay>cycleLength) return 'Luteal';
  if (cycleDay<=(periodLength||5)) return 'Menstrual';
  const foll=Math.round(cycleLength*0.45); const ovul=Math.round(cycleLength*0.55);
  if (cycleDay<=foll) return 'Follicular';
  if (cycleDay<=ovul) return 'Ovulatory';
  return 'Luteal';
}

function calcRecovery(t,baselines) {
  if (!t) return null;
  const {hrv,rhr,sleep_quality}=t; const {hrvAvg,rhrAvg}=baselines;
  const haveHrv=hrv&&hrvAvg&&hrv>0&&hrvAvg>0; const haveRhr=rhr&&rhrAvg&&rhr>0&&rhrAvg>0;
  if (!haveHrv&&!haveRhr) return null;
  const haveSleep=sleep_quality&&sleep_quality>0;
  let score=0,weight=0;
  if (haveHrv){score+=(hrv/hrvAvg)*0.5;weight+=0.5;}
  if (haveRhr){score+=(rhrAvg/rhr)*0.4;weight+=0.4;}
  if (haveSleep){score+=(sleep_quality/4)*0.1;weight+=0.1;}
  return score/weight;
}
function recoveryLabel(s) {
  if (s===null) return {label:'Not enough data',tone:'neutral'};
  if (s>=1.05) return {label:'Recovered',tone:'green'};
  if (s>=0.95) return {label:'Steady',tone:'yellow'};
  return {label:'Take it easy',tone:'red'};
}
function calcStepTarget(b,r) { if (!b) return null; if (r===null) return b; return Math.round((b*Math.max(0.7,Math.min(1.25,r)))/100)*100; }
function avg7(logs,key) { return avg(logs.slice(-7),key); }

const PHASE_GUIDANCE = {
  Menstrual:{prioritize:'Recovery, sleep, gentle movement. Skip intensity.',train:'Lighter loads. Mobility, walking, gentle yoga.',eat:'Iron-rich foods (red meat, lentils, dark greens). Extra water. Magnesium for cramps.'},
  Follicular:{prioritize:'Build muscle, hit volume, challenge yourself.',train:'Best window for intensity, PRs, hard sessions. Push your step target.',eat:'Standard fuelling. Carbs around sessions. Estrogen is rising — energy is good.'},
  Ovulatory:{prioritize:"Power, strength, sprints. Don't restrict food.",train:'Peak strength. Watch joint stability (ACL/knee). Go for it but with form.',eat:"Standard. Don't under-eat — recovery demands are high."},
  Luteal:{prioritize:'Steady cardio, magnesium 300-400mg evening, manage sleep disruption.',train:'Volume down 20% if RPE > 8. More zone 2, less HIIT. Cravings are real.',eat:'+15% carbs. 30g fibre. Eat the extra food — appetite is hormonal, not failure.'},
};

function todaysFocus({recovery,phase,todayLog,profile,baselines}) {
  if (!todayLog&&recovery===null) return {headline:'Set your baseline.',detail:"Log today's sleep, HRV, weight and steps. Your first signal appears in 2-3 days.",action:null};
  if (recovery!==null&&recovery<0.9) return {headline:'Recovery is low. Rest or walk only today.',detail:phase?`Your HRV is below baseline. ${phase} phase guidance suggests ${PHASE_GUIDANCE[phase].prioritize.toLowerCase()} — but recovery wins.`:'Your HRV is below baseline. Skip intensity. Walk, mobilise, sleep early.',action:'Aim for 7,000-8,000 steps. No HIIT, no heavy lifts.'};
  if (recovery!==null&&recovery>=1.05&&(phase==='Follicular'||phase==='Ovulatory')) return {headline:"You're recovered and in your strong window. Train hard.",detail:phase==='Ovulatory'?'Ovulation: peak strength but watch ACL/knee stability. Form before load.':'Follicular: best week for PRs and intensity. Estrogen is on your side.',action:'Heavy lifts, intervals, or sprint work today. Eat the food to fuel it.'};
  if (recovery!==null&&recovery>=1.05&&phase==='Luteal') return {headline:'Recovered but luteal — choose volume over intensity.',detail:'HRV is good, but progesterone makes hard sessions harder to recover from. Zone 2 or moderate strength beats HIIT here.',action:'+15% carbs around training. Magnesium tonight.'};
  if (recovery!==null&&recovery>=1.05&&phase==='Menstrual') return {headline:'Your body wants gentle movement, not intensity.',detail:'First few days of bleed: walking, yoga, mobility. Iron is dropping — fuel it.',action:'Red meat or lentils today. Extra 500ml water.'};
  if (recovery!==null&&phase) return {headline:`Steady day. ${phase} guidance applies.`,detail:PHASE_GUIDANCE[phase].prioritize,action:PHASE_GUIDANCE[phase].train};
  if (recovery!==null) return {headline:recovery>=1.05?"You're recovered. Push today.":'Steady day. Stick to the plan.',detail:'Add cycle tracking in Settings for personalised phase-aware guidance.',action:null};
  if (phase) return {headline:`${phase} phase — here's what helps.`,detail:PHASE_GUIDANCE[phase].prioritize,action:'Keep logging HRV and RHR — recovery score appears once we have your baseline (~7 days).'};
  return {headline:'Keep logging.',detail:'A few more days of data and the dashboard starts personalising.',action:null};
}

function whatChanged(logs,profile,todayLog) {
  const unit=profile.unit_system||'kg'; const out={moved:[],missing:[]};
  if (logs.length<2) return out;
  const sorted=logs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const recent7=sorted.slice(-7); const latest=todayLog||sorted[sorted.length-1];
  if (latest?.weight_kg) { const w7=avg(recent7.filter(l=>l.weight_kg&&l.date!==latest.date),'weight_kg'); if (w7!==null){const diff=latest.weight_kg-w7; if(Math.abs(diff)>=0.2) out.moved.push({headline:`Weight ${diff<0?'down':'up'} ${fmt1(toDisplayWeight(Math.abs(diff),unit))} ${weightUnit(unit)}`,detail:`vs your 7-day average. ${Math.abs(diff)>0.8?'Likely water (sodium, carbs, luteal) — not fat.':'Within normal daily variation.'}`,tone:diff<0?'good':'neutral'});} }
  if (latest?.hrv) { const hrv7=avg(recent7.filter(l=>l.hrv&&l.date!==latest.date),'hrv'); if(hrv7!==null){const diff=latest.hrv-hrv7; if(Math.abs(diff)>=4){let reason=''; if(diff<0){if(latest.alcohol_units>0)reason=` — alcohol last night.`;else if(latest.sleep_hours&&latest.sleep_hours<7)reason=` — sleep was ${fmt1(latest.sleep_hours)}h.`;else if(latest.stress>=4)reason=` — stress was high.`;} out.moved.push({headline:`HRV ${diff<0?'down':'up'} ${Math.abs(Math.round(diff))}ms`,detail:`vs your 7-day average${reason}`,tone:diff>0?'good':'warn'});}} }
  if (latest?.sleep_hours) { const sleep7=avg(recent7.filter(l=>l.sleep_hours&&l.date!==latest.date),'sleep_hours'); if(sleep7!==null){const diff=latest.sleep_hours-sleep7; if(Math.abs(diff)>=0.7) out.moved.push({headline:`Sleep ${diff>0?'up':'down'} ${fmt1(Math.abs(diff))}h`,detail:`${fmt1(latest.sleep_hours)}h vs ${fmt1(sleep7)}h average.`,tone:diff>0?'good':'warn'});} }
  const checkField=(key,label,gap=2)=>{ const last=sorted.slice(-gap).filter(l=>l[key]!==null&&l[key]!==undefined&&l[key]!==''); if(last.length===0&&sorted.length>=gap) out.missing.push(label); };
  checkField('weight_kg','weight',2); checkField('hrv','HRV',3); checkField('sleep_hours','sleep',2);
  return out;
}

function generateInsights(logs,profile) {
  const insights={gaps:[],wins:[],stalls:[],cycle:[]};
  const unit=profile.unit_system||'kg';
  if (logs.length<3) return insights;
  const recent=logs.slice(-7);
  const waterAvg=avg(recent,'water_l'); if(waterAvg!==null&&profile.water_target&&waterAvg<profile.water_target*0.7) insights.gaps.push({headline:'Water is low.',detail:`Averaging ${fmt1(toDisplayWater(waterAvg,unit))} ${waterUnit(unit)}/day, target ${fmt1(toDisplayWater(profile.water_target,unit))} ${waterUnit(unit)}.`});
  const sleepAvg=avg(recent,'sleep_hours'); if(sleepAvg!==null&&sleepAvg<7) insights.gaps.push({headline:'Sleep is short.',detail:`Averaging ${fmt1(sleepAvg)}h. Sleep under 7h is the single strongest predictor of low NEAT the next day.`});
  const proteinDays=recent.filter(l=>l.protein_g); if(proteinDays.length>=3&&profile.protein_target){const hit=proteinDays.filter(l=>l.protein_g>=profile.protein_target).length; if(hit<proteinDays.length/2) insights.gaps.push({headline:'Protein target missed.',detail:`Hit ${profile.protein_target}g on ${hit} of ${proteinDays.length} logged days. In peri, protein protects muscle through fat loss.`});}
  const stepAvg=avg(recent,'steps'); if(stepAvg!==null&&profile.baseline_steps&&stepAvg<profile.baseline_steps*0.8) insights.gaps.push({headline:'Steps dropped.',detail:`Averaging ${fmt0(stepAvg)}/day, ${Math.round((1-stepAvg/profile.baseline_steps)*100)}% below your baseline.`});
  const sleepStepLogs=logs.filter(l=>l.sleep_hours&&l.steps); if(sleepStepLogs.length>=5){const high=sleepStepLogs.filter(l=>l.sleep_hours>=7.5); const low=sleepStepLogs.filter(l=>l.sleep_hours<7.5); if(high.length>=2&&low.length>=2){const diff=Math.round(avg(high,'steps')-avg(low,'steps')); if(diff>500) insights.wins.push({headline:`+${diff.toLocaleString()} steps on well-rested days`,detail:`When you sleep ≥7.5h, you walk ${Math.round(diff/avg(low,'steps')*100)}% more the next day.`});}}
  const alcLogs=logs.filter(l=>l.alcohol_units!==null&&l.alcohol_units!==undefined&&l.hrv); if(alcLogs.length>=5){const drinking=alcLogs.filter(l=>l.alcohol_units>0); const sober=alcLogs.filter(l=>l.alcohol_units===0); if(drinking.length>=2&&sober.length>=2){const drop=((avg(sober,'hrv')-avg(drinking,'hrv'))/avg(sober,'hrv'))*100; if(drop>5) insights.wins.push({headline:`Alcohol costs you ${Math.round(drop)}% HRV`,detail:`On drinking days HRV averages ${fmt0(avg(drinking,'hrv'))} vs ${fmt0(avg(sober,'hrv'))} on dry days.`});}}
  const muscleLogs=logs.filter(l=>l.muscle_kg&&l.weight_kg); if(muscleLogs.length>=7){const first=muscleLogs[0]; const last=muscleLogs[muscleLogs.length-1]; const wC=last.weight_kg-first.weight_kg; const mC=last.muscle_kg-first.muscle_kg; if(wC<-0.3&&mC>=-0.2) insights.wins.push({scope:'body',headline:'Muscle is holding',detail:`Down ${fmt1(toDisplayWeight(Math.abs(wC),unit))} ${weightUnit(unit)} since first log, muscle mass stable. That's fat loss, not weight loss.`}); if(wC<-0.3&&mC<-0.3) insights.gaps.push({scope:'body',headline:'Losing muscle, not just fat',detail:`Weight down ${fmt1(toDisplayWeight(Math.abs(wC),unit))} ${weightUnit(unit)} but muscle down ${fmt1(toDisplayWeight(Math.abs(mC),unit))} ${weightUnit(unit)}. Eat more protein, lift heavier, or both.`});}
  const weightLogs=logs.filter(l=>l.weight_kg).slice(-7); if(weightLogs.length>=5){const w=weightLogs.map(l=>l.weight_kg); const range=Math.max(...w)-Math.min(...w); if(range<0.4){const stallCalOut=avg(logs.slice(-7),'calories_out'); const stallSleep=avg(logs.slice(-7),'sleep_hours'); const stallAlc=logs.slice(-7).reduce((s,l)=>s+(l.alcohol_units||0),0); let why=[]; if(stallCalOut&&stallCalOut<2200)why.push(`calories out averaging ${fmt0(stallCalOut)}`); if(stallSleep&&stallSleep<7)why.push(`sleep averaging ${fmt1(stallSleep)}h`); if(stallAlc>4)why.push(`${stallAlc} units alcohol in the last week`); insights.stalls.push({scope:'body',headline:'Weight has stalled for 5+ days',detail:why.length?`Likely cause: ${why.join('; ')}. Pick one to fix this week.`:'Numbers look fine — could be water shift. Hold the line for 3-4 more days.'});}}
  if(logs.length>=7){const bfLogs=logs.filter(l=>l.body_fat_pct).slice(-14); if(bfLogs.length>=4){const bfC=bfLogs[bfLogs.length-1].body_fat_pct-bfLogs[0].body_fat_pct; const wLogs2=logs.filter(l=>l.weight_kg).slice(-14); const wC2=wLogs2.length>=2?wLogs2[wLogs2.length-1].weight_kg-wLogs2[0].weight_kg:0; if(bfC<-0.5&&Math.abs(wC2)<0.3) insights.wins.push({scope:'body',headline:`Body fat down ${fmt1(Math.abs(bfC))}%, scale flat`,detail:"You're losing fat and gaining/holding muscle. The scale lies — body comp is the signal."});}}
  if(profile.track_cycle&&profile.last_period_start&&logs.length>=14){
    const byPhase={Menstrual:[],Follicular:[],Ovulatory:[],Luteal:[]};
    for(const l of logs){const d=daysBetween(parseYMD(profile.last_period_start),parseYMD(l.date)); if(d<0)continue; const cd=(d%(profile.cycle_length||28))+1; const p=calcPhase(cd,profile.cycle_length,profile.period_length); if(p)byPhase[p].push(l);}
    const hrvByPhase={}; for(const p of ['Menstrual','Follicular','Ovulatory','Luteal']){const h=avg(byPhase[p],'hrv'); if(h!==null)hrvByPhase[p]=h;}
    if(hrvByPhase.Follicular&&hrvByPhase.Luteal){const drop=hrvByPhase.Follicular-hrvByPhase.Luteal; if(drop>2) insights.cycle.push({headline:`HRV drops ${fmt0(drop)}ms in luteal vs follicular`,detail:'Normal — progesterone suppresses HRV. Plan lighter weeks in luteal.'});}
    const wByPhase={}; for(const p of ['Menstrual','Follicular','Ovulatory','Luteal']){const w2=avg(byPhase[p],'weight_kg'); if(w2!==null)wByPhase[p]=w2;}
    if(wByPhase.Luteal&&wByPhase.Follicular&&wByPhase.Luteal>wByPhase.Follicular+0.3) insights.cycle.push({scope:'body',headline:'You weigh more in luteal — that\'s water',detail:`Average luteal weight is ${fmt1(toDisplayWeight(wByPhase.Luteal-wByPhase.Follicular,unit))} ${weightUnit(unit)} higher than follicular. Hormonal retention, not fat.`});
  }
  return insights;
}

function behaviourScorecard(logs,profile) {
  if (logs.length<7) return {items:[],ready:false,daysNeeded:7-logs.length};
  const unit=profile.unit_system||'kg';
  const pairs=(key)=>{const out=[]; for(let i=0;i<logs.length-1;i++){const v=logs[i][key]; if(v===null||v===undefined||v===''||isNaN(v))continue; if(!logs[i].weight_kg||!logs[i+1].weight_kg)continue; out.push({v:Number(v),dw:logs[i+1].weight_kg-logs[i].weight_kg});} return out;};
  const analyze=(habitName,key,opts={})=>{
    const{threshold,higherIsBetter=true}=opts; const all=pairs(key); if(all.length<5)return null;
    let above,below;
    if(threshold!==undefined){above=all.filter(p=>p.v>=threshold);below=all.filter(p=>p.v<threshold);}
    else{const s=[...all].sort((a,b)=>a.v-b.v); const mid=s[Math.floor(s.length/2)].v; above=all.filter(p=>p.v>=mid);below=all.filter(p=>p.v<mid);}
    if(above.length<2||below.length<2)return null;
    const dwAbove=above.reduce((s,p)=>s+p.dw,0)/above.length; const dwBelow=below.reduce((s,p)=>s+p.dw,0)/below.length;
    const goodGroup=higherIsBetter?dwAbove:dwBelow; const badGroup=higherIsBetter?dwBelow:dwAbove;
    const diff=badGroup-goodGroup; if(Math.abs(diff)<0.05)return null;
    return {habit:habitName,impact:diff,helps:diff>0,observation:diff>0?`${habitName} ${higherIsBetter?'high':'low'} → ${fmt1(toDisplayWeight(Math.abs(goodGroup),unit))} ${weightUnit(unit)} lighter next morning.`:`${habitName} doesn't seem to move the scale either way for you.`,dataPoints:all.length};
  };
  const items=[
    analyze('Sleep','sleep_hours',{threshold:7.5,higherIsBetter:true}),
    analyze('Protein','protein_g',{threshold:profile.protein_target||110,higherIsBetter:true}),
    analyze('Steps','steps',{threshold:profile.baseline_steps||8000,higherIsBetter:true}),
    analyze('Calories burned','calories_out',{higherIsBetter:true}),
    analyze('Alcohol','alcohol_units',{threshold:0.5,higherIsBetter:false}),
    analyze('Stress','stress',{threshold:3,higherIsBetter:false}),
    analyze('Sleep quality','sleep_quality',{threshold:4,higherIsBetter:true}),
    analyze('Water','water_l',{threshold:profile.water_target||2.5,higherIsBetter:true}),
  ].filter(Boolean);
  items.sort((a,b)=>Math.abs(b.impact)-Math.abs(a.impact));
  return {items,ready:true};
}

function narrator(logs,profile,todayLog) {
  const unit=profile.unit_system||'kg';
  const sorted=logs.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const out={today:null,bestVsWorst:null,watching:[],cantSay:[],daysLogged:sorted.length};
  if(sorted.length>=2){
    const todayDate=ymd(today()); const todayRow=todayLog||sorted.find(l=>l.date===todayDate);
    const priorDays=sorted.filter(l=>l.date!==todayDate&&l.weight_kg).slice(-3); const yesterday=priorDays.length?priorDays[priorDays.length-1]:null;
    if(todayRow&&todayRow.weight_kg&&yesterday&&yesterday.weight_kg){
      const diff=todayRow.weight_kg-yesterday.weight_kg; const direction=diff<-0.1?'down':diff>0.1?'up':'flat'; const absDiff=Math.abs(diff);
      const candidates=[]; const recent=sorted.filter(l=>l.date!==yesterday.date&&l.date!==todayRow.date).slice(-7);
      const avgSleep=avg(recent,'sleep_hours'); const avgSteps=avg(recent,'steps');
      if(todayRow.sleep_hours&&avgSleep&&Math.abs(todayRow.sleep_hours-avgSleep)>0.5) candidates.push(`sleep ${todayRow.sleep_hours-avgSleep>0?'high':'low'} (${fmt1(todayRow.sleep_hours)}h vs avg ${fmt1(avgSleep)}h)`);
      if(yesterday.steps&&avgSteps&&Math.abs(yesterday.steps-avgSteps)>=1500) candidates.push(`steps ${yesterday.steps-avgSteps>0?'higher':'lower'} (${fmt0(yesterday.steps)} vs avg ${fmt0(avgSteps)})`);
      if(yesterday.alcohol_units>0) candidates.push(`alcohol (${yesterday.alcohol_units} units)`);
      if(yesterday.sessions&&yesterday.sessions.length){const totalDur=yesterday.sessions.reduce((s,x)=>s+(x.duration||0),0); if(totalDur>=60) candidates.push(`big training day (${totalDur} min)`);}
      let headline,detail;
      if(direction==='down'){headline=`Down ${fmt1(toDisplayWeight(absDiff,unit))} ${weightUnit(unit)} this morning`;detail=candidates.length?`Yesterday stood out: ${candidates.slice(0,3).join(', ')}. Engine is watching which of these repeats.`:`Yesterday looked typical — could be daily water variation. Watch the 7-day average.`;}
      else if(direction==='up'){headline=`Up ${fmt1(toDisplayWeight(absDiff,unit))} ${weightUnit(unit)} this morning`;detail=absDiff>0.5?(candidates.length?`Yesterday: ${candidates.slice(0,3).join(', ')}. Likely water — not fat regain.`:'Could be hormonal water (luteal, sodium, late meal). Single-day swings >0.5kg are almost always water.'):(candidates.length?`Small change. Yesterday: ${candidates.slice(0,2).join(', ')}. Normal fluctuation.`:'Within normal daily variation. Trust the weekly average.');}
      else{headline='Weight flat this morning';detail=candidates.length?`Yesterday: ${candidates.slice(0,2).join(', ')}. Held steady.`:'Typical day, typical morning. Look at the weekly trend.';}
      out.today={headline,detail};
    } else if(!todayRow) out.today={headline:"Today's weight not logged yet",detail:'Log this morning\'s weight to get today\'s observation.'};
  }
  const pairs=[];
  for(let i=0;i<sorted.length-3;i++){const a=sorted[i]; if(!a.weight_kg||a.is_refeed)continue; const next3=sorted.slice(i+1,i+4).filter(l=>l.weight_kg); if(next3.length<2)continue; const fwdAvg=next3.reduce((s,l)=>s+l.weight_kg,0)/next3.length; pairs.push({day:a,delta:fwdAvg-a.weight_kg});}
  if(pairs.length>=4){
    const sp=[...pairs].sort((a,b)=>a.delta-b.delta); const ds=Math.max(2,Math.floor(pairs.length/3));
    const downDays=sp.slice(0,ds); const upDays=sp.slice(-ds);
    const gAvg=(group,key)=>{const vals=group.map(p=>p.day[key]).filter(v=>v!==null&&v!==undefined); return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null;};
    const diffs=[];
    const ds2=gAvg(downDays,'sleep_hours'),us=gAvg(upDays,'sleep_hours'); if(ds2!==null&&us!==null&&Math.abs(ds2-us)>=0.3) diffs.push(`sleep: ${fmt1(ds2)}h on down-days vs ${fmt1(us)}h on up-days`);
    const dst=gAvg(downDays,'steps'),ust=gAvg(upDays,'steps'); if(dst!==null&&ust!==null&&Math.abs(dst-ust)>=1000) diffs.push(`steps: ${fmt0(dst)} on down-days vs ${fmt0(ust)} on up-days`);
    const dco=gAvg(downDays,'calories_out'),uco=gAvg(upDays,'calories_out'); if(dco!==null&&uco!==null&&Math.abs(dco-uco)>=150) diffs.push(`calorie burn: ${fmt0(dco)} on down-days vs ${fmt0(uco)} on up-days`);
    const dp=gAvg(downDays,'protein_g'),up=gAvg(upDays,'protein_g'); if(dp!==null&&up!==null&&Math.abs(dp-up)>=10) diffs.push(`protein: ${fmt0(dp)}g on down-days vs ${fmt0(up)}g on up-days`);
    if(diffs.length>0) out.bestVsWorst={headline:pairs.length>=20?'What tends to be different when your scale drops':pairs.length>=10?'Early read: what looks different when the scale moves':'Too early to call a real pattern',detail:`Across your ${pairs.length} logged 3-day windows: ${diffs.join('; ')}.`,caveat:`This is ${pairs.length>=20?'becoming a real pattern':'still a noisy early pattern'} — water, cycle phase, food timing, and training load can still override the next-morning scale.`};
    else if(pairs.length>=4) out.bestVsWorst={headline:'Your days look similar across the board',detail:'Your habits have been consistent. Without more variation, I can\'t separate what\'s moving the scale from what isn\'t.',caveat:null};
    const fpairs=pairs.filter(p=>(p.day.sessions||[]).some(s=>s.type==='Football')); if(fpairs.length>=2){const wins=fpairs.filter(p=>p.delta<-0.05).length; out.watching.push({observation:`Days you played football: lost weight next morning ${wins} of ${fpairs.length} times`,needs:fpairs.length<4?`${4-fpairs.length} more football days to know if it's reliable`:'engine is checking if it\'s the football, the eating before, or the high calorie burn'});}
  }
  const limits=[];
  if(profile.track_cycle&&sorted.length<28) limits.push('Cycle phase × deficit interaction: need a full cycle (28+ days) to compare follicular vs luteal');
  const bfPairs=pairs.filter(p=>p.day.body_fat_pct); if(bfPairs.length<7) limits.push(`Body fat trend: ${bfPairs.length} days logged — needs 14+ for fat-vs-water disambiguation`);
  out.cantSay=limits.slice(0,4);
  return out;
}

function diagnoseDay(log,profile,recentLogs) {
  if (!log) return []; const out=[]; const unit=profile.unit_system||'kg';
  const calIn=log.calories_in; const calOut=log.calories_out; const deficit=(calIn&&calOut)?calOut-calIn:null;
  const protein=log.protein_g; const water=log.water_l; const sleep=log.sleep_hours; const hrv=log.hrv;
  const recentWeights=recentLogs.filter(l=>l.weight_kg).slice(-5).map(l=>l.weight_kg);
  const stalled=recentWeights.length>=3&&(Math.max(...recentWeights)-Math.min(...recentWeights))<0.4;
  if(deficit!==null){
    if(deficit<200) out.push({type:'deficit',tone:'warn',headline:`Deficit only ${Math.round(deficit)} kcal`,detail:"Too small to overcome daily water variation. Don't drop intake — increase output."});
    else if(deficit<400&&stalled) out.push({type:'deficit',tone:'warn',headline:`Deficit of ${Math.round(deficit)} kcal isn't moving the scale`,detail:'Weight stable past few days. More movement (zone 2, walking, NEAT) — not eating less.'});
    else if(deficit>=400&&deficit<=700) out.push({type:'deficit',tone:'good',headline:`Deficit of ${Math.round(deficit)} kcal — sustainable range`,detail:'This is the healthy fat-loss zone. Hold steady.'});
    else if(deficit>800) out.push({type:'deficit',tone:'warn',headline:`Deficit of ${Math.round(deficit)} kcal — too aggressive`,detail:'Sustained deficits >800 kcal in peri cause muscle loss. Eat more — especially around training.'});
  }
  if(water!==null&&water!==undefined&&profile.water_target&&water<profile.water_target*0.7) out.push({type:'water',tone:'warn',headline:`Water is low — ${fmt1(toDisplayWater(water,unit))} ${waterUnit(unit)}`,detail:`Target is ${fmt1(toDisplayWater(profile.water_target,unit))} ${waterUnit(unit)}. Dehydration suppresses fat oxidation and increases hunger.`});
  if(protein!==null&&protein!==undefined&&profile.protein_target&&protein<profile.protein_target*0.8) out.push({type:'protein',tone:'warn',headline:`Protein low — ${protein}g (target ${profile.protein_target}g)`,detail:'Under-eating protein in peri = muscle loss + slower metabolism. Add a protein-forward snack.'});
  if(sleep!==null&&sleep!==undefined&&sleep<6.5) out.push({type:'sleep',tone:'warn',headline:`Sleep was ${fmt1(sleep)}h — too short`,detail:'Under 7h elevates cortisol, raises hunger hormones, and drops NEAT next day by 15-20%.'});
  if(hrv&&log.date){const priorHrvLogs=recentLogs.filter(l=>l.hrv&&l.date!==log.date).slice(-7); if(priorHrvLogs.length>=3){const priorHrvAvg=avg(priorHrvLogs,'hrv'); if(priorHrvAvg&&hrv<priorHrvAvg*0.85){let cause=''; if(log.alcohol_units>0)cause=' Likely the alcohol last night.'; else if(sleep&&sleep<7)cause=' Likely the short sleep.'; out.push({type:'recovery',tone:'warn',headline:`HRV is ${Math.round(((priorHrvAvg-hrv)/priorHrvAvg)*100)}% below your recent average`,detail:`Today: ${hrv}ms vs ${fmt0(priorHrvAvg)}ms average.${cause} Don't push intensity — zone 2 or rest.`});} else if(priorHrvAvg&&hrv>priorHrvAvg*1.10) out.push({type:'recovery',tone:'good',headline:`HRV is ${Math.round(((hrv-priorHrvAvg)/priorHrvAvg)*100)}% above your recent average`,detail:`Today: ${hrv}ms vs ${fmt0(priorHrvAvg)}ms average. Recovery is strong — green light for intensity if your phase allows.`});}}
  return out;
}

function diagnoseRange(logs,profile,label) {
  if(logs.length===0) return []; const out=[]; const unit=profile.unit_system||'kg';
  const avgCalIn=avg(logs,'calories_in'); const avgCalOut=avg(logs,'calories_out'); const avgDeficit=(avgCalIn&&avgCalOut)?avgCalOut-avgCalIn:null;
  const avgSteps=avg(logs,'steps'); const avgSleep=avg(logs,'sleep_hours'); const avgProtein=avg(logs,'protein_g'); const avgWater=avg(logs,'water_l'); const totalAlcohol=logs.reduce((s,l)=>s+(l.alcohol_units||0),0);
  const wLogs=logs.filter(l=>l.weight_kg);
  if(wLogs.length>=2){const wChange=wLogs[wLogs.length-1].weight_kg-wLogs[0].weight_kg; if(Math.abs(wChange)>=0.2) out.push({type:'trajectory',tone:wChange<0?'good':'neutral',headline:wChange<0?`Weight down ${fmt1(toDisplayWeight(Math.abs(wChange),unit))} ${weightUnit(unit)} ${label}`:`Weight up ${fmt1(toDisplayWeight(wChange,unit))} ${weightUnit(unit)} ${label}`,detail:wChange<0?'Trend is moving. Hold the levers that got you here.':'Could be water (alcohol, sodium, luteal) or genuine. Check the body-fat trend.'}); else out.push({type:'trajectory',tone:'neutral',headline:`Weight held steady ${label}`,detail:'Sometimes that\'s the win, sometimes that\'s a stall. Look at the levers below.'});}
  if(avgDeficit!==null){if(avgDeficit<200) out.push({type:'lever',tone:'warn',headline:`Average daily deficit only ${Math.round(avgDeficit)} kcal`,detail:'Too small to drive consistent weight loss. The fix is more output (steps, zone 2, NEAT), not less food.'}); else if(avgDeficit>800) out.push({type:'lever',tone:'warn',headline:`Average daily deficit ${Math.round(avgDeficit)} kcal — too aggressive`,detail:'Sustained over weeks this drops muscle and metabolic rate. Eat more, especially around training.'}); else out.push({type:'lever',tone:'good',headline:`Avg deficit ${Math.round(avgDeficit)} kcal ${label} — sustainable range`,detail:'This is where healthy fat loss happens. Stay here.'});}
  if(avgSleep!==null){if(avgSleep<7) out.push({type:'sleep',tone:'warn',headline:`Average sleep ${fmt1(avgSleep)}h ${label}`,detail:"Sleep is your single biggest free lever. Under 7h consistently is the most common reason \"the diet isn't working.\""}); else if(avgSleep>=7.5) out.push({type:'sleep',tone:'good',headline:`Sleep averaging ${fmt1(avgSleep)}h ${label}`,detail:'This is the foundation. Keep protecting it.'});}
  if(avgWater!==null&&profile.water_target&&avgWater<profile.water_target*0.75) out.push({type:'water',tone:'warn',headline:`Water averaging ${fmt1(toDisplayWater(avgWater,unit))} ${waterUnit(unit)} ${label}`,detail:`Target is ${fmt1(toDisplayWater(profile.water_target,unit))} ${waterUnit(unit)}. Hydration affects fat oxidation, hunger, and HRV.`});
  if(avgProtein!==null&&profile.protein_target){const proteinLogged=logs.filter(l=>l.protein_g); const hitPct=proteinLogged.length?logs.filter(l=>l.protein_g&&l.protein_g>=profile.protein_target).length/proteinLogged.length*100:0; if(hitPct>=80) out.push({type:'protein',tone:'good',headline:`Hit protein target ${Math.round(hitPct)}% of logged days`,detail:'This protects muscle through fat loss. Critical in peri.'}); else if(hitPct<50&&proteinLogged.length>=3) out.push({type:'protein',tone:'warn',headline:`Hit protein only ${Math.round(hitPct)}% of days`,detail:'Under-eating protein is the fastest way to lose muscle alongside fat.'});}
  if(avgSteps!==null&&profile.baseline_steps){if(avgSteps>=profile.baseline_steps) out.push({type:'steps',tone:'good',headline:`Averaging ${fmt0(avgSteps)} steps/day ${label}`,detail:'NEAT is where the deficit lives — not the gym. Keep this up.'}); else if(avgSteps<profile.baseline_steps*0.7) out.push({type:'steps',tone:'warn',headline:`Steps averaged ${fmt0(avgSteps)} ${label}`,detail:'Well below baseline. Easiest lever to increase deficit without restricting food.'});}
  if(totalAlcohol>7) out.push({type:'alcohol',tone:'warn',headline:`${totalAlcohol} units of alcohol ${label}`,detail:'Alcohol suppresses fat oxidation for 36+ hours, tanks HRV, fragments sleep.'});
  const hrvLogs=logs.filter(l=>l.hrv); if(hrvLogs.length>=5){const fh=hrvLogs.slice(0,Math.floor(hrvLogs.length/2)); const sh=hrvLogs.slice(Math.floor(hrvLogs.length/2)); const hrvDiff=avg(sh,'hrv')-avg(fh,'hrv'); if(Math.abs(hrvDiff)>=3) out.push({type:'recovery',tone:hrvDiff>0?'good':'warn',headline:hrvDiff>0?'HRV trending up — recovery is improving':'HRV trending down — recovery debt building',detail:hrvDiff>0?`Up ${Math.round(hrvDiff)}ms across ${label}. Whatever you're doing for sleep, stress and load is working.`:`Down ${Math.round(Math.abs(hrvDiff))}ms across ${label}. Pulling sleep, alcohol, training load and stress will all help.`});}
  const allSessions=logs.flatMap(l=>l.sessions||[]); const sessionCals=allSessions.filter(s=>s.calories).reduce((sum,s)=>sum+s.calories,0);
  if(sessionCals>0&&logs.length>=3) out.push({type:'training',tone:'neutral',headline:`Burned ${fmt0(sessionCals)} kcal in tracked sessions ${label}`,detail:`${(sessionCals/logs.length).toFixed(0)} kcal/day from training. NEAT usually 2-3x this number.`});
  return out;
}

function calcAdherence(log,profile) {
  if(!log) return {score:null,category:null}; if(log.is_refeed) return {score:null,category:'refeed'};
  const checks=[];
  if(profile.protein_target&&log.protein_g) checks.push(log.protein_g>=profile.protein_target?1:0);
  if(profile.water_target&&log.water_l) checks.push(log.water_l>=profile.water_target*0.9?1:0);
  if(profile.sleep_target&&log.sleep_hours) checks.push(log.sleep_hours>=profile.sleep_target*0.9?1:0);
  if(profile.baseline_steps&&log.steps) checks.push(log.steps>=profile.baseline_steps*0.85?1:0);
  if(log.alcohol_units!==null&&log.alcohol_units!==undefined) checks.push(log.alcohol_units<=2?1:0);
  if(checks.length===0) return {score:null,category:null};
  const score=Math.round((checks.reduce((s,v)=>s+v,0)/checks.length)*100);
  return {score,category:score>=80?'on_plan':score>=50?'partial':'off_plan'};
}

function progressStatus(logs,profile) {
  const daysLogged=logs.length; const out={daysLogged,streak:0,nextUnlock:null,tinyWins:[]};
  let streak=0; const dateSet=new Set(logs.map(l=>l.date)); let cursor=today();
  if(!dateSet.has(ymd(cursor))) cursor=new Date(cursor.getTime()-86400000);
  while(dateSet.has(ymd(cursor))){streak++;cursor=new Date(cursor.getTime()-86400000);}
  out.streak=streak;
  if(daysLogged<3) out.nextUnlock=`${3-daysLogged} more day${3-daysLogged===1?'':'s'} until your first weight trend`;
  else if(daysLogged<7) out.nextUnlock=`${7-daysLogged} more day${7-daysLogged===1?'':'s'} until correlations unlock`;
  else if(daysLogged<14) out.nextUnlock=`${14-daysLogged} more day${14-daysLogged===1?'':'s'} until full cycle insights`;
  else if(daysLogged<28) out.nextUnlock=`${28-daysLogged} more day${28-daysLogged===1?'':'s'} until your recovery baseline locks in`;
  if(daysLogged>=2){
    const wLogs=logs.filter(l=>l.weight_kg); if(wLogs.length>=2){const change=wLogs[wLogs.length-1].weight_kg-wLogs[0].weight_kg; if(change<-0.1) out.tinyWins.push(`Weight down ${fmt1(toDisplayWeight(Math.abs(change),profile.unit_system))} ${weightUnit(profile.unit_system)} since first log`);}
    const proteinHits=logs.filter(l=>l.protein_g&&profile.protein_target&&l.protein_g>=profile.protein_target).length; if(proteinHits>=2) out.tinyWins.push(`Hit protein target ${proteinHits} of ${daysLogged} days`);
    const stepDays=logs.filter(l=>l.steps&&profile.baseline_steps&&l.steps>=profile.baseline_steps).length; if(stepDays>=2) out.tinyWins.push(`Hit step target ${stepDays} of ${daysLogged} days`);
  }
  return out;
}

function MultiLineChart({series,w=480,h=180}) {
  const leftSeries=series.filter(s=>s.axis==='left'); const rightSeries=series.filter(s=>s.axis==='right');
  const leftAll=leftSeries.flatMap(s=>s.values).filter(v=>v!==null&&v!==undefined);
  const rightAll=rightSeries.flatMap(s=>s.values).filter(v=>v!==null&&v!==undefined);
  if(!leftAll.length&&!rightAll.length) return <div style={{fontSize:12,color:'var(--text-faint)',fontStyle:'italic',padding:'24px 0',textAlign:'center'}}>Charts appear after a few days of logging.</div>;
  const leftMin=leftAll.length?Math.min(...leftAll):0; const leftMax=leftAll.length?Math.max(...leftAll):1; const leftRange=leftMax-leftMin||1;
  const rightMin=rightAll.length?Math.min(...rightAll):0; const rightMax=rightAll.length?Math.max(...rightAll):1; const rightRange=rightMax-rightMin||1;
  const n=series[0]?.values.length||0; const padX=30; const padY=16; const innerW=w-padX*2; const innerH=h-padY*2;
  const pointsFor=(s)=>s.values.map((v,i)=>{if(v===null||v===undefined)return null; const x=padX+(i/Math.max(n-1,1))*innerW; const min=s.axis==='left'?leftMin:rightMin; const range=s.axis==='left'?leftRange:rightRange; const y=padY+innerH-((v-min)/range)*innerH; return{x,y};}).filter(Boolean);
  return (<svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{display:'block'}}>
    {[0,0.25,0.5,0.75,1].map(t=><line key={t} x1={padX} y1={padY+t*innerH} x2={padX+innerW} y2={padY+t*innerH} stroke="rgba(11,29,33,0.08)" strokeWidth={0.5}/>)}
    {series.map((s,si)=>{const pts=pointsFor(s); if(!pts.length)return null; const pathD=pts.map((p,i)=>`${i===0?'M':'L'} ${p.x} ${p.y}`).join(' '); return(<g key={si}><path d={pathD} fill="none" stroke={s.color} strokeWidth={2.5}/>{pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={i===pts.length-1?4:2.5} fill={s.color}/>)}</g>);})}
    {leftAll.length>0&&<><text x={padX-4} y={padY+4} fontSize="9" fill={leftSeries[0].color} textAnchor="end">{leftMax.toFixed(1)}</text><text x={padX-4} y={padY+innerH} fontSize="9" fill={leftSeries[0].color} textAnchor="end">{leftMin.toFixed(1)}</text></>}

    {(()=>{const last14=[]; for(let i=13;i>=0;i--){const d=ymd(new Date(today().getTime()-i*86400000));last14.push(logs.find(l=>l.date===d)||{});} const hrvVals=last14.map(l=>l.hrv||null); const rhrVals=last14.map(l=>l.rhr||null); if(hrvVals.filter(v=>v!==null).length<2&&rhrVals.filter(v=>v!==null).length<2)return null; const latestHrv=[...hrvVals].reverse().find(v=>v!==null); const latestRhr=[...rhrVals].reverse().find(v=>v!==null); return(<div className="card" style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',flexWrap:'wrap',gap:12,marginBottom:12}}><div className="label">Recovery trend · 14 days</div><div style={{display:'flex',gap:18,fontSize:12,color:'var(--text-mute)'}}>{latestHrv&&baselines.hrvAvg&&<span>HRV: <strong style={{color:latestHrv>=baselines.hrvAvg?'var(--success)':'var(--pink)'}}>{latestHrv}ms</strong> <span style={{color:'var(--text-faint)'}}>(avg {fmt0(baselines.hrvAvg)})</span></span>}{latestRhr&&baselines.rhrAvg&&<span>RHR: <strong style={{color:latestRhr<=baselines.rhrAvg?'var(--success)':'var(--pink)'}}>{latestRhr}bpm</strong> <span style={{color:'var(--text-faint)'}}>(avg {fmt0(baselines.rhrAvg)})</span></span>}</div></div><ChartLegend items={[{color:'#00687a',label:'HRV (ms)'},{color:'#ff5bcf',label:'RHR (bpm)'}]}/><div style={{marginTop:6}}><MultiLineChart series={[{values:hrvVals,color:'#00687a',axis:'left'},{values:rhrVals,color:'#ff5bcf',axis:'right'}]} h={160}/></div></div>);})()}
    <div className="row row-5" style={{marginBottom:16}}>
      <div className="card"><div className="label">Recovery</div><div className="stat-num" style={{marginTop:8}}>{recovery===null?'—':recovery.toFixed(2)}</div><div style={{display:'flex',alignItems:'center',gap:6,marginTop:8}}><span style={{width:7,height:7,borderRadius:'50%',background:recDot}}/><span className="stat-sub" style={{margin:0}}>{rec.label}</span></div></div>
      <div className="card"><div className="label">Today's steps</div><div className="stat-num" style={{marginTop:8}}>{stepTarget?stepTarget.toLocaleString():'—'}</div><div className="stat-sub">target</div></div>
      <div className="card"><div className="label">Weight (7-day)</div><div className="stat-num" style={{marginTop:8}}>{weight7d!==null?fmt1(toDisplayWeight(weight7d,unit)):'—'}<span style={{fontSize:13,color:'var(--text-mute)',marginLeft:4}}>{weightUnit(unit)}</span></div>{change!==null&&<div className="stat-sub" style={{color:change<=0?'var(--success)':'var(--text-mute)'}}>{change>0?'+':''}{fmt1(toDisplayWeight(change,unit))} from start</div>}</div>
      <div className="card"><div className="label">Phase</div><div className="stat-num-sm" style={{marginTop:8,color:'var(--teal)'}}>{phase||'—'}</div><div className="stat-sub">{cycleDay?`day ${cycleDay}`:'not tracking'}</div></div>
      <div className="card"><div className="label">Days to goal</div><div className="stat-num" style={{marginTop:8}}>{daysLeft??'—'}</div><div className="stat-sub">{totalChange!==null&&change!==null?`${fmt1(toDisplayWeight(change,unit))} of ${fmt1(toDisplayWeight(totalChange,unit))} ${weightUnit(unit)}`:'—'}</div></div>
    </div>
    {profile.track_cycle&&cycleDay&&(<div className="card" style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}><div className="label">Cycle</div><div style={{fontSize:10,color:'var(--text-mute)',display:'flex',gap:12,flexWrap:'wrap'}}><span><span style={{display:'inline-block',width:8,height:8,background:'var(--pink)',borderRadius:2,marginRight:4}}/>Menstrual</span><span><span style={{display:'inline-block',width:8,height:8,background:'rgba(255,91,207,0.5)',borderRadius:2,marginRight:4}}/>Follicular</span><span><span style={{display:'inline-block',width:8,height:8,background:'var(--gold)',borderRadius:2,marginRight:4}}/>Ovulatory</span><span><span style={{display:'inline-block',width:8,height:8,background:'var(--teal)',borderRadius:2,marginRight:4}}/>Luteal</span></div></div><CycleBar cycleDay={cycleDay} cycleLen={profile.cycle_length||28} periodLen={profile.period_length||5}/></div>)}
    {guide&&(<div className="card" style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:14}}><h3 style={{fontSize:17,fontWeight:600}}>{phase} guidance</h3><span className="pill pill-teal">day {cycleDay} of {profile.cycle_length||28}</span></div><div className="row row-3"><div><div className="label" style={{color:'var(--pink)',marginBottom:6}}>Prioritize</div><p style={{fontSize:13,lineHeight:1.6,color:'var(--text)'}}>{guide.prioritize}</p></div><div><div className="label" style={{color:'var(--pink)',marginBottom:6}}>Train</div><p style={{fontSize:13,lineHeight:1.6,color:'var(--text)'}}>{guide.train}</p></div><div><div className="label" style={{color:'var(--pink)',marginBottom:6}}>Eat</div><p style={{fontSize:13,lineHeight:1.6,color:'var(--text)'}}>{guide.eat}</p></div></div></div>)}
    {!todayLog&&(<div className="card" style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}><div><h3 style={{fontSize:15,fontWeight:600,marginBottom:4}}>Haven't logged today yet</h3><p style={{fontSize:13,color:'var(--text-mute)'}}>Open the Daily log to fill in today's data.</p></div><button onClick={()=>setView('log')} className="btn">Log today</button></div>)}
  </div>);
}

function Logbook({logs,profile}) {
  const unit=profile.unit_system||'kg'; const [expanded,setExpanded]=useState(false); const [range,setRange]=useState(14);
  const days=useMemo(()=>{const out=[]; for(let i=0;i<range;i++){const d=ymd(new Date(today().getTime()-i*86400000)); const log=logs.find(l=>l.date===d); out.push({date:d,log});} return out;},[logs,range]);
  if(!days.some(d=>d.log)) return(<div className="card"><p style={{fontSize:14,color:'var(--text-mute)',lineHeight:1.6,textAlign:'center',padding:'20px 0'}}>No data logged yet for this range.</p></div>);
  const essentials=[{key:'weight',label:'Weight',val:(l)=>l.weight_kg?fmt1(toDisplayWeight(l.weight_kg,unit)):''},{key:'bf',label:'BF%',val:(l)=>l.body_fat_pct??''},{key:'sleep',label:'Sleep',val:(l)=>l.sleep_hours?fmt1(l.sleep_hours)+'h':''},{key:'steps',label:'Steps',val:(l)=>l.steps?l.steps.toLocaleString():''},{key:'calin',label:'Cal in',val:(l)=>l.calories_in??''},{key:'calout',label:'Cal out',val:(l)=>l.calories_out??''},{key:'protein',label:'Protein',val:(l)=>l.protein_g?l.protein_g+'g':''},{key:'sessions',label:'Sessions',val:(l)=>{const ss=l.sessions||[]; if(!ss.length)return ''; return ss.map(s=>`${s.timeOfDay||''} ${s.type.slice(0,4)}${s.duration}'`).join(', ');}}];
  const extras=[{key:'muscle',label:'Muscle',val:(l)=>l.muscle_kg?fmt1(toDisplayWeight(l.muscle_kg,unit)):''},{key:'hrv',label:'HRV',val:(l)=>l.hrv??''},{key:'rhr',label:'RHR',val:(l)=>l.rhr??''},{key:'sleepq',label:'Sleep Q',val:(l)=>l.sleep_quality?l.sleep_quality+'/5':''},{key:'water',label:'Water',val:(l)=>l.water_l?fmt1(toDisplayWater(l.water_l,unit)):''},{key:'alc',label:'Alc',val:(l)=>l.alcohol_units?l.alcohol_units+'u':''},{key:'mood',label:'Mood',val:(l)=>l.mood?l.mood+'/5':''},{key:'stress',label:'Stress',val:(l)=>l.stress?l.stress+'/5':''}];
  const cols=expanded?[...essentials,...extras]:essentials;
  return(<><div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}}><div style={{display:'flex',gap:6}}>{[{id:7,label:'7 days'},{id:14,label:'14 days'},{id:30,label:'30 days'}].map(r=>(<button key={r.id} onClick={()=>setRange(r.id)} style={{padding:'6px 12px',borderRadius:6,background:range===r.id?'var(--teal)':'white',color:range===r.id?'white':'var(--text)',border:`1px solid ${range===r.id?'var(--teal)':'var(--border)'}`,fontSize:12,fontWeight:600,cursor:'pointer'}}>{r.label}</button>))}</div><button onClick={()=>setExpanded(!expanded)} className="btn-ghost" style={{padding:'6px 12px',fontSize:12}}>{expanded?'− Show essentials':'+ Show all columns'}</button></div>
  <div className="card" style={{overflowX:'auto',padding:0}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}><thead><tr style={{background:'var(--surface-2)',textAlign:'left'}}><th style={{padding:'10px 12px',fontWeight:600,fontSize:11,color:'var(--text-mute)',textTransform:'uppercase',letterSpacing:0.5,position:'sticky',left:0,background:'var(--surface-2)',zIndex:1}}>Date</th>{cols.map(c=>(<th key={c.key} style={{padding:'10px 8px',fontWeight:600,fontSize:11,color:'var(--text-mute)',textTransform:'uppercase',letterSpacing:0.5,whiteSpace:'nowrap'}}>{c.label}</th>))}</tr></thead><tbody>{days.map((d,i)=>{const isToday=d.date===ymd(today());const empty=!d.log; return(<tr key={d.date} style={{borderTop:'1px solid var(--divider)',background:isToday?'rgba(0,104,122,0.04)':'transparent',opacity:empty?0.4:1}}><td style={{padding:'8px 12px',fontWeight:isToday?700:500,color:'var(--text)',position:'sticky',left:0,background:isToday?'#f0f6f7':'white',whiteSpace:'nowrap',borderRight:'1px solid var(--divider)'}}>  {(()=>{const dt=parseYMD(d.date); return `${dt.toLocaleDateString('en-GB',{weekday:'short'})} ${dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;})()}</td>{cols.map(c=>(<td key={c.key} style={{padding:'8px',whiteSpace:'nowrap',color:'var(--text)'}}>{empty?'—':(c.val(d.log)||'·')}</td>))}</tr>);})}</tbody></table></div>
  <p style={{fontSize:11,color:'var(--text-faint)',marginTop:10,lineHeight:1.5}}>Look across rows for your own patterns.</p></>);
}

function DailyLog({profile,logs,todayLog,onLogSaved}) {
  const unit=profile.unit_system||'kg'; const [mode,setMode]=useState('log'); const [date,setDate]=useState(ymd(today()));
  const [weight,setWeight]=useState(''); const [bodyFat,setBodyFat]=useState(''); const [muscle,setMuscle]=useState(''); const [bodyWater,setBodyWater]=useState('');
  const [hrv,setHrv]=useState(''); const [rhr,setRhr]=useState(''); const [sleep,setSleep]=useState(''); const [sleepQuality,setSleepQuality]=useState('');
  const [steps,setSteps]=useState(''); const [caloriesIn,setCaloriesIn]=useState(''); const [caloriesOut,setCaloriesOut]=useState('');
  const [protein,setProtein]=useState(''); const [carbs,setCarbs]=useState(''); const [fat,setFat]=useState(''); const [fibre,setFibre]=useState('');
  const [water,setWater]=useState(''); const [mealCount,setMealCount]=useState(''); const [firstMealTime,setFirstMealTime]=useState(''); const [lastMealTime,setLastMealTime]=useState(''); const [isRefeed,setIsRefeed]=useState(false);
  const [mood,setMood]=useState(''); const [stress,setStress]=useState(''); const [caffeine,setCaffeine]=useState(''); const [alcohol,setAlcohol]=useState('');
  const [sessions,setSessions]=useState([]); const [periodToday,setPeriodToday]=useState(false); const [notes,setNotes]=useState('');
  const [showAddSession,setShowAddSession]=useState(false); const [saving,setSaving]=useState(false); const [savedAt,setSavedAt]=useState(null);

  const selectedLog=useMemo(()=>logs.find(l=>l.date===date),[logs,date]);
  const recentDays=useMemo(()=>{const out=[]; for(let i=0;i<7;i++){const d=ymd(new Date(today().getTime()-i*86400000)); const log=logs.find(l=>l.date===d); out.push({date:d,log,hasData:!!log});} return out;},[logs]);

  function applyFormState(src) {
    setWeight(src.weight??''); setBodyFat(src.bodyFat??''); setMuscle(src.muscle??''); setBodyWater(src.bodyWater??'');
    setHrv(src.hrv??''); setRhr(src.rhr??''); setSleep(src.sleep??''); setSleepQuality(src.sleepQuality??'');
    setSteps(src.steps??''); setCaloriesIn(src.caloriesIn??''); setCaloriesOut(src.caloriesOut??'');
    setProtein(src.protein??''); setCarbs(src.carbs??''); setFat(src.fat??''); setFibre(src.fibre??'');
    setWater(src.water??''); setMealCount(src.mealCount??''); setFirstMealTime(src.firstMealTime??''); setLastMealTime(src.lastMealTime??''); setIsRefeed(!!src.isRefeed);
    setMood(src.mood??''); setStress(src.stress??''); setCaffeine(src.caffeine??''); setAlcohol(src.alcohol??'');
    setSessions(Array.isArray(src.sessions)?src.sessions:[]); setPeriodToday(!!src.periodToday); setNotes(src.notes??'');
  }

  useEffect(()=>{
    const src=selectedLog;
    if(!src){applyFormState({weight:'',bodyFat:'',muscle:'',bodyWater:'',hrv:'',rhr:'',sleep:'',sleepQuality:'',steps:'',caloriesIn:'',caloriesOut:'',protein:'',carbs:'',fat:'',fibre:'',water:'',mealCount:'',firstMealTime:'',lastMealTime:'',isRefeed:false,mood:'',stress:'',caffeine:'',alcohol:'',sessions:[],periodToday:false,notes:''});setSavedAt(null);return;}
    applyFormState({weight:src.weight_kg?fmt1(toDisplayWeight(src.weight_kg,unit)):'',bodyFat:src.body_fat_pct||'',muscle:src.muscle_kg?fmt1(toDisplayWeight(src.muscle_kg,unit)):'',bodyWater:src.body_water_pct||'',hrv:src.hrv||'',rhr:src.rhr||'',sleep:src.sleep_hours||'',sleepQuality:src.sleep_quality||'',steps:src.steps||'',caloriesIn:src.calories_in||'',caloriesOut:src.calories_out||'',protein:src.protein_g||'',carbs:src.carbs_g||'',fat:src.fat_g||'',fibre:src.fibre_g||'',water:src.water_l?fmt1(toDisplayWater(src.water_l,unit)):'',mealCount:src.meal_count||'',firstMealTime:src.first_meal_time||'',lastMealTime:src.last_meal_time||'',isRefeed:!!src.is_refeed,mood:src.mood||'',stress:src.stress||'',caffeine:src.caffeine_mg?(src.caffeine_mg/95).toFixed(1):'',alcohol:src.alcohol_units||'',sessions:src.sessions||[],periodToday:!!src.period_today,notes:src.notes||''});
    setSavedAt(null);
  },[selectedLog,unit,date]);

  async function saveLog() {
    setSaving(true);
    const row={user_id:profile.user_id,date,weight_kg:fromDisplayWeight(weight,unit),body_fat_pct:bodyFat?Number(bodyFat):null,muscle_kg:fromDisplayWeight(muscle,unit),body_water_pct:bodyWater?Number(bodyWater):null,hrv:hrv?Number(hrv):null,rhr:rhr?Number(rhr):null,sleep_hours:sleep?Number(sleep):null,sleep_quality:sleepQuality?Number(sleepQuality):null,steps:steps?Number(steps):null,calories_in:caloriesIn?Number(caloriesIn):null,calories_out:caloriesOut?Number(caloriesOut):null,protein_g:protein?Number(protein):null,carbs_g:carbs?Number(carbs):null,fat_g:fat?Number(fat):null,fibre_g:fibre?Number(fibre):null,water_l:fromDisplayWater(water,unit),meal_count:mealCount?Number(mealCount):null,first_meal_time:firstMealTime||null,last_meal_time:lastMealTime||null,is_refeed:isRefeed,mood:mood?Number(mood):null,stress:stress?Number(stress):null,caffeine_mg:caffeine?Math.round(Number(caffeine)*95):null,alcohol_units:alcohol?Number(alcohol):null,sessions,period_today:periodToday,notes};
    const adh=calcAdherence(row,profile); row.adherence_score=adh.score; row.adherence_category=adh.category;
    const{error}=await db.from('daily_logs').upsert(row,{onConflict:'user_id,date'});
    if(!error&&!profile.trial_started_at) await db.from('profiles').update({trial_started_at:new Date().toISOString()}).eq('user_id',profile.user_id);
    if(!error&&periodToday) await db.from('profiles').update({last_period_start:date}).eq('user_id',profile.user_id);
    setSaving(false); if(error){alert('Could not save: '+error.message);return;} setSavedAt(new Date()); onLogSaved();
  }

  return(<div className="fade-in">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:16}}><div><h1 className="page-title">Daily log</h1><p className="page-sub">{mode==='log'?'Fill what you can — come back later to add more.':'Your data, day by day.'}</p></div><div style={{display:'flex',gap:10,alignItems:'center'}}>{mode==='log'&&(<><input type="date" className="input" value={date} onChange={e=>setDate(e.target.value)} style={{width:170}} max={ymd(today())}/><button onClick={saveLog} disabled={saving} className="btn">{saving?'Saving…':savedAt?'✓ Saved':'Save'}</button></>)}</div></div>
    <div style={{display:'flex',gap:6,marginBottom:18}}>{[{id:'log',label:'Log a day'},{id:'book',label:'Logbook'}].map(m=>(<button key={m.id} onClick={()=>setMode(m.id)} style={{padding:'8px 18px',borderRadius:8,background:mode===m.id?'var(--teal)':'white',color:mode===m.id?'white':'var(--text)',border:`1px solid ${mode===m.id?'var(--teal)':'var(--border)'}`,fontSize:13,fontWeight:600,cursor:'pointer'}}>{m.label}</button>))}</div>
    {mode==='book'&&<Logbook logs={logs} profile={profile}/>}
    {mode==='log'&&(<>
      <div className="card" style={{marginBottom:14,padding:14}}><div className="label" style={{marginBottom:10}}>Jump to a day</div><div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{recentDays.map((d,i)=>{const dt=parseYMD(d.date); const isSelected=d.date===date; const isToday=d.date===ymd(today()); const dayName=isToday?'Today':i===1?'Yest':dt.toLocaleDateString('en-GB',{weekday:'short'}); const dayNum=dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); return(<button key={d.date} onClick={()=>setDate(d.date)} style={{flex:'1 1 auto',minWidth:78,padding:'10px 8px',borderRadius:10,border:`1px solid ${isSelected?'var(--teal)':'var(--border)'}`,background:isSelected?'var(--teal)':'white',color:isSelected?'white':'var(--text)',cursor:'pointer',textAlign:'center',position:'relative'}}><div style={{fontSize:11,opacity:isSelected?0.85:0.6,marginBottom:2}}>{dayName}</div><div style={{fontSize:13,fontWeight:600}}>{dayNum}</div>{d.hasData&&<div style={{position:'absolute',top:6,right:8,width:6,height:6,borderRadius:'50%',background:isSelected?'var(--gold)':'var(--success)'}}/>}</button>);})}</div></div>

      {profile.track_cycle&&(<div className="card" style={{marginBottom:14}}><label style={{display:'flex',alignItems:'center',gap:10,fontSize:14}}><input type="checkbox" checked={periodToday} onChange={e=>setPeriodToday(e.target.checked)} style={{width:18,height:18,accentColor:'var(--pink)'}}/>Period started today</label>{periodToday&&<p style={{fontSize:12,color:'var(--text-mute)',marginTop:6,marginLeft:28}}>We'll reset your cycle day so phase guidance recalibrates from today.</p>}</div>)}
      <div className="card" style={{marginBottom:14}}><h3 style={{fontSize:14,fontWeight:600,marginBottom:12,color:'var(--teal)'}}>Notes</h3><textarea rows="3" className="input" style={{resize:'vertical'}} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="How did the day feel? Anything to remember?"/></div>

}

// CYCLE INSIGHTS
// ============================================================
function CycleInsights({profile,logs}) {
  const unit=profile.unit_system||'kg'; let cycleDay=null,phase=null;
  if(profile.track_cycle&&profile.last_period_start){const days=daysBetween(parseYMD(profile.last_period_start),today()); if(days>=0){cycleDay=days+1; phase=calcPhase(cycleDay,profile.cycle_length,profile.period_length);}}
  const guide=phase?PHASE_GUIDANCE[phase]:null;
  const phaseAvgs=useMemo(()=>{
    if(!profile.last_period_start)return null;
    const out={Menstrual:{weights:[],hrv:[]},Follicular:{weights:[],hrv:[]},Ovulatory:{weights:[],hrv:[]},Luteal:{weights:[],hrv:[]}};
    for(const l of logs){const d=daysBetween(parseYMD(profile.last_period_start),parseYMD(l.date)); if(d<0)continue; const cd=(d%(profile.cycle_length||28))+1; const p=calcPhase(cd,profile.cycle_length,profile.period_length); if(!p)continue; if(l.weight_kg)out[p].weights.push(l.weight_kg); if(l.hrv)out[p].hrv.push(l.hrv);}
    return out;
  },[logs,profile]);
  return(<div className="fade-in"><h1 className="page-title">Cycle insights</h1><p className="page-sub">How your body responds across your cycle.</p>
    {!profile.track_cycle?(<div className="card"><p style={{fontSize:14,color:'var(--text-mute)'}}>Cycle tracking is off. Enable it in Settings to see this page.</p></div>)
    :!cycleDay?(<div className="card"><p style={{fontSize:14,color:'var(--text-mute)'}}>Add your last period start date in Settings to unlock cycle insights.</p></div>)
    :(<><div className="card" style={{marginBottom:14}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><h2 style={{fontSize:22,fontWeight:600,color:'var(--teal)'}}>{phase}</h2><span className="pill pill-pink">Day {cycleDay} of {profile.cycle_length||28}</span></div><CycleBar cycleDay={cycleDay} cycleLen={profile.cycle_length||28} periodLen={profile.period_length||5}/></div>
    {guide&&(<div className="row row-3" style={{marginBottom:14}}><div className="card"><div className="label" style={{color:'var(--pink)'}}>Prioritize</div><p style={{fontSize:14,lineHeight:1.6,marginTop:8}}>{guide.prioritize}</p></div><div className="card"><div className="label" style={{color:'var(--pink)'}}>Train</div><p style={{fontSize:14,lineHeight:1.6,marginTop:8}}>{guide.train}</p></div><div className="card"><div className="label" style={{color:'var(--pink)'}}>Eat</div><p style={{fontSize:14,lineHeight:1.6,marginTop:8}}>{guide.eat}</p></div></div>)}
    {phaseAvgs&&(<div className="card" style={{marginBottom:14}}><h3 style={{fontSize:15,fontWeight:600,marginBottom:14}}>How you log across phases</h3><table><thead><tr><th>Phase</th><th>Days logged</th><th>Avg weight ({weightUnit(unit)})</th><th>Avg HRV (ms)</th></tr></thead><tbody>{Object.entries(phaseAvgs).map(([p,data])=>(<tr key={p}><td style={{fontWeight:500,color:p===phase?'var(--teal)':'var(--text)'}}>{p}{p===phase?' · today':''}</td><td>{Math.max(data.weights.length,data.hrv.length)}</td><td>{data.weights.length?fmt1(toDisplayWeight(data.weights.reduce((a,b)=>a+b,0)/data.weights.length,unit)):'—'}</td><td>{data.hrv.length?Math.round(data.hrv.reduce((a,b)=>a+b,0)/data.hrv.length):'—'}</td></tr>))}</tbody></table></div>)}</>)}
  </div>);
}

function WeightTrends({profile,logs}) {
  const unit=profile.unit_system||'kg';
  const last30=useMemo(()=>{const out=[]; for(let i=29;i>=0;i--){const d=ymd(new Date(today().getTime()-i*86400000)); out.push(logs.find(l=>l.date===d)||{});} return out;},[logs]);
  const weights=last30.map(l=>l.weight_kg?toDisplayWeight(l.weight_kg,unit):null); const bf=last30.map(l=>l.body_fat_pct||null); const muscle=last30.map(l=>l.muscle_kg?toDisplayWeight(l.muscle_kg,unit):null); const water=last30.map(l=>l.body_water_pct||null); const calIn30=last30.map(l=>l.calories_in||null); const calOut30=last30.map(l=>l.calories_out||null); const steps30=last30.map(l=>l.steps||null);
  const w7=avg(logs.slice(-7),'weight_kg'); const w14=avg(logs.slice(-14),'weight_kg'); const w28=avg(logs.slice(-28),'weight_kg'); const startW=profile.start_weight_kg;
  const allInsights=useMemo(()=>generateInsights(logs,profile),[logs,profile]);
  const bodyInsights=useMemo(()=>{
    const list=[...allInsights.wins.filter(it=>it.scope==='body'),...allInsights.gaps.filter(it=>it.scope==='body'),...allInsights.stalls.filter(it=>it.scope==='body'),...allInsights.cycle.filter(it=>it.scope==='body')];
    if(logs.length>=3){const wLogs=logs.filter(l=>l.weight_kg); if(wLogs.length>=3){const wDiff=wLogs[wLogs.length-1].weight_kg-wLogs[0].weight_kg; list.push({headline:wDiff<0?`Weight down ${fmt1(toDisplayWeight(Math.abs(wDiff),unit))} ${weightUnit(unit)} since first log`:Math.abs(wDiff)<0.15?'Weight stable since first log':`Weight up ${fmt1(toDisplayWeight(wDiff,unit))} ${weightUnit(unit)} since first log`,detail:wDiff<0?'Scale is moving. Keep watching the 7-day average.':Math.abs(wDiff)<0.15?'Need 2+ weeks for a real signal.':'Could be water or genuine gain. Check the body-fat trend.',tone:wDiff<0?'good':'neutral'});}}
    if(logs.length>=7){const bfLogs=logs.filter(l=>l.body_fat_pct); if(bfLogs.length>=5){const bfDiff=bfLogs[bfLogs.length-1].body_fat_pct-bfLogs[0].body_fat_pct; if(Math.abs(bfDiff)>=0.3) list.push({headline:bfDiff<0?`Body fat down ${fmt1(Math.abs(bfDiff))}% since first log`:`Body fat up ${fmt1(bfDiff)}% since first log`,detail:bfDiff<0?'Body fat is the real signal — keep going.':'Body fat trending up. Check protein, training volume, and sleep.',tone:bfDiff<0?'good':'warn'});} const mLogs=logs.filter(l=>l.muscle_kg); if(mLogs.length>=5){const mDiff=mLogs[mLogs.length-1].muscle_kg-mLogs[0].muscle_kg; if(Math.abs(mDiff)>=0.2) list.push({headline:mDiff>=0?`Muscle up ${fmt1(toDisplayWeight(mDiff,unit))} ${weightUnit(unit)} since first log`:`Muscle down ${fmt1(toDisplayWeight(Math.abs(mDiff),unit))} ${weightUnit(unit)} since first log`,detail:mDiff>=0?"Adding muscle in peri is hard. You're doing the work.":'In peri, muscle loss accelerates fat regain. Increase protein, add 2-3 strength sessions/week.',tone:mDiff>=0?'good':'warn'});}}
    return list;
  },[allInsights,logs,profile,unit]);
  return(<div className="fade-in"><h1 className="page-title">Weight trends</h1><p className="page-sub">Body composition — what the scale won't tell you alone.</p>
    {bodyInsights.length===0?(<div className="card-teal" style={{marginBottom:14}}><div className="label" style={{color:'rgba(255,255,255,0.7)',marginBottom:10}}>Body composition insights</div><p style={{fontSize:14,opacity:0.9,lineHeight:1.6}}>Log weight and body fat to start seeing your real trend.</p></div>)
    :(<div className="card-teal" style={{marginBottom:14}}><div className="label" style={{color:'rgba(255,255,255,0.7)',marginBottom:12}}>Body composition insights</div><div style={{display:'flex',flexDirection:'column',gap:12}}>{bodyInsights.map((it,i)=>{const dotColor=it.tone==='good'?'var(--gold)':it.tone==='warn'?'var(--pink)':'rgba(255,255,255,0.5)'; return(<div key={i} style={{background:'rgba(255,255,255,0.08)',borderRadius:10,padding:14,display:'flex',gap:12,alignItems:'flex-start'}}><span style={{width:6,height:6,borderRadius:'50%',background:dotColor,marginTop:8,flexShrink:0}}/><div><div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{it.headline}</div><div style={{fontSize:13,opacity:0.9,lineHeight:1.55}}>{it.detail}</div></div></div>);})}</div></div>)}
    <div className="row row-4" style={{marginBottom:14}}><div className="card"><div className="label">Start</div><div className="stat-num-sm" style={{marginTop:8}}>{startW?fmt1(toDisplayWeight(startW,unit)):'—'} <span style={{fontSize:12,color:'var(--text-mute)'}}>{weightUnit(unit)}</span></div></div><div className="card"><div className="label">7-day avg</div><div className="stat-num-sm" style={{marginTop:8}}>{w7!==null?fmt1(toDisplayWeight(w7,unit)):'—'} <span style={{fontSize:12,color:'var(--text-mute)'}}>{weightUnit(unit)}</span></div>{w7!==null&&startW&&<div className="stat-sub" style={{color:w7<=startW?'var(--success)':'var(--text-mute)'}}>{fmt1(toDisplayWeight(w7-startW,unit))} from start</div>}</div><div className="card"><div className="label">14-day avg</div><div className="stat-num-sm" style={{marginTop:8}}>{w14!==null?fmt1(toDisplayWeight(w14,unit)):'—'} <span style={{fontSize:12,color:'var(--text-mute)'}}>{weightUnit(unit)}</span></div></div><div className="card"><div className="label">28-day avg</div><div className="stat-num-sm" style={{marginTop:8}}>{w28!==null?fmt1(toDisplayWeight(w28,unit)):'—'} <span style={{fontSize:12,color:'var(--text-mute)'}}>{weightUnit(unit)}</span></div></div></div>
    <div className="card" style={{marginBottom:14}}><div className="label" style={{marginBottom:4}}>Weight × Body fat × Muscle · 30 days</div><ChartLegend items={[{color:'#00687a',label:`Weight (${weightUnit(unit)})`},{color:'#ff5bcf',label:'Body fat %'},{color:'#cfff04',label:`Muscle (${weightUnit(unit)})`}]}/><div style={{marginTop:8}}><MultiLineChart series={[{values:weights,color:'#00687a',axis:'left'},{values:muscle,color:'#cfff04',axis:'left'},{values:bf,color:'#ff5bcf',axis:'right'}]} h={220}/></div></div>
    <div className="card" style={{marginBottom:14}}><div className="label" style={{marginBottom:4}}>Weight × Body water · 30 days</div><p style={{fontSize:12,color:'var(--text-mute)',marginBottom:8}}>When weight spikes line up with body water spikes, it's water, not fat.</p><ChartLegend items={[{color:'#00687a',label:`Weight (${weightUnit(unit)})`},{color:'#ff5bcf',label:'Body water %'}]}/><div style={{marginTop:8}}><MultiLineChart series={[{values:weights,color:'#00687a',axis:'left'},{values:water,color:'#ff5bcf',axis:'right'}]} h={160}/></div></div>
    <div className="card" style={{marginBottom:14}}><div className="label" style={{marginBottom:4}}>Calories in × out × Weight · 30 days</div><ChartLegend items={[{color:'#ff5bcf',label:'Calories in'},{color:'#00687a',label:'Calories out'},{color:'#cfff04',label:`Weight (${weightUnit(unit)})`}]}/><div style={{marginTop:8}}><MultiLineChart series={[{values:calIn30,color:'#ff5bcf',axis:'left'},{values:calOut30,color:'#00687a',axis:'left'},{values:weights,color:'#cfff04',axis:'right'}]} h={180}/></div></div>
    <div className="card"><div className="label" style={{marginBottom:4}}>Steps × Weight · 30 days</div><ChartLegend items={[{color:'#00687a',label:'Daily steps'},{color:'#ff5bcf',label:`Weight (${weightUnit(unit)})`}]}/><div style={{marginTop:8}}><MultiLineChart series={[{values:steps30,color:'#00687a',axis:'left'},{values:weights,color:'#ff5bcf',axis:'right'}]} h={160}/></div></div>
  </div>);
}

function SettingsView({profile,onUpdate}) {
  const [name,setName]=useState(profile.name||''); const [unit,setUnit]=useState(profile.unit_system||'kg'); const [lifeStage,setLifeStage]=useState(profile.life_stage||'Perimenopause');
  const [height,setHeight]=useState(profile.height_cm?(toDisplayHeight(profile.height_cm,profile.unit_system)||'').toString().slice(0,6):''); const [age,setAge]=useState(profile.age||'');
  const [startWeight,setStartWeight]=useState(profile.start_weight_kg?fmt1(toDisplayWeight(profile.start_weight_kg,profile.unit_system)):''); const [goalWeight,setGoalWeight]=useState(profile.goal_weight_kg?fmt1(toDisplayWeight(profile.goal_weight_kg,profile.unit_system)):''); const [goalDate,setGoalDate]=useState(profile.goal_date||'');
  const [trackCycle,setTrackCycle]=useState(!!profile.track_cycle); const [regularity,setRegularity]=useState(profile.cycle_regularity||'Regular'); const [knowLength,setKnowLength]=useState(!!profile.cycle_length_auto); const [lastPeriod,setLastPeriod]=useState(profile.last_period_start||''); const [cycleLength,setCycleLength]=useState(profile.cycle_length||28); const [periodLength,setPeriodLength]=useState(profile.period_length||5);
  const [baselineSteps,setBaselineSteps]=useState(profile.baseline_steps||8000); const [proteinTarget,setProteinTarget]=useState(profile.protein_target||110); const [waterTarget,setWaterTarget]=useState(profile.water_target?fmt1(toDisplayWater(profile.water_target,profile.unit_system)):(isImperial(profile.unit_system)?'84':'2.5')); const [sleepTarget,setSleepTarget]=useState(profile.sleep_target||7.5);
  const [saving,setSaving]=useState(false); const [savedAt,setSavedAt]=useState(null);
  const isPeri=lifeStage==='Perimenopause'||lifeStage==='Post-menopause'; const hasCycles=regularity!=='None anymore';
  async function save() {
    setSaving(true);
    const patch={name,unit_system:unit,life_stage:lifeStage,height_cm:fromDisplayHeight(height,unit),age:age?Number(age):null,start_weight_kg:fromDisplayWeight(startWeight,unit),goal_weight_kg:fromDisplayWeight(goalWeight,unit),goal_date:goalDate||null,track_cycle:trackCycle&&hasCycles,cycle_regularity:trackCycle?regularity:null,cycle_length_auto:knowLength,last_period_start:lastPeriod||null,cycle_length:Number(cycleLength),period_length:Number(periodLength),baseline_steps:Number(baselineSteps),protein_target:Number(proteinTarget),water_target:fromDisplayWater(waterTarget,unit),sleep_target:Number(sleepTarget)};
    const{error}=await db.from('profiles').update(patch).eq('user_id',profile.user_id);
    setSaving(false); if(error){alert(error.message);return;} setSavedAt(new Date()); onUpdate();
  }
  return(<div className="fade-in"><h1 className="page-title">Settings</h1><p className="page-sub">Update once. The dashboard adapts.</p>

async function fetchHealthLog(dateFrom,dateTo) {
  const [scans,symptoms,meds,labs]=await Promise.all([
    db.from('body_scans').select('*').gte('scan_date',dateFrom).lte('scan_date',dateTo).order('scan_date',{ascending:false}),
    db.from('symptoms').select('*').gte('date',dateFrom).lte('date',dateTo).order('date',{ascending:false}),
    db.from('medications').select('*').order('start_date',{ascending:false}),
    db.from('labs').select('*').gte('test_date',dateFrom).lte('test_date',dateTo).order('test_date',{ascending:false}),
  ]);
  if(scans.error)throw scans.error; if(symptoms.error)throw symptoms.error; if(meds.error)throw meds.error; if(labs.error)throw labs.error;
  return{scans:scans.data||[],symptoms:symptoms.data||[],meds:meds.data||[],labs:labs.data||[]};
}

function drawPdfChart(doc,x,y,w,h,series,title,dates) {
  doc.setFontSize(9);doc.setTextColor(40,60,70);doc.setFont(undefined,'bold');if(title)doc.text(title,x,y-3);doc.setFont(undefined,'normal');
  const leftSeries=series.filter(s=>s.axis==='left'); const rightSeries=series.filter(s=>s.axis==='right');
  const leftAll=leftSeries.flatMap(s=>s.values).filter(v=>v!==null&&v!==undefined); const rightAll=rightSeries.flatMap(s=>s.values).filter(v=>v!==null&&v!==undefined);
  if(!leftAll.length&&!rightAll.length){doc.setFontSize(8);doc.setTextColor(140);doc.text('No data for this period',x+4,y+h/2);return y+h+10;}
  const lMin=leftAll.length?Math.min(...leftAll):0;const lMax=leftAll.length?Math.max(...leftAll):1;const lRange=(lMax-lMin)||1;
  const rMin=rightAll.length?Math.min(...rightAll):0;const rMax=rightAll.length?Math.max(...rightAll):1;const rRange=(rMax-rMin)||1;
  const n=series[0]?.values.length||0;
  doc.setDrawColor(220);doc.setLineWidth(0.2);doc.rect(x,y,w,h);
  for(let i=1;i<4;i++){const gy=y+(h/4)*i;doc.line(x,gy,x+w,gy);}
  series.forEach(s=>{const min=s.axis==='left'?lMin:rMin;const range=s.axis==='left'?lRange:rRange;const pts=s.values.map((v,i)=>{if(v===null||v===undefined)return null;return{px:x+(i/Math.max(n-1,1))*w,py:y+h-((v-min)/range)*h};}).filter(Boolean);if(!pts.length)return;const rgb=hexToRgb(s.color);doc.setDrawColor(rgb.r,rgb.g,rgb.b);doc.setFillColor(rgb.r,rgb.g,rgb.b);doc.setLineWidth(0.5);for(let i=1;i<pts.length;i++)doc.line(pts[i-1].px,pts[i-1].py,pts[i].px,pts[i].py);pts.forEach(p=>doc.circle(p.px,p.py,0.5,'F'));});
  doc.setFontSize(6);doc.setTextColor(130);if(leftAll.length){const lc=hexToRgb(leftSeries[0].color);doc.setTextColor(lc.r,lc.g,lc.b);doc.text(lMax.toFixed(1),x-0.5,y+1.5,{align:'right'});doc.text(lMin.toFixed(1),x-0.5,y+h,{align:'right'});}if(rightAll.length){const rc=hexToRgb(rightSeries[0].color);doc.setTextColor(rc.r,rc.g,rc.b);doc.text(rMax.toFixed(1),x+w+0.5,y+1.5);doc.text(rMin.toFixed(1),x+w+0.5,y+h);}
  if(dates&&dates.length>=2){doc.setTextColor(140);doc.setFontSize(6);doc.text(dates[0],x,y+h+4);if(dates.length>4)doc.text(dates[Math.floor(dates.length/2)],x+w/2,y+h+4,{align:'center'});doc.text(dates[dates.length-1],x+w,y+h+4,{align:'right'});}
  doc.setFontSize(7);doc.setTextColor(80);let lx=x;series.forEach(s=>{const rgb=hexToRgb(s.color);doc.setFillColor(rgb.r,rgb.g,rgb.b);doc.rect(lx,y+h+7,3,1.5,'F');doc.text(s.label,lx+4,y+h+8.5);lx+=doc.getTextWidth(s.label)+12;});
  return y+h+14;
}

function exportCSV(logs,profile,dateFrom,dateTo) {
  const unit=profile.unit_system||'kg';
  const filtered=logs.filter(l=>l.date>=dateFrom&&l.date<=dateTo).sort((a,b)=>a.date.localeCompare(b.date));
  const headers=['date','weight','body_fat_pct','muscle','hrv','rhr','sleep_hours','sleep_quality','steps','calories_in','calories_out','protein_g','carbs_g','fat_g','fibre_g','water_l','mood','stress','alcohol_units','caffeine_mg','notes'];
  const rows=filtered.map(l=>[l.date,l.weight_kg?toDisplayWeight(l.weight_kg,unit):'',l.body_fat_pct??'',l.muscle_kg?toDisplayWeight(l.muscle_kg,unit):'',l.hrv??'',l.rhr??'',l.sleep_hours??'',l.sleep_quality??'',l.steps??'',l.calories_in??'',l.calories_out??'',l.protein_g??'',l.carbs_g??'',l.fat_g??'',l.fibre_g??'',l.water_l??'',l.mood??'',l.stress??'',l.alcohol_units??'',l.caffeine_mg??'',(l.notes||'').replace(/,/g,' ')]);
  const csv=[headers.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`train-with-me-${dateFrom}-to-${dateTo}.csv`; a.click(); URL.revokeObjectURL(url);
}

function ExportSection({profile,logs}) {
  const [open,setOpen]=useState(false); const [range,setRange]=useState('7d'); const [customFrom,setCustomFrom]=useState(ymd(new Date(today().getTime()-30*86400000))); const [customTo,setCustomTo]=useState(ymd(today())); const [busy,setBusy]=useState(false);
  const getRange=()=>{if(range==='7d')return{from:ymd(new Date(today().getTime()-6*86400000)),to:ymd(today())};if(range==='30d')return{from:ymd(new Date(today().getTime()-29*86400000)),to:ymd(today())};return{from:customFrom,to:customTo};};
  async function doPDF(){setBusy(true);try{const{from,to}=getRange();await exportPDF(logs,profile,from,to);}catch(e){alert('PDF export failed: '+e.message);}setBusy(false);}

}

function answerGoal(goalId,logs,profile) {

function ScanMetric({label,value,prev,unit='',convert,higherBetter,lowerBetter}) {
  if(value===null||value===undefined)return null;
  const displayVal=convert?convert(value):value; const displayPrev=prev!==null&&prev!==undefined?(convert?convert(prev):prev):null;
  const diff=displayPrev!==null?displayVal-displayPrev:null;
  let diffColor='var(--text-mute)';
  if(diff!==null&&Math.abs(diff)>0.05){if(higherBetter)diffColor=diff>0?'var(--success)':'var(--pink)';else if(lowerBetter)diffColor=diff<0?'var(--success)':'var(--pink)';}
  return(<div><div className="label" style={{marginBottom:4}}>{label}</div><div style={{fontSize:16,fontWeight:600}}>{fmt1(displayVal)} {unit}</div>{diff!==null&&Math.abs(diff)>0.05&&<div style={{fontSize:11,color:diffColor,marginTop:3}}>{diff>0?'+':''}{fmt1(diff)} from last</div>}</div>);
}

function App() {
  const [session,setSession]=useState(null); const [loading,setLoading]=useState(true); const [profile,setProfile]=useState(null); const [logs,setLogs]=useState([]); const [view,setView]=useState('dashboard');
  useEffect(()=>{db.auth.getSession().then(({data})=>{setSession(data.session);setLoading(false);}); const{data:sub}=db.auth.onAuthStateChange((_event,session)=>setSession(session)); return()=>sub.subscription.unsubscribe();},[]);
  const loadData=useCallback(async()=>{if(!session)return; const{data:prof}=await db.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle(); setProfile(prof); const{data:logRows}=await db.from('daily_logs').select('*').eq('user_id',session.user.id).order('date',{ascending:true}); setLogs(logRows||[]);},[session]);
  useEffect(()=>{loadData();},[loadData]);
  async function signOut(){await db.auth.signOut();setSession(null);setProfile(null);setLogs([]);}
  if(loading)return<div style={{minHeight:'100vh',display:'grid',placeItems:'center',color:'var(--text-mute)',fontStyle:'italic'}}>loading…</div>;
  if(!session)return<AuthScreen/>;
  if(!profile)return<Onboarding user={session.user} onDone={loadData}/>;
  const todayLog=logs.find(l=>l.date===ymd(today()));
  let trialDaysLeft=null; if(profile.trial_started_at){const elapsed=daysBetween(new Date(profile.trial_started_at),today()); trialDaysLeft=Math.max(0,TRIAL_DAYS-elapsed);}
  const isPaid=!!profile.is_paid;
  return(<div className="layout"><Sidebar view={view} setView={setView} profile={profile} onSignOut={signOut} trialDaysLeft={trialDaysLeft} isPaid={isPaid}/><main className="main">{view==='dashboard'&&<Dashboard profile={profile} logs={logs} todayLog={todayLog} setView={setView}/>}{view==='log'&&<DailyLog profile={profile} logs={logs} todayLog={todayLog} onLogSaved={loadData}/>}{view==='coach'&&<CoachView profile={profile} logs={logs}/>}{view==='health'&&<HealthLogView profile={profile} logs={logs}/>}{view==='cycle'&&<CycleInsights profile={profile} logs={logs}/>}{view==='trends'&&<WeightTrends profile={profile} logs={logs}/>}{view==='settings'&&<SettingsView profile={profile} onUpdate={loadData}/>}<div style={{marginTop:48,paddingTop:20,borderTop:'1px solid var(--divider)',textAlign:'center',fontSize:11,color:'var(--text-faint)',lineHeight:1.6}}>Educational use only — not medical advice. <button onClick={()=>setView('settings')} style={{background:'transparent',border:'none',color:'var(--teal)',fontSize:11,cursor:'pointer',textDecoration:'underline'}}>Full disclaimer in Settings</button></div></main></div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
