<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

const db = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const TRIAL_DAYS = 14;

// ============================================================
// UTILITIES
// ============================================================
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const ymd = (d) => {
  const dt = (d instanceof Date) ? d : new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
};
const parseYMD = (s) => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);
const fmt1 = (n) => (n === null || n === undefined || isNaN(n)) ? 'â€“' : Number(n).toFixed(1);
const fmt0 = (n) => (n === null || n === undefined || isNaN(n)) ? 'â€“' : Math.round(Number(n)).toLocaleString();
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return { r: parseInt(h.substr(0,2), 16), g: parseInt(h.substr(2,2), 16), b: parseInt(h.substr(4,2), 16) };
}

const toDisplayWeight = (kg, unit) => {
  if (kg === null || kg === undefined || kg === '') return null;
  return unit === 'lbs' ? kg * 2.20462 : kg;
};
const fromDisplayWeight = (val, unit) => {
  if (val === null || val === undefined || val === '') return null;
  const n = Number(val);
  if (isNaN(n)) return null;
  return unit === 'lbs' ? n / 2.20462 : n;
};

// Unit system helpers (Metric = kg/cm/L, Imperial = lbs/in/fl oz)
const isImperial = (unit) => unit === 'lbs' || unit === 'imperial';
const weightUnit = (unit) => isImperial(unit) ? 'lbs' : 'kg';
const heightUnit = (unit) => isImperial(unit) ? 'in' : 'cm';
const waterUnit  = (unit) => isImperial(unit) ? 'fl oz' : 'L';

const toDisplayHeight = (cm, unit) => {
  if (cm === null || cm === undefined || cm === '') return null;
  return isImperial(unit) ? cm / 2.54 : cm;
};
const fromDisplayHeight = (val, unit) => {
  if (val === null || val === undefined || val === '') return null;
  const n = Number(val);
  if (isNaN(n)) return null;
  return isImperial(unit) ? n * 2.54 : n;
};

// Water stored in litres; imperial displays as fl oz (1 L = 33.814 fl oz)
const toDisplayWater = (L, unit) => {
  if (L === null || L === undefined || L === '') return null;
  return isImperial(unit) ? L * 33.814 : L;
};
const fromDisplayWater = (val, unit) => {
  if (val === null || val === undefined || val === '') return null;
  const n = Number(val);
  if (isNaN(n)) return null;
  return isImperial(unit) ? n / 33.814 : n;
};

function calcPhase(cycleDay, cycleLength, periodLength) {
  if (!cycleDay || !cycleLength) return null;
  if (cycleDay > cycleLength) return 'Luteal';
  if (cycleDay <= (periodLength || 5)) return 'Menstrual';
  const foll = Math.round(cycleLength * 0.45);
  const ovul = Math.round(cycleLength * 0.55);
  if (cycleDay <= foll) return 'Follicular';
  if (cycleDay <= ovul) return 'Ovulatory';
  return 'Luteal';
}

function calcRecovery(t, baselines) {
  if (!t) return null;
  const { hrv, rhr, sleep_quality } = t;
  const { hrvAvg, rhrAvg } = baselines;
  // Need HRV + baseline OR RHR + baseline minimum â€” sleep_quality is optional and lightly weighted
  const haveHrv = hrv && hrvAvg && hrv > 0 && hrvAvg > 0;
  const haveRhr = rhr && rhrAvg && rhr > 0 && rhrAvg > 0;
  if (!haveHrv && !haveRhr) return null;
  const haveSleep = sleep_quality && sleep_quality > 0;

  // Compute each component as a 0.7-1.3 ratio (centered on 1.0 = normal)
  // HRV: higher is better, so hrv/hrvAvg (above 1 = good)
  // RHR: lower is better, so rhrAvg/rhr (above 1 = good, since lower today/higher avg means today is better)
  // Sleep: optional and lighter â€” only adjusts the score, doesn't tank it
  let score = 0;
  let weight = 0;
  if (haveHrv) { score += (hrv / hrvAvg) * 0.5; weight += 0.5; }
  if (haveRhr) { score += (rhrAvg / rhr) * 0.4; weight += 0.4; }
  if (haveSleep) { score += (sleep_quality / 4) * 0.1; weight += 0.1; } // 4/5 is "good" baseline
  return score / weight;
}
function recoveryLabel(s) {
  if (s === null) return { label: 'Not enough data', tone: 'neutral' };
  if (s >= 1.05) return { label: 'Recovered', tone: 'green' };
  if (s >= 0.95) return { label: 'Steady', tone: 'yellow' };
  return { label: 'Take it easy', tone: 'red' };
}
function calcStepTarget(b, r) {
  if (!b) return null;
  if (r === null) return b;
  return Math.round((b * Math.max(0.7, Math.min(1.25, r))) / 100) * 100;
}
function avg(arr, key) {
  const vals = arr.map(x => x[key]).filter(v => v !== null && v !== undefined && !isNaN(v) && v > 0);
  if (!vals.length) return null;
  return vals.reduce((a,b) => a + b, 0) / vals.length;
}

function fuelling(kg, sessionType, durationMin, phase) {
  if (!kg || !sessionType) return null;
  const isRest = ['Rest', 'Walk', 'Yoga/mobility'].includes(sessionType);
  if (isRest) return { preCarbs: 0, preProtein: 0, intraCarbs: 0, postProtein: 0, postCarbs: 0 };
  const carbMult = { 'Strength': 0.75, 'Zone 2': 1.0, 'HIIT': 1.0, 'Long endurance': 1.5, 'Swim': 1.0, 'Football': 1.0, 'Run': 1.0 }[sessionType] || 0.75;
  let preCarbs = Math.round(kg * carbMult);
  const preProtein = Math.round(kg * 0.25);
  let intraCarbs = 0;
  if (durationMin > 60 && ['Zone 2', 'Long endurance', 'Football', 'Run'].includes(sessionType)) {
    intraCarbs = Math.round((durationMin - 60) / 60 * 45);
  } else if (durationMin > 60 && sessionType === 'HIIT') {
    intraCarbs = Math.round((durationMin - 60) / 60 * 30);
  }
  const postProtein = Math.round(kg * 0.4);
  const postCarbMult = { 'Strength': 0.75, 'HIIT': 1.0, 'Zone 2': 0.75, 'Long endurance': 1.25, 'Swim': 0.75, 'Football': 1.0, 'Run': 1.0 }[sessionType] || 0.75;
  let postCarbs = Math.round(kg * postCarbMult);
  if (phase === 'Luteal') {
    preCarbs = Math.round(preCarbs * 1.15);
    postCarbs = Math.round(postCarbs * 1.15);
  }
  return { preCarbs, preProtein, intraCarbs, postProtein, postCarbs };
}

const PHASE_GUIDANCE = {
  Menstrual: {
    prioritize: 'Recovery, sleep, gentle movement. Skip intensity.',
    train: 'Lighter loads. Mobility, walking, gentle yoga. Honour the rest if energy is low.',
    eat: 'Iron-rich foods (red meat, lentils, dark greens). Extra water. Magnesium for cramps.',
  },
  Follicular: {
    prioritize: 'Build muscle, hit volume, challenge yourself.',
    train: 'Best window for intensity, PRs, hard sessions. Push your step target.',
    eat: 'Standard fuelling. Carbs around sessions. Estrogen is rising â€” energy is good.',
  },
  Ovulatory: {
    prioritize: 'Power, strength, sprints. Don\'t restrict food.',
    train: 'Peak strength. Watch joint stability (ACL/knee). Go for it but with form.',
    eat: 'Standard. Don\'t under-eat â€” recovery demands are high.',
  },
  Luteal: {
    prioritize: 'Steady cardio, magnesium 300-400mg evening, manage sleep disruption.',
    train: 'Volume down 20% if RPE > 8. More zone 2, less HIIT. Cravings are real.',
    eat: '+15% carbs. 30g fibre. Eat the extra food â€” appetite is hormonal, not failure.',
  },
};

// ============================================================
// UNIFIED "TODAY'S FOCUS" â€” combines recovery + phase + today's data
// Returns ONE coherent recommendation, never contradictory
// ============================================================
function todaysFocus({ recovery, phase, todayLog, profile, baselines }) {
  // No data at all
  if (!todayLog && recovery === null) {
    return {
      headline: 'Set your baseline.',
      detail: 'Log today\'s sleep, HRV, weight and steps. Your first signal appears in 2-3 days.',
      action: phase ? `${phase} phase, day ${todayLog?.cycle_day || ''} â€” guidance on the right.` : null,
    };
  }

  // Recovery is the strongest signal â€” it overrides phase
  if (recovery !== null && recovery < 0.9) {
    return {
      headline: 'Recovery is low. Rest or walk only today.',
      detail: phase
        ? `Your HRV is below baseline. ${phase} phase guidance suggests ${PHASE_GUIDANCE[phase].prioritize.toLowerCase()} â€” but recovery wins. Push tomorrow if numbers improve.`
        : 'Your HRV is below baseline. Skip intensity. Walk, mobilise, sleep early.',
      action: 'Aim for 7,000-8,000 steps. No HIIT, no heavy lifts.',
    };
  }

  // Recovery is high and phase supports intensity
  if (recovery !== null && recovery >= 1.05 && (phase === 'Follicular' || phase === 'Ovulatory')) {
    return {
      headline: 'You\'re recovered and in your strong window. Train hard.',
      detail: phase === 'Ovulatory'
        ? 'Ovulation: peak strength but watch ACL/knee stability. Form before load.'
        : 'Follicular: best week for PRs and intensity. Estrogen is on your side.',
      action: 'Heavy lifts, intervals, or sprint work today. Eat the food to fuel it.',
    };
  }

  // Recovery is high but phase is luteal â€” moderate intensity
  if (recovery !== null && recovery >= 1.05 && phase === 'Luteal') {
    return {
      headline: 'Recovered but luteal â€” choose volume over intensity.',
      detail: 'HRV is good, but progesterone makes hard sessions harder to recover from. Zone 2 cardio or moderate strength beats HIIT here.',
      action: '+15% carbs around training. Magnesium tonight.',
    };
  }

  // Recovery is high and menstrual â€” gentle
  if (recovery !== null && recovery >= 1.05 && phase === 'Menstrual') {
    return {
      headline: 'Your body wants gentle movement, not intensity.',
      detail: 'First few days of bleed: walking, yoga, mobility. Iron is dropping â€” fuel it.',
      action: 'Red meat or lentils today. Extra 500ml water.',
    };
  }

  // Steady recovery â€” generic per-phase
  if (recovery !== null && phase) {
    return {
      headline: `Steady day. ${phase} guidance applies.`,
      detail: PHASE_GUIDANCE[phase].prioritize,
      action: PHASE_GUIDANCE[phase].train,
    };
  }

  // Has recovery but no phase
  if (recovery !== null) {
    return {
      headline: recovery >= 1.05 ? 'You\'re recovered. Push today.' : 'Steady day. Stick to the plan.',
      detail: 'Add cycle tracking in Settings for personalised phase-aware guidance.',
      action: null,
    };
  }

  // Has phase but not enough HRV/RHR baseline yet
  if (phase) {
    return {
      headline: `${phase} phase â€” here's what helps.`,
      detail: PHASE_GUIDANCE[phase].prioritize,
      action: `Keep logging HRV and RHR â€” recovery score appears once we have your baseline (~7 days).`,
    };
  }

  return {
    headline: 'Keep logging.',
    detail: 'A few more days of data and the dashboard starts personalising.',
    action: null,
  };
}

// ============================================================
// WHAT CHANGED â€” what moved since yesterday/7-day avg, what's missing
// Shows on dashboard on arrival so user knows what's new
// ============================================================
function whatChanged(logs, profile, todayLog) {
  const unit = profile.unit_system || 'kg';
  const out = { moved: [], missing: [] };
  if (logs.length < 2) return out;

  const sorted = logs.slice().sort((a, b) => a.date.localeCompare(b.date));
  const recent7 = sorted.slice(-7);
  const yesterday = sorted[sorted.length - (todayLog ? 2 : 1)];
  const latest = todayLog || sorted[sorted.length - 1];

  // Weight change vs 7-day avg
  if (latest?.weight_kg) {
    const w7 = avg(recent7.filter(l => l.weight_kg && l.date !== latest.date), 'weight_kg');
    if (w7 !== null) {
      const diff = latest.weight_kg - w7;
      if (Math.abs(diff) >= 0.2) {
        out.moved.push({
          headline: `Weight ${diff < 0 ? 'down' : 'up'} ${fmt1(toDisplayWeight(Math.abs(diff), unit))} ${weightUnit(unit)}`,
          detail: `vs your 7-day average. ${Math.abs(diff) > 0.8 ? 'Likely water (sodium, carbs, luteal) â€” not fat.' : 'Within normal daily variation.'}`,
          tone: diff < 0 ? 'good' : 'neutral',
        });
      }
    }
  }

  // HRV change vs baseline
  if (latest?.hrv) {
    const hrv7 = avg(recent7.filter(l => l.hrv && l.date !== latest.date), 'hrv');
    if (hrv7 !== null) {
      const diff = latest.hrv - hrv7;
      if (Math.abs(diff) >= 4) {
        let reason = '';
        if (diff < 0) {
          if (latest.alcohol_units > 0) reason = ` â€” alcohol last night.`;
          else if (latest.sleep_hours && latest.sleep_hours < 7) reason = ` â€” sleep was ${fmt1(latest.sleep_hours)}h.`;
          else if (latest.stress >= 4) reason = ` â€” stress was high.`;
        }
        out.moved.push({
          headline: `HRV ${diff < 0 ? 'down' : 'up'} ${Math.abs(Math.round(diff))}ms`,
          detail: `vs your 7-day average${reason}`,
          tone: diff > 0 ? 'good' : 'warn',
        });
      }
    }
  }

  // Sleep change
  if (latest?.sleep_hours) {
    const sleep7 = avg(recent7.filter(l => l.sleep_hours && l.date !== latest.date), 'sleep_hours');
    if (sleep7 !== null) {
      const diff = latest.sleep_hours - sleep7;
      if (Math.abs(diff) >= 0.7) {
        out.moved.push({
          headline: `Sleep ${diff > 0 ? 'up' : 'down'} ${fmt1(Math.abs(diff))}h`,
          detail: `${fmt1(latest.sleep_hours)}h vs ${fmt1(sleep7)}h average.`,
          tone: diff > 0 ? 'good' : 'warn',
        });
      }
    }
  }

  // Streak warnings â€” consecutive missed targets
  const last3 = sorted.slice(-3);
  if (last3.length >= 3 && profile.protein_target) {
    const allMissed = last3.every(l => l.protein_g && l.protein_g < profile.protein_target);
    if (allMissed) {
      out.moved.push({
        headline: `3rd day under protein`,
        detail: `In peri, this is the lever that protects muscle through loss.`,
        tone: 'warn',
      });
    }
  }

  // What's MISSING â€” fields not logged recently
  const checkField = (key, label, gap = 2) => {
    const last = sorted.slice(-gap).filter(l => l[key] !== null && l[key] !== undefined && l[key] !== '');
    if (last.length === 0 && sorted.length >= gap) {
      out.missing.push(label);
    }
  };
  checkField('weight_kg', 'weight', 2);
  checkField('hrv', 'HRV', 3);
  checkField('sleep_hours', 'sleep', 2);

  return out;
}

// ============================================================
// INSIGHTS ENGINE â€” finds patterns in user data, returns plain-English findings
// Each pattern checks: enough data? signal strong enough? Then formats output.
// ============================================================
function generateInsights(logs, profile) {
  const insights = { gaps: [], wins: [], stalls: [], cycle: [] };
  const unit = profile.unit_system || 'kg';

  if (logs.length < 3) return insights;

  // ============ BEHAVIOUR GAPS (what you're not doing) ============
  const recent = logs.slice(-7);
  const recent14 = logs.slice(-14);

  // Water gap
  const waterAvg = avg(recent, 'water_l');
  if (waterAvg !== null && profile.water_target && waterAvg < profile.water_target * 0.7) {
    const gap = profile.water_target - waterAvg;
    insights.gaps.push({
      headline: `Water is low.`,
      detail: `Averaging ${fmt1(toDisplayWater(waterAvg, unit))} ${waterUnit(unit)}/day, target ${fmt1(toDisplayWater(profile.water_target, unit))} ${waterUnit(unit)}. ${isImperial(unit) ? '3 large glasses' : '500ml'} before noon closes most of the gap.`,
    });
  }

  // Sleep gap
  const sleepAvg = avg(recent, 'sleep_hours');
  if (sleepAvg !== null && sleepAvg < 7) {
    insights.gaps.push({
      headline: `Sleep is short.`,
      detail: `Averaging ${fmt1(sleepAvg)}h. Sleep under 7h is the single strongest predictor of low NEAT the next day in your data.`,
    });
  }

  // Protein gap
  const proteinDays = recent.filter(l => l.protein_g);
  if (proteinDays.length >= 3 && profile.protein_target) {
    const hit = proteinDays.filter(l => l.protein_g >= profile.protein_target).length;
    if (hit < proteinDays.length / 2) {
      insights.gaps.push({
        headline: `Protein target missed.`,
        detail: `Hit ${profile.protein_target}g on ${hit} of ${proteinDays.length} logged days. In peri, protein protects muscle through fat loss â€” non-negotiable.`,
      });
    }
  }

  // Step gap
  const stepAvg = avg(recent, 'steps');
  if (stepAvg !== null && profile.baseline_steps && stepAvg < profile.baseline_steps * 0.8) {
    insights.gaps.push({
      headline: `Steps dropped.`,
      detail: `Averaging ${fmt0(stepAvg)}/day, ${Math.round((1 - stepAvg/profile.baseline_steps) * 100)}% below your baseline. NEAT is where the deficit lives â€” not the gym.`,
    });
  }

  // ============ WHAT WORKS FOR YOU (correlations from your data) ============

  // Sleep â†’ steps
  const sleepStepLogs = logs.filter(l => l.sleep_hours && l.steps);
  if (sleepStepLogs.length >= 5) {
    const high = sleepStepLogs.filter(l => l.sleep_hours >= 7.5);
    const low = sleepStepLogs.filter(l => l.sleep_hours < 7.5);
    if (high.length >= 2 && low.length >= 2) {
      const diff = Math.round(avg(high, 'steps') - avg(low, 'steps'));
      if (diff > 500) insights.wins.push({
        headline: `+${diff.toLocaleString()} steps on well-rested days`,
        detail: `When you sleep â‰¥7.5h, you walk ${Math.round(diff/avg(low, 'steps')*100)}% more the next day. Sleep is your NEAT lever.`,
      });
    }
  }

  // Calories out â†’ next-day weight (TESTS YOUR THEORY DIRECTLY)
  const calWeightPairs = [];
  for (let i = 0; i < logs.length - 1; i++) {
    if (logs[i].calories_out && logs[i+1].weight_kg && logs[i].weight_kg) {
      calWeightPairs.push({ cal: logs[i].calories_out, dw: logs[i+1].weight_kg - logs[i].weight_kg });
    }
  }
  if (calWeightPairs.length >= 5) {
    // Find the threshold where weight moves
    for (const threshold of [2400, 2300, 2200, 2100, 2000]) {
      const above = calWeightPairs.filter(p => p.cal >= threshold);
      const below = calWeightPairs.filter(p => p.cal < threshold);
      if (above.length >= 2 && below.length >= 2) {
        const aboveDw = above.reduce((s,p) => s+p.dw, 0) / above.length;
        const belowDw = below.reduce((s,p) => s+p.dw, 0) / below.length;
        if (aboveDw < -0.05 && belowDw > -0.02) {
          insights.wins.push({
            headline: `Your tipping point: ${threshold} calories out`,
            detail: `On ${above.length} days you burned â‰¥${threshold} cal â€” weight dropped ${fmt1(toDisplayWeight(Math.abs(aboveDw), unit))} ${weightUnit(unit)} next morning on average. On ${below.length} days under ${threshold}, weight didn't move. Aim for ${threshold}+.`,
          });
          break;
        }
      }
    }
  }

  // Protein â†’ next-day weight
  const proteinPairs = [];
  for (let i = 0; i < logs.length - 1; i++) {
    if (logs[i].protein_g && logs[i+1].weight_kg && logs[i].weight_kg) {
      proteinPairs.push({ p: logs[i].protein_g, dw: logs[i+1].weight_kg - logs[i].weight_kg });
    }
  }
  if (proteinPairs.length >= 4 && profile.protein_target) {
    const above = proteinPairs.filter(p => p.p >= profile.protein_target);
    if (above.length >= 2) {
      const avgDw = above.reduce((s,p) => s+p.dw, 0) / above.length;
      if (avgDw < -0.05) insights.wins.push({
        headline: `Hitting protein helps`,
        detail: `On days you hit ${profile.protein_target}g+, you woke up ${fmt1(toDisplayWeight(Math.abs(avgDw), unit))} ${weightUnit(unit)} lighter on average.`,
      });
    }
  }

  // Alcohol â†’ HRV
  const alcLogs = logs.filter(l => l.alcohol_units !== null && l.alcohol_units !== undefined && l.hrv);
  if (alcLogs.length >= 5) {
    const drinking = alcLogs.filter(l => l.alcohol_units > 0);
    const sober = alcLogs.filter(l => l.alcohol_units === 0);
    if (drinking.length >= 2 && sober.length >= 2) {
      const drop = ((avg(sober, 'hrv') - avg(drinking, 'hrv')) / avg(sober, 'hrv')) * 100;
      if (drop > 5) insights.wins.push({
        headline: `Alcohol costs you ${Math.round(drop)}% HRV`,
        detail: `On drinking days your HRV averages ${fmt0(avg(drinking, 'hrv'))} vs ${fmt0(avg(sober, 'hrv'))} on dry days. Two clean days fully restores it.`,
      });
    }
  }

  // Muscle stability through loss
  const muscleLogs = logs.filter(l => l.muscle_kg && l.weight_kg);
  if (muscleLogs.length >= 7) {
    const first = muscleLogs[0];
    const last = muscleLogs[muscleLogs.length - 1];
    const wChange = last.weight_kg - first.weight_kg;
    const mChange = last.muscle_kg - first.muscle_kg;
    if (wChange < -0.3 && mChange >= -0.2) {
      insights.wins.push({
        scope: 'body',
        headline: `Muscle is holding`,
        detail: `Down ${fmt1(toDisplayWeight(Math.abs(wChange), unit))} ${weightUnit(unit)} since first log, muscle mass stable. That's fat loss, not weight loss. This is the goal.`,
      });
    }
    if (wChange < -0.3 && mChange < -0.3) {
      insights.gaps.push({
        scope: 'body',
        headline: `Losing muscle, not just fat`,
        detail: `Weight down ${fmt1(toDisplayWeight(Math.abs(wChange), unit))} ${weightUnit(unit)} but muscle down ${fmt1(toDisplayWeight(Math.abs(mChange), unit))} ${weightUnit(unit)}. Eat more protein, lift heavier, or both.`,
      });
    }
  }

  // ============ STALLS (when weight isn't moving, why) ============
  const weightLogs = logs.filter(l => l.weight_kg).slice(-7);
  if (weightLogs.length >= 5) {
    const w = weightLogs.map(l => l.weight_kg);
    const range = Math.max(...w) - Math.min(...w);
    if (range < 0.4) {
      // Stall detected â€” diagnose why
      const stallCalOut = avg(logs.slice(-7), 'calories_out');
      const stallSleep = avg(logs.slice(-7), 'sleep_hours');
      const stallAlc = logs.slice(-7).reduce((s,l) => s + (l.alcohol_units || 0), 0);
      let why = [];
      if (stallCalOut && stallCalOut < 2200) why.push(`calories out averaging ${fmt0(stallCalOut)}`);
      if (stallSleep && stallSleep < 7) why.push(`sleep averaging ${fmt1(stallSleep)}h`);
      if (stallAlc > 4) why.push(`${stallAlc} units alcohol in the last week`);
      insights.stalls.push({
        scope: 'body',
        headline: `Weight has stalled for 5+ days`,
        detail: why.length ? `Likely cause: ${why.join('; ')}. Pick one to fix this week.` : 'Numbers look fine â€” could be water shift. Hold the line for 3-4 more days.',
      });
    }
  }

  // Body fat moving but weight isn't (water explanation)
  if (logs.length >= 7) {
    const bfLogs = logs.filter(l => l.body_fat_pct).slice(-14);
    if (bfLogs.length >= 4) {
      const bfChange = bfLogs[bfLogs.length-1].body_fat_pct - bfLogs[0].body_fat_pct;
      const wLogs = logs.filter(l => l.weight_kg).slice(-14);
      const wChange = wLogs.length >= 2 ? wLogs[wLogs.length-1].weight_kg - wLogs[0].weight_kg : 0;
      if (bfChange < -0.5 && Math.abs(wChange) < 0.3) {
        insights.wins.push({
          scope: 'body',
          headline: `Body fat down ${fmt1(Math.abs(bfChange))}%, scale flat`,
          detail: `You're losing fat and gaining/holding muscle. The scale lies â€” body comp is the signal.`,
        });
      }
    }
  }

  // ============ CYCLE PATTERNS (across phases) ============
  if (profile.track_cycle && profile.last_period_start && logs.length >= 14) {
    const byPhase = { Menstrual: [], Follicular: [], Ovulatory: [], Luteal: [] };
    for (const l of logs) {
      const d = daysBetween(parseYMD(profile.last_period_start), parseYMD(l.date));
      if (d < 0) continue;
      const cd = (d % (profile.cycle_length || 28)) + 1;
      const p = calcPhase(cd, profile.cycle_length, profile.period_length);
      if (p) byPhase[p].push(l);
    }
    // HRV across phases
    const hrvByPhase = {};
    for (const p of ['Menstrual','Follicular','Ovulatory','Luteal']) {
      const h = avg(byPhase[p], 'hrv');
      if (h !== null) hrvByPhase[p] = h;
    }
    if (hrvByPhase.Follicular && hrvByPhase.Luteal) {
      const drop = hrvByPhase.Follicular - hrvByPhase.Luteal;
      if (drop > 2) insights.cycle.push({
        headline: `HRV drops ${fmt0(drop)}ms in luteal vs follicular`,
        detail: `That's normal â€” progesterone suppresses HRV. Plan lighter weeks in luteal and treat the drop as expected, not alarming.`,
      });
    }
    // Step pattern
    const stepByPhase = {};
    for (const p of ['Menstrual','Follicular','Ovulatory','Luteal']) {
      const s = avg(byPhase[p], 'steps');
      if (s !== null) stepByPhase[p] = s;
    }
    if (stepByPhase.Follicular && stepByPhase.Luteal && stepByPhase.Follicular > stepByPhase.Luteal + 500) {
      insights.cycle.push({
        headline: `+${fmt0(stepByPhase.Follicular - stepByPhase.Luteal)} more steps in follicular`,
        detail: `You move more in your strong phase. Lean into it â€” use luteal for steady volume, follicular for intensity.`,
      });
    }
    // Weight by phase
    const wByPhase = {};
    for (const p of ['Menstrual','Follicular','Ovulatory','Luteal']) {
      const w = avg(byPhase[p], 'weight_kg');
      if (w !== null) wByPhase[p] = w;
    }
    if (wByPhase.Luteal && wByPhase.Follicular && wByPhase.Luteal > wByPhase.Follicular + 0.3) {
      insights.cycle.push({
        scope: 'body',
        headline: `You weigh more in luteal â€” that's water`,
        detail: `Average luteal weight is ${fmt1(toDisplayWeight(wByPhase.Luteal - wByPhase.Follicular, unit))} ${weightUnit(unit)} higher than follicular. Hormonal water retention, not fat. Don't panic-restrict.`,
      });
    }
  }

  return insights;
}

// ============================================================
// BEHAVIOUR SCORECARD â€” ranks habits by how strongly each correlates with YOUR weight loss
// Returns a list of { habit, impact, direction, observation, dataPoints }
// ============================================================
function behaviourScorecard(logs, profile) {
  if (logs.length < 7) return { items: [], ready: false, daysNeeded: 7 - logs.length };
  const unit = profile.unit_system || 'kg';

  // Build pairs of [habit value, next-morning weight change]
  // For each day with a weight reading the next morning, link it to the habit value
  const pairs = (key, filterFn = null) => {
    const out = [];
    for (let i = 0; i < logs.length - 1; i++) {
      const v = logs[i][key];
      const wNow = logs[i].weight_kg;
      const wNext = logs[i+1].weight_kg;
      if (v === null || v === undefined || v === '' || isNaN(v)) continue;
      if (!wNow || !wNext) continue;
      if (filterFn && !filterFn(v)) continue;
      out.push({ v: Number(v), dw: wNext - wNow });
    }
    return out;
  };

  const analyze = (habitName, key, opts = {}) => {
    const { threshold, higherIsBetter = true, unitLabel = '', isCount = false } = opts;
    const all = pairs(key);
    if (all.length < 5) return null;

    let above, below, splitLabel;
    if (threshold !== undefined) {
      above = all.filter(p => p.v >= threshold);
      below = all.filter(p => p.v < threshold);
      splitLabel = `â‰¥${threshold}${unitLabel}`;
    } else {
      const sorted = [...all].sort((a,b) => a.v - b.v);
      const mid = sorted[Math.floor(sorted.length / 2)].v;
      above = all.filter(p => p.v >= mid);
      below = all.filter(p => p.v < mid);
      splitLabel = `â‰¥${fmt1(mid)}${unitLabel}`;
    }

    if (above.length < 2 || below.length < 2) return null;

    const dwAbove = above.reduce((s,p) => s+p.dw, 0) / above.length;
    const dwBelow = below.reduce((s,p) => s+p.dw, 0) / below.length;
    // Impact: how much better is the "good" group at moving the scale down?
    // Negative dw = weight dropped. We want big negative dw on the "better" side.
    const goodGroup = higherIsBetter ? dwAbove : dwBelow;
    const badGroup  = higherIsBetter ? dwBelow : dwAbove;
    const diff = badGroup - goodGroup; // positive = the good group lost more
    const impact = diff; // raw kg difference

    // Only include if there's a meaningful gap
    if (Math.abs(impact) < 0.05) return null;

    return {
      habit: habitName,
      impact,
      helps: impact > 0,
      goodSplit: higherIsBetter ? `On days ${splitLabel}` : `On days <${threshold || fmt1(all[0].v)}${unitLabel}`,
      observation: impact > 0
        ? `${habitName} ${higherIsBetter ? 'high' : 'low'} â†’ ${fmt1(toDisplayWeight(Math.abs(goodGroup), unit))} ${weightUnit(unit)} lighter next morning. ${habitName} ${higherIsBetter ? 'low' : 'high'} â†’ ${badGroup > 0 ? 'weight up' : 'no change'}.`
        : `${habitName} doesn't seem to move the scale either way for you.`,
      dataPoints: all.length,
    };
  };

  const items = [
    analyze('Sleep', 'sleep_hours', { threshold: 7.5, unitLabel: 'h', higherIsBetter: true }),
    analyze('Protein', 'protein_g', { threshold: profile.protein_target || 110, unitLabel: 'g', higherIsBetter: true }),
    analyze('Steps', 'steps', { threshold: profile.baseline_steps || 8000, higherIsBetter: true }),
    analyze('Calories burned', 'calories_out', { higherIsBetter: true }),
    analyze('Alcohol', 'alcohol_units', { threshold: 0.5, unitLabel: 'u', higherIsBetter: false }),
    analyze('Stress', 'stress', { threshold: 3, higherIsBetter: false }),
    analyze('Sleep quality', 'sleep_quality', { threshold: 4, higherIsBetter: true }),
    analyze('Water', 'water_l', { threshold: profile.water_target || 2.5, unitLabel: 'L', higherIsBetter: true }),
    analyze('Fibre', 'fibre_g', { threshold: 25, unitLabel: 'g', higherIsBetter: true }),
  ].filter(Boolean);

  // Sort by absolute impact (biggest lever first)
  items.sort((a, b) => Math.abs(b.impact) - Math.abs(a.impact));

  return { items, ready: true };
}

// ============================================================
// WHAT MOVES YOUR SCALE â€” extended analysis that ALSO checks:
// - AM vs PM exercise timing effect on next-day weight
// - NEAT (steps) vs structured exercise effect
// - Plus the standard scorecard items
// Each finding has a confidence level based on data points
// ============================================================
function whatMovesYourScale(logs, profile) {
  const unit = profile.unit_system || 'kg';
  const findings = [];
  const totalDays = logs.length;

  // Pull pairs of [day's value, next-morning weight change]
  const pairs = (key, filterFn = null, valueFn = null) => {
    const out = [];
    for (let i = 0; i < logs.length - 1; i++) {
      let v = valueFn ? valueFn(logs[i]) : logs[i][key];
      if (v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v))) continue;
      if (!logs[i].weight_kg || !logs[i+1].weight_kg) continue;
      if (filterFn && !filterFn(v)) continue;
      out.push({ v: typeof v === 'boolean' ? (v ? 1 : 0) : Number(v), dw: logs[i+1].weight_kg - logs[i].weight_kg });
    }
    return out;
  };

  const confidence = (n) => n >= 14 ? 'strong' : n >= 7 ? 'building' : 'early';

  const splitAnalyze = ({ name, key, threshold, higherIsBetter = true, unitLabel = '', valueFn = null, customLabels = null }) => {
    const all = pairs(key, null, valueFn);
    if (all.length < 3) return null;
    let above, below, labelGood, labelBad;
    if (threshold !== undefined) {
      above = all.filter(p => p.v >= threshold);
      below = all.filter(p => p.v < threshold);
      labelGood = customLabels?.good || `${name} â‰¥${threshold}${unitLabel}`;
      labelBad = customLabels?.bad || `${name} <${threshold}${unitLabel}`;
    } else {
      const sorted = [...all].sort((a,b) => a.v - b.v);
      const mid = sorted[Math.floor(sorted.length / 2)].v;
      above = all.filter(p => p.v >= mid);
      below = all.filter(p => p.v < mid);
      labelGood = `${name} â‰¥${fmt1(mid)}${unitLabel}`;
      labelBad = `${name} <${fmt1(mid)}${unitLabel}`;
    }
    if (above.length < 2 || below.length < 2) return null;
    const dwAbove = above.reduce((s,p) => s+p.dw, 0) / above.length;
    const dwBelow = below.reduce((s,p) => s+p.dw, 0) / below.length;
    const goodGroup = higherIsBetter ? dwAbove : dwBelow;
    const badGroup = higherIsBetter ? dwBelow : dwAbove;
    const goodLabel = higherIsBetter ? labelGood : labelBad;
    const badLabel = higherIsBetter ? labelBad : labelGood;
    const diff = badGroup - goodGroup;
    if (Math.abs(diff) < 0.05) return null;
    const helps = diff > 0; // good group lost more
    return {
      name,
      helps,
      impact: diff,
      goodLabel,
      badLabel,
      goodGroup,
      badGroup,
      dataPoints: all.length,
      confidence: confidence(all.length),
      detail: helps
        ? `On days with ${goodLabel.toLowerCase()}, you lost ${fmt1(toDisplayWeight(Math.abs(goodGroup), unit))} ${weightUnit(unit)} on average next morning. On ${badLabel.toLowerCase()} days, you ${badGroup > 0 ? `gained ${fmt1(toDisplayWeight(badGroup, unit))}` : 'held steady'}.`
        : `${name} doesn't appear to move your scale either direction yet.`,
    };
  };

  // 1. STANDARD HABITS
  const baseAnalyses = [
    { name: 'Sleep', key: 'sleep_hours', threshold: 7.5, unitLabel: 'h', higherIsBetter: true },
    { name: 'Protein', key: 'protein_g', threshold: profile.protein_target || 110, unitLabel: 'g', higherIsBetter: true },
    { name: 'Steps', key: 'steps', threshold: profile.baseline_steps || 8000, higherIsBetter: true },
    { name: 'Calories burned', key: 'calories_out', higherIsBetter: true },
    { name: 'Alcohol', key: 'alcohol_units', threshold: 0.5, unitLabel: 'u', higherIsBetter: false },
    { name: 'Water', key: 'water_l', threshold: profile.water_target || 2.5, unitLabel: 'L', higherIsBetter: true },
    { name: 'Sleep quality', key: 'sleep_quality', threshold: 4, higherIsBetter: true },
    { name: 'Stress', key: 'stress', threshold: 3, higherIsBetter: false },
  ];
  for (const a of baseAnalyses) {
    const result = splitAnalyze(a);
    if (result) findings.push(result);
  }

  // 2. CALORIE DEFICIT analysis (special â€” derive from in/out)
  const deficitResult = splitAnalyze({
    name: 'Calorie deficit',
    key: 'deficit',
    threshold: 400,
    unitLabel: ' kcal',
    higherIsBetter: true,
    valueFn: (l) => (l.calories_in && l.calories_out) ? l.calories_out - l.calories_in : null,
  });
  if (deficitResult) findings.push(deficitResult);

  // 3. AM vs PM EXERCISE (when did you train? does timing matter?)
  const amPmPairs = [];
  for (let i = 0; i < logs.length - 1; i++) {
    const sessions = logs[i].sessions || [];
    if (sessions.length === 0) continue;
    if (!logs[i].weight_kg || !logs[i+1].weight_kg) continue;
    const am = sessions.some(s => s.timeOfDay === 'AM');
    const pm = sessions.some(s => s.timeOfDay === 'PM');
    if (am && !pm) amPmPairs.push({ when: 'AM', dw: logs[i+1].weight_kg - logs[i].weight_kg });
    else if (pm && !am) amPmPairs.push({ when: 'PM', dw: logs[i+1].weight_kg - logs[i].weight_kg });
  }
  if (amPmPairs.length >= 4) {
    const am = amPmPairs.filter(p => p.when === 'AM');
    const pm = amPmPairs.filter(p => p.when === 'PM');
    if (am.length >= 2 && pm.length >= 2) {
      const dwAm = am.reduce((s,p) => s+p.dw, 0) / am.length;
      const dwPm = pm.reduce((s,p) => s+p.dw, 0) / pm.length;
      const diff = dwPm - dwAm; // positive = AM training lost more
      if (Math.abs(diff) >= 0.1) {
        const better = diff > 0 ? 'AM' : 'PM';
        const worse = diff > 0 ? 'PM' : 'AM';
        findings.push({
          name: 'Training time of day',
          helps: true,
          impact: Math.abs(diff),
          goodLabel: `${better} training`,
          badLabel: `${worse} training`,
          dataPoints: amPmPairs.length,
          confidence: confidence(amPmPairs.length),
          detail: `${better} sessions: ${fmt1(toDisplayWeight(Math.abs(diff > 0 ? dwAm : dwPm), unit))} ${weightUnit(unit)} lost on average. ${worse} sessions: less effect. Could be physiological, could be coincidence â€” needs more data.`,
        });
      }
    }
  }

  // 4. NEAT (steps) vs STRUCTURED EXERCISE
  // For each day, classify as "high NEAT" (top half of steps), "high structured" (has hard session), or both
  const neatVsExercise = [];
  const stepDays = logs.filter(l => l.steps && l.weight_kg);
  if (stepDays.length >= 5) {
    const sortedSteps = [...stepDays].sort((a,b) => a.steps - b.steps);
    const stepMedian = sortedSteps[Math.floor(sortedSteps.length / 2)].steps;
    for (let i = 0; i < logs.length - 1; i++) {
      if (!logs[i].weight_kg || !logs[i+1].weight_kg || !logs[i].steps) continue;
      const sessions = logs[i].sessions || [];
      const hasHard = sessions.some(s => ['Strength', 'HIIT', 'Run', 'Long endurance', 'Football'].includes(s.type));
      const highNeat = logs[i].steps >= stepMedian;
      const dw = logs[i+1].weight_kg - logs[i].weight_kg;
      let category;
      if (highNeat && !hasHard) category = 'NEAT only';
      else if (!highNeat && hasHard) category = 'Exercise only';
      else if (highNeat && hasHard) category = 'Both';
      else category = 'Neither';
      neatVsExercise.push({ category, dw });
    }
    const groups = {};
    for (const p of neatVsExercise) {
      if (!groups[p.category]) groups[p.category] = [];
      groups[p.category].push(p.dw);
    }
    const groupAvgs = Object.entries(groups)
      .filter(([_, vals]) => vals.length >= 2)
      .map(([cat, vals]) => ({ cat, avg: vals.reduce((s,v) => s+v, 0) / vals.length, n: vals.length }));
    if (groupAvgs.length >= 2) {
      const best = groupAvgs.reduce((a, b) => a.avg < b.avg ? a : b);
      const worst = groupAvgs.reduce((a, b) => a.avg > b.avg ? a : b);
      if (best.cat !== worst.cat && Math.abs(best.avg - worst.avg) >= 0.1) {
        findings.push({
          name: 'NEAT vs structured exercise',
          helps: true,
          impact: Math.abs(best.avg - worst.avg),
          goodLabel: best.cat,
          badLabel: worst.cat,
          dataPoints: neatVsExercise.length,
          confidence: confidence(neatVsExercise.length),
          detail: `Your scale moved most on "${best.cat}" days (${fmt1(toDisplayWeight(Math.abs(best.avg), unit))} ${weightUnit(unit)} avg) and least on "${worst.cat}" days. NEAT = total steps, Exercise = structured strength/cardio session.`,
        });
      }
    }
  }

  // Sort by impact magnitude
  findings.sort((a, b) => Math.abs(b.impact) - Math.abs(a.impact));

  return {
    findings,
    daysLogged: totalDays,
    ready: totalDays >= 5,
    daysNeeded: Math.max(0, 5 - totalDays),
  };
}

// ============================================================
// NARRATOR â€” daily plain-English story about what the data shows
// Honest about what it can and can't conclude. Updates as data grows.
// Returns four sections: today, best vs worst, open hypotheses, honest limits
// ============================================================
function narrator(logs, profile, todayLog) {
  const unit = profile.unit_system || 'kg';
  const sorted = logs.slice().sort((a, b) => a.date.localeCompare(b.date));
  const out = {
    today: null,        // observation about today's numbers
    bestVsWorst: null,  // what differs between best and worst weight-loss days
    watching: [],       // open hypotheses the engine is testing
    cantSay: [],        // things data isn't showing yet
    daysLogged: sorted.length,
  };

 // ============ 1. TODAY VS YESTERDAY OBSERVATION ============
  if (sorted.length >= 2) {
    const todayDate = ymd(today());
    const todayRow = todayLog || sorted.find(l => l.date === todayDate);
    const priorDays = sorted.filter(l => l.date !== todayDate && l.weight_kg).slice(-3);
    const yesterday = priorDays.length ? priorDays[priorDays.length - 1] : null;

    if (todayRow && todayRow.weight_kg && yesterday && yesterday.weight_kg) {
      const diff = todayRow.weight_kg - yesterday.weight_kg;
      const direction = diff < -0.1 ? 'down' : diff > 0.1 ? 'up' : 'flat';
      const absDiff = Math.abs(diff);

      const candidates = [];
      const todaySleep = todayRow?.sleep_hours;

      const recent = sorted.filter(l => l.date !== yesterday.date && l.date !== todayRow.date).slice(-7);
      const avgSleep = avg(recent, 'sleep_hours');
      const avgSteps = avg(recent, 'steps');
      const avgCalOut = avg(recent, 'calories_out');
      const avgCalIn = avg(recent, 'calories_in');

      if (todaySleep && avgSleep) {
        const d = todaySleep - avgSleep;
        if (Math.abs(d) > 0.5)
          candidates.push(`sleep ${d > 0 ? 'high' : 'low'} (${fmt1(todaySleep)}h vs avg ${fmt1(avgSleep)}h)`);
      }
      if (yesterday.steps && avgSteps) {
        const d = yesterday.steps - avgSteps;
        if (Math.abs(d) >= 1500) candidates.push(`steps ${d > 0 ? 'higher' : 'lower'} (${fmt0(yesterday.steps)} vs avg ${fmt0(avgSteps)})`);
      }
      if (yesterday.calories_out && avgCalOut) {
        const d = yesterday.calories_out - avgCalOut;
        if (Math.abs(d) >= 200) candidates.push(`calorie burn ${d > 0 ? 'higher' : 'lower'} (${fmt0(yesterday.calories_out)} vs avg ${fmt0(avgCalOut)})`);
      }
      if (yesterday.calories_in && avgCalIn) {
        const d = yesterday.calories_in - avgCalIn;
        if (Math.abs(d) >= 200) candidates.push(`intake ${d > 0 ? 'higher' : 'lower'} (${fmt0(yesterday.calories_in)} vs avg ${fmt0(avgCalIn)})`);
      }
      if (yesterday.alcohol_units > 0) candidates.push(`alcohol (${yesterday.alcohol_units} units)`);
      if (yesterday.last_meal_time && yesterday.last_meal_time > '21:30') candidates.push(`late last meal (${yesterday.last_meal_time})`);
      if (yesterday.sessions && yesterday.sessions.length) {
        const types = yesterday.sessions.map(s => s.type).join(', ');
        const totalDuration = yesterday.sessions.reduce((sum, s) => sum + (s.duration || 0), 0);
        if (totalDuration >= 60) candidates.push(`big training day (${types}, ${totalDuration} min)`);
      }

      let headline, detail;
      if (direction === 'down') {
        headline = `Down ${fmt1(toDisplayWeight(absDiff, unit))} ${weightUnit(unit)} this morning`;
        detail = candidates.length
          ? `Yesterday stood out: ${candidates.slice(0, 3).join(', ')}. Engine is watching which of these repeats as a pattern.`
          : `Yesterday looked typical for you â€” could just be daily water variation. Worth watching the 7-day average.`;
      } else if (direction === 'up') {
        headline = `Up ${fmt1(toDisplayWeight(absDiff, unit))} ${weightUnit(unit)} this morning`;
        if (absDiff > 0.5) {
          detail = candidates.length
            ? `Yesterday: ${candidates.slice(0, 3).join(', ')}. Likely water from one of these â€” not fat regain. Watch tomorrow.`
            : `Could be hormonal water (luteal, sodium, late meal). Single-day swings >0.5kg are almost always water.`;
        } else {
          detail = candidates.length
            ? `Small change. Yesterday: ${candidates.slice(0, 2).join(', ')}. Normal daily fluctuation.`
            : `Within normal daily variation. The scale lies on single days â€” trust the weekly average.`;
        }
      } else {
        headline = `Weight flat this morning`;
        detail = candidates.length
          ? `Yesterday: ${candidates.slice(0, 2).join(', ')}. Held steady â€” neutral signal.`
          : `Typical day, typical morning. Look at the weekly trend to know if anything's actually moving.`;
      }
      out.today = { headline, detail };
    } else if (sorted.length >= 1 && !todayRow) {
      out.today = {
        headline: `Today's weight not logged yet`,
        detail: `Log this morning's weight to get today's observation.`,
      };
    }
  }
  // ============ 2. WHAT'S DIFFERENT ON DOWN-DAYS VS UP-DAYS ============
  // Use 3-day FORWARD weight change (smooths next-morning water noise).
  // Neutral language: "scale moved down" vs "scale moved up" â€” no judgement.
  const pairs = [];
  for (let i = 0; i < sorted.length - 3; i++) {
    const a = sorted[i];
    if (!a.weight_kg || a.is_refeed) continue;
    // Find 3-day forward average weight (using next 3 days)
    const next3 = sorted.slice(i+1, i+4).filter(l => l.weight_kg);
    if (next3.length < 2) continue;
    const fwdAvg = next3.reduce((s, l) => s + l.weight_kg, 0) / next3.length;
    pairs.push({ day: a, delta: fwdAvg - a.weight_kg });
  }
  if (pairs.length >= 4) {
    const sortedPairs = [...pairs].sort((a, b) => a.delta - b.delta);
    const downSize = Math.max(2, Math.floor(pairs.length / 3));
    const downDays = sortedPairs.slice(0, downSize);  // scale moved DOWN over next 3 days
    const upDays = sortedPairs.slice(-downSize);      // scale moved UP

    const groupAvg = (group, key) => {
      const vals = group.map(p => p.day[key]).filter(v => v !== null && v !== undefined);
      return vals.length ? vals.reduce((s,v) => s+v, 0) / vals.length : null;
    };
    const groupRate = (group, predicate) => {
      const count = group.filter(p => predicate(p.day)).length;
      return group.length ? count / group.length : null;
    };

    const diffs = [];
    // Sleep
    const ds = groupAvg(downDays, 'sleep_hours'), us = groupAvg(upDays, 'sleep_hours');
    if (ds !== null && us !== null && Math.abs(ds - us) >= 0.3) {
      diffs.push(`sleep: ${fmt1(ds)}h on down-days vs ${fmt1(us)}h on up-days`);
    }
    // Steps
    const dst = groupAvg(downDays, 'steps'), ust = groupAvg(upDays, 'steps');
    if (dst !== null && ust !== null && Math.abs(dst - ust) >= 1000) {
      diffs.push(`steps: ${fmt0(dst)} on down-days vs ${fmt0(ust)} on up-days`);
    }
    // Calories out
    const dco = groupAvg(downDays, 'calories_out'), uco = groupAvg(upDays, 'calories_out');
    if (dco !== null && uco !== null && Math.abs(dco - uco) >= 150) {
      diffs.push(`calorie burn: ${fmt0(dco)} on down-days vs ${fmt0(uco)} on up-days`);
    }
    // Protein
    const dp = groupAvg(downDays, 'protein_g'), up = groupAvg(upDays, 'protein_g');
    if (dp !== null && up !== null && Math.abs(dp - up) >= 10) {
      diffs.push(`protein: ${fmt0(dp)}g on down-days vs ${fmt0(up)}g on up-days`);
    }
    // Alcohol rate
    const da = groupRate(downDays, l => l.alcohol_units > 0);
    const ua = groupRate(upDays, l => l.alcohol_units > 0);
    if (da !== null && ua !== null && Math.abs(da - ua) >= 0.3) {
      diffs.push(`alcohol: ${Math.round(da*100)}% of down-days vs ${Math.round(ua*100)}% of up-days`);
    }
    // Training presence
    const dt = groupRate(downDays, l => (l.sessions || []).length > 0);
    const ut = groupRate(upDays, l => (l.sessions || []).length > 0);
    if (dt !== null && ut !== null && Math.abs(dt - ut) >= 0.3) {
      diffs.push(`training: ${Math.round(dt*100)}% of down-days had a session vs ${Math.round(ut*100)}% of up-days`);
    }
    // Late meal pattern
    const dl = groupRate(downDays, l => l.last_meal_time && l.last_meal_time > '21:00');
    const ul = groupRate(upDays, l => l.last_meal_time && l.last_meal_time > '21:00');
    if (dl !== null && ul !== null && Math.abs(dl - ul) >= 0.3) {
      diffs.push(`late meals: ${Math.round(dl*100)}% of down-days ate after 9pm vs ${Math.round(ul*100)}% of up-days`);
    }

  if (diffs.length > 0) {
  if (pairs.length >= 20) {
    out.bestVsWorst = {
      headline: `What tends to be different when your scale drops`,
      detail: `Across your ${pairs.length} logged 3-day windows: ${diffs.join('; ')}.`,
      caveat: `This is becoming a real pattern in your data, but still not a rule â€” water, cycle phase, food timing, and training load can still override the next-morning scale.`,
    };
  } else if (pairs.length >= 10) {
    out.bestVsWorst = {
      headline: `Early read: what looks different when the scale moves`,
      detail: `Across your ${pairs.length} logged 3-day windows so far: ${diffs.join('; ')}.`,
      caveat: `This is still a noisy early pattern, not a conclusion. Hard training days can push the scale up or down the next morning depending on water, glycogen, soreness, sodium, and cycle phase.`,
    };
  } else {
    out.bestVsWorst = {
      headline: `Too early to call a real pattern`,
      detail: `You have ${pairs.length} usable 3-day windows so far. That is enough to watch, but not enough to conclude what reliably makes your scale drop.`,
      caveat: `For now, treat single-day jumps after football, strength, long walks, or high-step days as likely water/noise unless the trend holds for several days.`,
    };
  }
} else if (pairs.length >= 4) {
  out.bestVsWorst = {
    headline: `Your days look similar across the board`,
    detail: `Your habits have been consistent. Without more variation, I can't separate what's moving the scale from what isn't. Vary one thing this week â€” sleep, steps, or training timing â€” and I'll learn faster.`,
    caveat: null,
  };
}
     }

  // ============ 3. OPEN HYPOTHESES (things being watched) ============
  const watching = [];

  // Day-of-week patterns (your "Tuesday after football" thing)
  const byDow = {};
  for (const p of pairs) {
    const dow = parseYMD(p.day.date).toLocaleDateString('en-GB', { weekday: 'short' });
    if (!byDow[dow]) byDow[dow] = [];
    byDow[dow].push(p.delta);
  }
  for (const [dow, deltas] of Object.entries(byDow)) {
    if (deltas.length >= 2) {
      const avgD = deltas.reduce((s,d) => s+d, 0) / deltas.length;
      if (avgD < -0.1) {
        watching.push({
          observation: `${dow} mornings: weight dropped ${deltas.filter(d => d < 0).length} of ${deltas.length} times`,
          needs: `${5 - deltas.length} more ${dow} data points to confirm`,
        });
      }
    }
  }

  // Football / specific session type pattern
  const footballPairs = pairs.filter(p => (p.day.sessions || []).some(s => s.type === 'Football'));
  if (footballPairs.length >= 2) {
    const wins = footballPairs.filter(p => p.delta < -0.05).length;
    watching.push({
      observation: `Days you played football: lost weight next morning ${wins} of ${footballPairs.length} times`,
      needs: footballPairs.length < 4
        ? `${4 - footballPairs.length} more football days to know if it's reliable`
        : `engine is checking if it's the football, the eating before, or the high calorie burn`,
    });
  }

  // Ate-before-training pattern (when last_meal_time exists and there was a session)
  const ateBeforeTrainingPairs = pairs.filter(p => {
    if (!p.day.last_meal_time || !p.day.sessions || p.day.sessions.length === 0) return false;
    // Rough check: PM session + last meal time before evening
    return p.day.sessions.some(s => s.timeOfDay === 'PM') && p.day.last_meal_time < '20:00';
  });
  if (ateBeforeTrainingPairs.length >= 2) {
    const wins = ateBeforeTrainingPairs.filter(p => p.delta < -0.05).length;
    if (wins >= ateBeforeTrainingPairs.length / 2) {
      watching.push({
        observation: `Eating before evening training: weight dropped ${wins} of ${ateBeforeTrainingPairs.length} times`,
        needs: ateBeforeTrainingPairs.length < 4 ? `${4 - ateBeforeTrainingPairs.length} more such days to confirm` : `pattern looks real â€” watching for confirmation`,
      });
    }
  }

  // Late eating impact
  const lateMealPairs = pairs.filter(p => p.day.last_meal_time && p.day.last_meal_time > '22:00');
  if (lateMealPairs.length >= 2) {
    const gainCount = lateMealPairs.filter(p => p.delta > 0.05).length;
    if (gainCount >= lateMealPairs.length / 2) {
      watching.push({
        observation: `Eating after 10pm: weight up next morning ${gainCount} of ${lateMealPairs.length} times`,
        needs: lateMealPairs.length < 4 ? `${4 - lateMealPairs.length} more late-eating days to confirm` : `pattern is consistent`,
      });
    }
  }

  out.watching = watching.slice(0, 4);

  // ============ 4. HONEST LIMITS ============
  const limits = [];
  // Sleep effect
  const sleepPairs = pairs.filter(p => p.day.sleep_hours);
  if (sleepPairs.length >= 4) {
    const highSleep = sleepPairs.filter(p => p.day.sleep_hours >= 7.5);
    const lowSleep = sleepPairs.filter(p => p.day.sleep_hours < 7);
    if (highSleep.length >= 2 && lowSleep.length >= 2) {
      const hAvg = highSleep.reduce((s,p) => s+p.delta, 0) / highSleep.length;
      const lAvg = lowSleep.reduce((s,p) => s+p.delta, 0) / lowSleep.length;
      if (Math.abs(hAvg - lAvg) < 0.1) {
        limits.push(`Sleep â‰¥7.5h vs <7h: no clear effect on YOUR scale yet (might need cycle context, or sleep matters less for you than for most)`);
      }
    } else {
      limits.push(`Sleep effect: need more variation (you've been consistent on sleep)`);
    }
  } else if (sorted.length >= 5) {
    limits.push(`Sleep effect: not enough sleep+weight data points yet`);
  }

  // Cycle phase effect â€” need at least one full cycle
  if (profile.track_cycle && sorted.length < 28) {
    limits.push(`Cycle phase Ã— deficit interaction: need a full cycle (28+ days) to compare follicular vs luteal`);
  }

  // Body fat / muscle effect
  const bfPairs = pairs.filter(p => p.day.body_fat_pct);
  if (bfPairs.length < 7) {
    limits.push(`Body fat trend: ${bfPairs.length} days logged â€” needs 14+ for fat-vs-water disambiguation`);
  }

  // Adherence patterns
  const adherenceDays = sorted.filter(l => l.adherence_category).length;
  if (adherenceDays < 14) {
    limits.push(`Fall-off patterns: need more days logged across on-plan, partial, and refeed types`);
  }

  out.cantSay = limits.slice(0, 4);

  return out;
}

// ============================================================
// DIAGNOSE â€” real analysis of a day or week's data
// Returns plain-English diagnostic messages explaining what's working and what isn't
// Used by dashboard's "Today's prompt" and the Review tab
// ============================================================
function diagnoseDay(log, profile, recentLogs) {
  if (!log) return [];
  const unit = profile.unit_system || 'kg';
  const out = [];

  const calIn = log.calories_in;
  const calOut = log.calories_out;
  const deficit = (calIn && calOut) ? calOut - calIn : null;
  const protein = log.protein_g;
  const carbs = log.carbs_g;
  const fat = log.fat_g;
  const water = log.water_l;
  const steps = log.steps;
  const sleep = log.sleep_hours;
  const hrv = log.hrv;
  const totalMacroCal = (protein||0) * 4 + (carbs||0) * 4 + (fat||0) * 9;
  const fatPct = totalMacroCal > 0 && fat ? (fat * 9) / totalMacroCal * 100 : null;

  // Has weight stalled? Compare last 5 days
  const recentWeights = recentLogs.filter(l => l.weight_kg).slice(-5).map(l => l.weight_kg);
  const stalled = recentWeights.length >= 3 && (Math.max(...recentWeights) - Math.min(...recentWeights)) < 0.4;

  // 1. DEFICIT ANALYSIS
  if (deficit !== null) {
    if (deficit < 200) {
      out.push({
        type: 'deficit',
        tone: 'warn',
        headline: `Deficit only ${Math.round(deficit)} kcal`,
        detail: `Too small to overcome daily water variation. To lose ${profile.unit_system === 'lbs' ? '1 lb' : '0.5kg'}/week you need ~500 kcal deficit daily. Don't drop intake â€” increase output.`,
      });
    } else if (deficit < 400 && stalled) {
      out.push({
        type: 'deficit',
        tone: 'warn',
        headline: `Deficit of ${Math.round(deficit)} kcal isn't moving the scale`,
        detail: `Weight stable past few days. Two options: more movement (zone 2, walking, NEAT) â€” not eating less. If you're already hungry at this intake, restricting more risks muscle and rebound.`,
      });
    } else if (deficit >= 400 && deficit <= 700) {
      out.push({
        type: 'deficit',
        tone: 'good',
        headline: `Deficit of ${Math.round(deficit)} kcal â€” sustainable range`,
        detail: `This is the healthy fat-loss zone (0.5-1% bodyweight/week). Hold steady.`,
      });
    } else if (deficit > 800) {
      out.push({
        type: 'deficit',
        tone: 'warn',
        headline: `Deficit of ${Math.round(deficit)} kcal â€” too aggressive`,
        detail: `Sustained deficits >800 kcal in peri cause muscle loss, drop NEAT, and tank recovery. Eat more â€” especially around training.`,
      });
    }
  }

  // 2. HUNGER + STALL: high movement, near-maintenance intake, no weight movement
  if (calIn && calOut && deficit !== null && deficit > 0 && deficit < 500 && stalled && steps && steps > 12000) {
    out.push({
      type: 'lever',
      tone: 'info',
      headline: `Your steps are doing the work â€” something else is the limit`,
      detail: `${steps.toLocaleString()} steps is real output. With a small deficit and a flat scale, the limiter is usually one of: water (you logged ${water ? fmt1(toDisplayWater(water, unit)) + ' ' + waterUnit(unit) : 'no water'}), sleep, hormonal water retention, or you need a slightly larger deficit from output, not food.`,
    });
  }

  // 3. WATER UNDER 70% of target
  if (water !== null && water !== undefined && profile.water_target && water < profile.water_target * 0.7) {
    const gap = profile.water_target - water;
    out.push({
      type: 'water',
      tone: 'warn',
      headline: `Water is low â€” ${fmt1(toDisplayWater(water, unit))} ${waterUnit(unit)}`,
      detail: `Target is ${fmt1(toDisplayWater(profile.water_target, unit))} ${waterUnit(unit)}. Dehydration suppresses fat oxidation and increases hunger signal. Single biggest free lever today: drink ${fmt1(toDisplayWater(gap, unit))} more ${waterUnit(unit)}.`,
    });
  }

  // 4. CARBS AROUND TRAINING (only flag if she trained AND carbs were low â€” not about fat being high)
  // Healthy fats are essential for hormones in peri. The issue is carb adequacy around training, not fat amount.
  const trainedHard = (log.sessions || []).some(s => ['Strength', 'HIIT', 'Long endurance', 'Football', 'Run'].includes(s.type) && s.duration >= 30);
  if (trainedHard && carbs !== null && carbs !== undefined && log.weight_kg && carbs / log.weight_kg < 2.5) {
    out.push({
      type: 'macros',
      tone: 'info',
      headline: `Carbs (${carbs}g) low for the training you did today`,
      detail: `For ${log.weight_kg}kg with intense training, aim for ~${Math.round(log.weight_kg * 3)}g+ carbs. Healthy fats are non-negotiable for hormones â€” don't cut them. Add carbs around training sessions.`,
    });
  }

  // 5. PROTEIN PRAISE (if hit)
  if (protein && profile.protein_target && protein >= profile.protein_target) {
    // Don't bombard â€” only mention if it's a standout
    const bw = log.weight_kg || profile.start_weight_kg;
    if (bw && protein / bw >= 1.8) {
      out.push({
        type: 'protein',
        tone: 'good',
        headline: `${protein}g protein â€” ${fmt1(protein/bw)}g per kg`,
        detail: `Above the 1.6g/kg threshold for muscle protection in peri. This is the lever that lets you lose fat without losing strength.`,
      });
    }
  }

  // 6. PROTEIN MISS
  if (protein !== null && protein !== undefined && profile.protein_target && protein < profile.protein_target * 0.8) {
    out.push({
      type: 'protein',
      tone: 'warn',
      headline: `Protein low â€” ${protein}g (target ${profile.protein_target}g)`,
      detail: `Under-eating protein in peri = muscle loss + slower metabolism. Non-negotiable lever. Add a protein-forward snack (whey shake, Greek yoghurt, eggs).`,
    });
  }

  // 7. SLEEP DEBT
  if (sleep !== null && sleep !== undefined && sleep < 6.5) {
    out.push({
      type: 'sleep',
      tone: 'warn',
      headline: `Sleep was ${fmt1(sleep)}h â€” too short`,
      detail: `Under 7h elevates cortisol, raises hunger hormones (ghrelin), and drops NEAT next day by 15-20%. This is likely cascading through your numbers.`,
    });
  }

  // 8. HRV DROP vs recent baseline â€” only fires if today is meaningfully below trailing 7-day average
  // CRITICAL: exclude today's reading from the baseline (otherwise today's value skews its own comparison)
  if (hrv && log.date) {
    const priorHrvLogs = recentLogs.filter(l => l.hrv && l.date !== log.date).slice(-7);
    if (priorHrvLogs.length >= 3) {
      const priorHrvAvg = avg(priorHrvLogs, 'hrv');
      if (priorHrvAvg && hrv < priorHrvAvg * 0.85) {
        let cause = '';
        if (log.alcohol_units > 0) cause = ` Likely the alcohol last night.`;
        else if (sleep && sleep < 7) cause = ` Likely the short sleep.`;
        else if (log.stress >= 4) cause = ` Stress was high.`;
        out.push({
          type: 'recovery',
          tone: 'warn',
          headline: `HRV is ${Math.round(((priorHrvAvg - hrv) / priorHrvAvg) * 100)}% below your recent average`,
          detail: `Today: ${hrv}ms vs ${fmt0(priorHrvAvg)}ms average.${cause} Don't push intensity â€” zone 2 or rest.`,
        });
      } else if (priorHrvAvg && hrv > priorHrvAvg * 1.10) {
        // Praise when HRV is meaningfully UP
        out.push({
          type: 'recovery',
          tone: 'good',
          headline: `HRV is ${Math.round(((hrv - priorHrvAvg) / priorHrvAvg) * 100)}% above your recent average`,
          detail: `Today: ${hrv}ms vs ${fmt0(priorHrvAvg)}ms average. Recovery is strong â€” green light for intensity if your phase allows.`,
        });
      }
    }
  }

  return out;
}

// Aggregate diagnosis for a date range (used by Review tab)
function diagnoseRange(logs, profile, label) {
  if (logs.length === 0) return [];
  const unit = profile.unit_system || 'kg';
  const out = [];

  const avgCalIn = avg(logs, 'calories_in');
  const avgCalOut = avg(logs, 'calories_out');
  const avgDeficit = (avgCalIn && avgCalOut) ? avgCalOut - avgCalIn : null;
  const avgSteps = avg(logs, 'steps');
  const avgSleep = avg(logs, 'sleep_hours');
  const avgProtein = avg(logs, 'protein_g');
  const avgWater = avg(logs, 'water_l');
  const totalAlcohol = logs.reduce((s,l) => s + (l.alcohol_units || 0), 0);

  // Weight trajectory
  const wLogs = logs.filter(l => l.weight_kg);
  if (wLogs.length >= 2) {
    const wChange = wLogs[wLogs.length-1].weight_kg - wLogs[0].weight_kg;
    if (Math.abs(wChange) >= 0.2) {
      out.push({
        type: 'trajectory',
        tone: wChange < 0 ? 'good' : 'neutral',
        headline: wChange < 0 ? `Weight down ${fmt1(toDisplayWeight(Math.abs(wChange), unit))} ${weightUnit(unit)} ${label}` : `Weight up ${fmt1(toDisplayWeight(wChange, unit))} ${weightUnit(unit)} ${label}`,
        detail: wChange < 0
          ? `Trend is moving. Hold the levers that got you here.`
          : `Could be water (alcohol, sodium, luteal) or genuine. Check the body-fat trend on Weight trends to know.`,
      });
    } else {
      out.push({
        type: 'trajectory',
        tone: 'neutral',
        headline: `Weight held steady ${label}`,
        detail: `Sometimes that's the win, sometimes that's a stall. Look at the levers below.`,
      });
    }
  }

  // Deficit story
  if (avgDeficit !== null) {
    if (avgDeficit < 200) {
      out.push({
        type: 'lever',
        tone: 'warn',
        headline: `Average daily deficit only ${Math.round(avgDeficit)} kcal`,
        detail: `Too small to drive consistent weight loss. The fix is more output (steps, zone 2, NEAT), not less food.`,
      });
    } else if (avgDeficit > 800) {
      out.push({
        type: 'lever',
        tone: 'warn',
        headline: `Average daily deficit ${Math.round(avgDeficit)} kcal â€” too aggressive ${label}`,
        detail: `Sustained over weeks this drops muscle and metabolic rate. Eat more, especially around training.`,
      });
    } else {
      out.push({
        type: 'lever',
        tone: 'good',
        headline: `Avg deficit ${Math.round(avgDeficit)} kcal ${label} â€” sustainable range`,
        detail: `This is where healthy fat loss happens. Stay here.`,
      });
    }
  }

  // Sleep summary
  if (avgSleep !== null) {
    if (avgSleep < 7) {
      out.push({
        type: 'sleep',
        tone: 'warn',
        headline: `Average sleep ${fmt1(avgSleep)}h ${label}`,
        detail: `Sleep is your single biggest free lever. Under 7h consistently is the most common reason "the diet isn't working."`,
      });
    } else if (avgSleep >= 7.5) {
      out.push({
        type: 'sleep',
        tone: 'good',
        headline: `Sleep averaging ${fmt1(avgSleep)}h ${label}`,
        detail: `This is the foundation. Keep protecting it.`,
      });
    }
  }

  // Water summary
  if (avgWater !== null && profile.water_target && avgWater < profile.water_target * 0.75) {
    out.push({
      type: 'water',
      tone: 'warn',
      headline: `Water averaging ${fmt1(toDisplayWater(avgWater, unit))} ${waterUnit(unit)} ${label}`,
      detail: `Target is ${fmt1(toDisplayWater(profile.water_target, unit))} ${waterUnit(unit)}. Hydration affects fat oxidation, hunger, and HRV.`,
    });
  }

  // Protein adequacy
  if (avgProtein !== null && profile.protein_target) {
    const hitPct = logs.filter(l => l.protein_g && l.protein_g >= profile.protein_target).length / logs.filter(l => l.protein_g).length * 100;
    if (hitPct >= 80) {
      out.push({
        type: 'protein',
        tone: 'good',
        headline: `Hit protein target ${Math.round(hitPct)}% of logged days`,
        detail: `This protects muscle through fat loss. Critical in peri.`,
      });
    } else if (hitPct < 50) {
      out.push({
        type: 'protein',
        tone: 'warn',
        headline: `Hit protein only ${Math.round(hitPct)}% of days`,
        detail: `Under-eating protein is the fastest way to lose muscle alongside fat. In peri this accelerates regain.`,
      });
    }
  }

  // Steps
  if (avgSteps !== null && profile.baseline_steps) {
    if (avgSteps >= profile.baseline_steps) {
      out.push({
        type: 'steps',
        tone: 'good',
        headline: `Averaging ${fmt0(avgSteps)} steps/day ${label}`,
        detail: `NEAT is where the deficit lives â€” not the gym. Keep this up.`,
      });
    } else if (avgSteps < profile.baseline_steps * 0.7) {
      out.push({
        type: 'steps',
        tone: 'warn',
        headline: `Steps averaged ${fmt0(avgSteps)} ${label}`,
        detail: `Well below baseline. Easiest lever to increase deficit without restricting food.`,
      });
    }
  }

  // Alcohol
  if (totalAlcohol > 7) {
    out.push({
      type: 'alcohol',
      tone: 'warn',
      headline: `${totalAlcohol} units of alcohol ${label}`,
      detail: `Alcohol suppresses fat oxidation for 36+ hours, tanks HRV, fragments sleep. The single biggest hidden weight-loss blocker.`,
    });
  }

  // ============ RECOVERY DIAGNOSTICS ============
  const avgHrv = avg(logs, 'hrv');
  const avgRhr = avg(logs, 'rhr');
  const avgSleepQ = avg(logs, 'sleep_quality');

  // HRV trend across the period
  const hrvLogs = logs.filter(l => l.hrv);
  if (hrvLogs.length >= 5) {
    const firstHalf = hrvLogs.slice(0, Math.floor(hrvLogs.length / 2));
    const secondHalf = hrvLogs.slice(Math.floor(hrvLogs.length / 2));
    const hrvDiff = avg(secondHalf, 'hrv') - avg(firstHalf, 'hrv');
    if (Math.abs(hrvDiff) >= 3) {
      out.push({
        type: 'recovery',
        tone: hrvDiff > 0 ? 'good' : 'warn',
        headline: hrvDiff > 0
          ? `HRV trending up â€” recovery is improving`
          : `HRV trending down â€” recovery debt building`,
        detail: hrvDiff > 0
          ? `Up ${Math.round(hrvDiff)}ms across ${label}. Whatever you're doing for sleep, stress and load is working.`
          : `Down ${Math.round(Math.abs(hrvDiff))}ms across ${label}. Pulling sleep, alcohol, training load and stress will all help. Don't ignore.`,
      });
    }
  }

  // RHR trend (lower is better for cardiovascular fitness)
  const rhrLogs = logs.filter(l => l.rhr);
  if (rhrLogs.length >= 5) {
    const firstHalf = rhrLogs.slice(0, Math.floor(rhrLogs.length / 2));
    const secondHalf = rhrLogs.slice(Math.floor(rhrLogs.length / 2));
    const rhrDiff = avg(secondHalf, 'rhr') - avg(firstHalf, 'rhr');
    if (Math.abs(rhrDiff) >= 2) {
      out.push({
        type: 'recovery',
        tone: rhrDiff < 0 ? 'good' : 'warn',
        headline: rhrDiff < 0
          ? `RHR dropping â€” fitness improving`
          : `RHR climbing â€” recovery or stress signal`,
        detail: rhrDiff < 0
          ? `Down ${Math.abs(rhrDiff).toFixed(1)} bpm ${label}. Zone 2 cardio + recovery is paying off.`
          : `Up ${rhrDiff.toFixed(1)} bpm ${label}. Often signals overreaching, illness coming, poor sleep, or chronic stress.`,
      });
    }
  }

  // Recovery score baseline (if HRV + RHR both logged consistently)
  if (avgHrv && avgRhr && hrvLogs.length >= 5) {
    out.push({
      type: 'recovery',
      tone: 'neutral',
      headline: `Recovery baseline: HRV ${fmt0(avgHrv)}ms, RHR ${fmt0(avgRhr)}bpm`,
      detail: `Your average for ${label}. Use this as your reference â€” daily numbers below this mean back off, above means push.`,
    });
  }

  // Sleep quality
  if (avgSleepQ !== null && avgSleepQ < 3) {
    out.push({
      type: 'recovery',
      tone: 'warn',
      headline: `Sleep quality averaging ${fmt1(avgSleepQ)}/5`,
      detail: `Quality not just quantity matters. Common peri fixes: cool bedroom, magnesium before bed, no alcohol weeknights, protein-forward dinner to stabilise blood sugar overnight.`,
    });
  }

  // Training load vs recovery â€” overreaching warning
  const allSessions = logs.flatMap(l => l.sessions || []);
  const hardSessions = allSessions.filter(s => ['Strength', 'HIIT', 'Long endurance', 'Football', 'Run'].includes(s.type)).length;
  const easySessions = allSessions.filter(s => ['Walk', 'Yoga/mobility', 'Zone 2'].includes(s.type)).length;
  if (hardSessions >= 6 && avgHrv && hrvLogs.length >= 5) {
    const trendDown = hrvLogs.slice(-3).every((l, i, arr) => i === 0 || l.hrv <= arr[i-1].hrv);
    if (trendDown) {
      out.push({
        type: 'recovery',
        tone: 'warn',
        headline: `Training load high + HRV trending down ${label}`,
        detail: `${hardSessions} high-intensity sessions plus dropping HRV = overreaching pattern. Swap 1-2 hard sessions for zone 2 or rest this week. In peri, recovery IS the limiting factor.`,
      });
    }
  }
  if (easySessions >= 5 && hardSessions <= 2 && logs.length >= 7) {
    out.push({
      type: 'recovery',
      tone: 'neutral',
      headline: `Lots of easy movement, little intensity ${label}`,
      detail: `${easySessions} easy sessions, ${hardSessions} hard. Good for recovery, but in peri you need 2-3 strength sessions/week to protect muscle. Don't drop intensity entirely.`,
    });
  }

  // Calories burned from sessions (if logged)
  const sessionCals = allSessions.filter(s => s.calories).reduce((sum, s) => sum + s.calories, 0);
  if (sessionCals > 0 && logs.length >= 3) {
    out.push({
      type: 'training',
      tone: 'neutral',
      headline: `Burned ${fmt0(sessionCals)} kcal in tracked sessions ${label}`,
      detail: `${(sessionCals/logs.length).toFixed(0)} kcal/day from training. NEAT (steps, daily movement) usually 2-3x this number â€” both matter for the deficit.`,
    });
  }

  return out;
}

// ============================================================
// PROGRESS METRICS â€” for keeping users motivated through sparse early weeks
// ============================================================
// ============================================================
// ADHERENCE â€” silent computation per day, used by engine to filter/interpret data
// Score 0-100 based on % of targets hit. Category for quick filtering.
// NOT shown to user as a number â€” only the engine uses it.
// ============================================================
function calcAdherence(log, profile) {
  if (!log) return { score: null, category: null };
  if (log.is_refeed) return { score: null, category: 'refeed' };

  const checks = [];
  // Protein
  if (profile.protein_target && log.protein_g) {
    checks.push(log.protein_g >= profile.protein_target ? 1 : 0);
  }
  // Water
  if (profile.water_target && log.water_l) {
    checks.push(log.water_l >= profile.water_target * 0.9 ? 1 : 0);
  }
  // Sleep
  if (profile.sleep_target && log.sleep_hours) {
    checks.push(log.sleep_hours >= profile.sleep_target * 0.9 ? 1 : 0);
  }
  // Steps
  if (profile.baseline_steps && log.steps) {
    checks.push(log.steps >= profile.baseline_steps * 0.85 ? 1 : 0);
  }
  // Alcohol (low = good, 0-2 units acceptable on a target day)
  if (log.alcohol_units !== null && log.alcohol_units !== undefined) {
    checks.push(log.alcohol_units <= 2 ? 1 : 0);
  }

  if (checks.length === 0) return { score: null, category: null };
  const score = Math.round((checks.reduce((s, v) => s + v, 0) / checks.length) * 100);
  let category;
  if (score >= 80) category = 'on_plan';
  else if (score >= 50) category = 'partial';
  else category = 'off_plan';
  return { score, category };
}

function progressStatus(logs, profile) {
  const daysLogged = logs.length;
  const out = { daysLogged, streak: 0, nextUnlock: null, tinyWins: [] };

  // Calculate streak (consecutive days from most recent)
  let streak = 0;
  const dateSet = new Set(logs.map(l => l.date));
  let cursor = today();
  // If today not logged, start counting from yesterday
  if (!dateSet.has(ymd(cursor))) cursor = new Date(cursor.getTime() - 86400000);
  while (dateSet.has(ymd(cursor))) {
    streak++;
    cursor = new Date(cursor.getTime() - 86400000);
  }
  out.streak = streak;

  // What unlocks next
  if (daysLogged < 3) out.nextUnlock = `${3 - daysLogged} more day${3 - daysLogged === 1 ? '' : 's'} until your first weight trend`;
  else if (daysLogged < 7) out.nextUnlock = `${7 - daysLogged} more day${7 - daysLogged === 1 ? '' : 's'} until correlations unlock`;
  else if (daysLogged < 14) out.nextUnlock = `${14 - daysLogged} more day${14 - daysLogged === 1 ? '' : 's'} until full cycle insights`;
  else if (daysLogged < 28) out.nextUnlock = `${28 - daysLogged} more day${28 - daysLogged === 1 ? '' : 's'} until your recovery baseline locks in`;

  // Tiny wins â€” observations from first few days even without correlations
  if (daysLogged >= 2) {
    const wLogs = logs.filter(l => l.weight_kg);
    if (wLogs.length >= 2) {
      const change = wLogs[wLogs.length-1].weight_kg - wLogs[0].weight_kg;
      if (change < -0.1) out.tinyWins.push(`Weight down ${fmt1(toDisplayWeight(Math.abs(change), profile.unit_system))} ${weightUnit(profile.unit_system)} since first log`);
    }
    const sLogs = logs.filter(l => l.sleep_hours);
    if (sLogs.length >= 2) {
      const change = sLogs[sLogs.length-1].sleep_hours - sLogs[0].sleep_hours;
      if (change > 0.3) out.tinyWins.push(`Sleep up ${fmt1(change)}h vs your first day`);
    }
    const proteinHits = logs.filter(l => l.protein_g && profile.protein_target && l.protein_g >= profile.protein_target).length;
    if (proteinHits >= 2) out.tinyWins.push(`Hit protein target ${proteinHits} of ${daysLogged} days`);
    const stepDays = logs.filter(l => l.steps && profile.baseline_steps && l.steps >= profile.baseline_steps).length;
    if (stepDays >= 2) out.tinyWins.push(`Hit step target ${stepDays} of ${daysLogged} days`);
  }

  return out;
}

function MultiLineChart({ series, w = 480, h = 180 }) {
  const leftSeries = series.filter(s => s.axis === 'left');
  const rightSeries = series.filter(s => s.axis === 'right');
  const leftAll = leftSeries.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  const rightAll = rightSeries.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  if (!leftAll.length && !rightAll.length) {
    return <div style={{ fontSize: 12, color: 'var(--text-faint)', fontStyle: 'italic', padding: '24px 0', textAlign: 'center' }}>Charts appear after a few days of logging.</div>;
  }
  const leftMin = leftAll.length ? Math.min(...leftAll) : 0;
  const leftMax = leftAll.length ? Math.max(...leftAll) : 1;
  const leftRange = leftMax - leftMin || 1;
  const rightMin = rightAll.length ? Math.min(...rightAll) : 0;
  const rightMax = rightAll.length ? Math.max(...rightAll) : 1;
  const rightRange = rightMax - rightMin || 1;
  const n = series[0]?.values.length || 0;
  const padX = 30; const padY = 16;
  const innerW = w - padX * 2;
  const innerH = h - padY * 2;
  const pointsFor = (s) => s.values.map((v, i) => {
    if (v === null || v === undefined) return null;
    const x = padX + (i / Math.max(n - 1, 1)) * innerW;
    const min = s.axis === 'left' ? leftMin : rightMin;
    const range = s.axis === 'left' ? leftRange : rightRange;
    const y = padY + innerH - ((v - min) / range) * innerH;
    return { x, y };
  }).filter(Boolean);
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h}`} style={{ display: 'block' }}>
      {[0, 0.25, 0.5, 0.75, 1].map(t => (
        <line key={t} x1={padX} y1={padY + t * innerH} x2={padX + innerW} y2={padY + t * innerH} stroke="rgba(11,29,33,0.08)" strokeWidth={0.5} />
      ))}
      {series.map((s, si) => {
        const pts = pointsFor(s);
        if (!pts.length) return null;
        const pathD = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
        return (
          <g key={si}>
            <path d={pathD} fill="none" stroke={s.color} strokeWidth={2.5} />
            {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r={i === pts.length - 1 ? 4 : 2.5} fill={s.color} />)}
          </g>
        );
      })}
      {leftAll.length > 0 && (
        <>
          <text x={padX - 4} y={padY + 4} fontSize="9" fill={leftSeries[0].color} textAnchor="end">{leftMax.toFixed(1)}</text>
          <text x={padX - 4} y={padY + innerH} fontSize="9" fill={leftSeries[0].color} textAnchor="end">{leftMin.toFixed(1)}</text>
        </>
      )}
      {rightAll.length > 0 && (
        <>
          <text x={padX + innerW + 4} y={padY + 4} fontSize="9" fill={rightSeries[0].color}>{rightMax.toFixed(1)}</text>
          <text x={padX + innerW + 4} y={padY + innerH} fontSize="9" fill={rightSeries[0].color}>{rightMin.toFixed(1)}</text>
        </>
      )}
    </svg>
  );
}

  const [duration, setDuration] = useState('');
  const [rpe, setRpe] = useState('');
  const [calories, setCalories] = useState('');

      </div>
    </div>
  );
}
