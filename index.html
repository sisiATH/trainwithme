function AuthScreen() {
  const [email, setEmail] = useState('');
  const [status, setStatus] = useState('idle');
  const [errorMsg, setErrorMsg] = useState('');

  async function sendMagicLink() {
    if (!email || !email.includes('@')) { setStatus('error'); setErrorMsg('Enter a valid email'); return; }
    setStatus('sending');
    try {
      const { error } = await db.auth.signInWithOtp({
        email: email.trim(),
        options: { emailRedirectTo: window.location.origin + window.location.pathname }
      });
      if (error) throw error;
      setStatus('sent');
    } catch (err) {
      setStatus('error');
      setErrorMsg(err.message || 'Something went wrong');
    }
  }

  return (
    <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: 24, background: 'var(--bg)' }}>
      <div style={{ maxWidth: 460, width: '100%' }}>
        <div style={{ textAlign: 'center', marginBottom: 36 }}>
          <h1 className="script" style={{ fontSize: 56, color: 'var(--pink)', lineHeight: 1, marginBottom: 8 }}>Train with me</h1>
          <p style={{ fontSize: 14, color: 'var(--text-mute)', lineHeight: 1.6 }}>
            For women training through peri. Track what's working, fuel sessions, move with your cycle.
          </p>
        </div>

        {status === 'sent' ? (
          <div className="card" style={{ textAlign: 'center', padding: 32 }}>
            <p style={{ fontSize: 18, fontWeight: 600, color: 'var(--teal)', marginBottom: 10 }}>Check your inbox</p>
            <p style={{ fontSize: 13, color: 'var(--text-mute)', lineHeight: 1.6 }}>
              We sent a sign-in link to <strong>{email}</strong>. Tap it on this device.
            </p>
          </div>
        ) : (
          <div className="card" style={{ padding: 28 }}>
            <p className="label" style={{ marginBottom: 8 }}>Your email</p>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" className="input-accent" onKeyDown={(e) => e.key === 'Enter' && sendMagicLink()} />

function Onboarding({ user, onDone }) {
  const [name, setName] = useState('');
  const [unit, setUnit] = useState('kg');
  const [startWeight, setStartWeight] = useState('');
  const [goalWeight, setGoalWeight] = useState('');
  const [goalDate, setGoalDate] = useState(ymd(new Date(Date.now() + 21*86400000)));
  const [lifeStage, setLifeStage] = useState('Perimenopause');
  const [height, setHeight] = useState('');
  const [age, setAge] = useState('');
  const [trackCycle, setTrackCycle] = useState(true);
  const [regularity, setRegularity] = useState('Irregular');
  const [knowLength, setKnowLength] = useState(false);
  const [lastPeriod, setLastPeriod] = useState('');
  const [cycleLength, setCycleLength] = useState(28);
  const [periodLength, setPeriodLength] = useState(5);
  const [baselineSteps, setBaselineSteps] = useState(8000);
  const [proteinTarget, setProteinTarget] = useState(110);
  const [waterTarget, setWaterTarget] = useState(2.5);
  const [sleepTarget, setSleepTarget] = useState(7.5);
  const [agreed, setAgreed] = useState(false);
  const [saving, setSaving] = useState(false);

  // Switch water default when unit changes (2.5L â‰ˆ 85 fl oz)
  useEffect(() => {
    setWaterTarget(prev => {
      const n = Number(prev);
      if (!n) return isImperial(unit) ? 85 : 2.5;
      // Only convert if value matches the other system's default
      if (isImperial(unit) && n <= 5) return Math.round(n * 33.814);
      if (!isImperial(unit) && n > 5) return +(n / 33.814).toFixed(1);
      return prev;
    });
  }, [unit]);

  const isPeri = lifeStage === 'Perimenopause' || lifeStage === 'Post-menopause';
  const hasCycles = !(regularity === 'None anymore');

  async function save() {
    setSaving(true);
    const profile = {
      user_id: user.id, email: user.email, name: name.trim(), unit_system: unit,
      start_weight_kg: fromDisplayWeight(startWeight, unit),
      goal_weight_kg: fromDisplayWeight(goalWeight, unit),
      goal_date: goalDate, life_stage: lifeStage,
      height_cm: fromDisplayHeight(height, unit),
      age: age ? Number(age) : null,
      track_cycle: trackCycle && hasCycles,
      cycle_regularity: trackCycle ? regularity : null,
      cycle_length_auto: knowLength,
      last_period_start: lastPeriod || null,
      cycle_length: Number(cycleLength) || 28,
      period_length: Number(periodLength) || 5,
      baseline_steps: Number(baselineSteps) || 8000,
      protein_target: Number(proteinTarget) || 110,
      water_target: fromDisplayWater(waterTarget, unit) || 2.5,
      sleep_target: Number(sleepTarget) || 7.5,
      onboarded_at: new Date().toISOString(),
    };
    const { error } = await db.from('profiles').upsert(profile);
    setSaving(false);
    if (error) { alert('Could not save: ' + error.message); return; }
    onDone();
  }

  return (
    <div style={{ minHeight: '100vh', padding: '36px 20px 60px', background: 'var(--bg)' }}>
      <div style={{ maxWidth: 560, margin: '0 auto' }}>
        <div style={{ textAlign: 'center', marginBottom: 28 }}>
          <h1 className="script" style={{ fontSize: 42, color: 'var(--pink)', lineHeight: 1, marginBottom: 6 }}>Train with me</h1>
          <p style={{ fontSize: 14, color: 'var(--text-mute)' }}>Quick setup. Takes a minute.</p>
        </div>

        <div className="card" style={{ marginBottom: 14 }}>
          <div className="label" style={{ marginBottom: 14 }}>About you</div>
          <div className="row row-2">
            <div><div className="field-label">Name</div><input className="input" value={name} onChange={(e) => setName(e.target.value)} placeholder="First name" /></div>
            <div><div className="field-label">Life stage</div>
              <select className="input" value={lifeStage} onChange={(e) => setLifeStage(e.target.value)}>
                <option>Pre-menopause</option><option>Perimenopause</option><option>Post-menopause</option>
              </select>
            </div>
            <div><div className="field-label">Height ({heightUnit(unit)})</div><input type="number" step="0.1" className="input" value={height} onChange={(e) => setHeight(e.target.value)} /></div>
            <div><div className="field-label">Age</div><input type="number" className="input" value={age} onChange={(e) => setAge(e.target.value)} /></div>
          </div>
        </div>

        <div className="card" style={{ marginBottom: 14 }}>
          <div className="label" style={{ marginBottom: 6 }}>Units</div>
          <p style={{ fontSize: 12, color: 'var(--text-mute)', marginBottom: 12 }}>Switch any time in Settings.</p>
          <div style={{ display: 'flex', gap: 8, maxWidth: 320 }}>
            <PillBtn active={!isImperial(unit)} onClick={() => setUnit('kg')}>Metric (kg/cm/L)</PillBtn>
            <PillBtn active={isImperial(unit)} onClick={() => setUnit('lbs')}>Imperial (lbs/in/fl oz)</PillBtn>
          </div>
        </div>

        <div className="card" style={{ marginBottom: 14 }}>
          <div className="label" style={{ marginBottom: 14 }}>Your goal</div>
          <div className="row row-3">
            <div><div className="field-label">Starting weight ({weightUnit(unit)})</div><input type="number" step="0.1" className="input" value={startWeight} onChange={(e) => setStartWeight(e.target.value)} /></div>
            <div><div className="field-label">Goal weight ({weightUnit(unit)})</div><input type="number" step="0.1" className="input" value={goalWeight} onChange={(e) => setGoalWeight(e.target.value)} /></div>
            <div><div className="field-label">By when</div><input type="date" className="input" value={goalDate} onChange={(e) => setGoalDate(e.target.value)} /></div>
          </div>
        </div>

        <div className="card" style={{ marginBottom: 14 }}>
          <div className="label" style={{ marginBottom: 14 }}>Cycle</div>
          <label style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
            <input type="checkbox" checked={trackCycle} onChange={(e) => setTrackCycle(e.target.checked)} style={{ width: 16, height: 16, accentColor: 'var(--teal)' }} />
            <span style={{ fontSize: 14 }}>Track my cycle</span>
          </label>

          {trackCycle && (
            <>
              {isPeri && (

                  <div className="field-label">Are your cycles regular?</div>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                    <PillBtn active={regularity === 'Regular'} onClick={() => setRegularity('Regular')}>Regular</PillBtn>
                    <PillBtn active={regularity === 'Irregular'} onClick={() => setRegularity('Irregular')}>Irregular</PillBtn>
                    {lifeStage === 'Post-menopause' && (
                      <PillBtn active={regularity === 'None anymore'} onClick={() => setRegularity('None anymore')}>None anymore</PillBtn>
                    )}
                  </div>
                  {regularity === 'Irregular' && (
                    <p style={{ fontSize: 12, color: 'var(--text-mute)', marginTop: 8, fontStyle: 'italic' }}>
                      Log "period started today" when it happens â€” we'll learn your rhythm.
                    </p>
                  )}
                </div>
              )}

              {hasCycles && (
                <>
                  <div className="row row-3" style={{ marginBottom: 10 }}>
                    <div><div className="field-label">Last period start</div><input type="date" className="input" value={lastPeriod} onChange={(e) => setLastPeriod(e.target.value)} /></div>
                    <div>
                      <div className="field-label">Cycle length (days)</div>
                      <input type="number" className="input" value={cycleLength} onChange={(e) => setCycleLength(e.target.value)} disabled={knowLength} />
                    </div>
                    <div><div className="field-label">Period length (days)</div><input type="number" className="input" value={periodLength} onChange={(e) => setPeriodLength(e.target.value)} /></div>
                  </div>
                  <label style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: 'var(--text-mute)' }}>
                    <input type="checkbox" checked={knowLength} onChange={(e) => setKnowLength(e.target.checked)} style={{ width: 14, height: 14, accentColor: 'var(--teal)' }} />
                    I don't know â€” track it for me
                  </label>
                </>
              )}
            </>
          )}
        </div>

        <div className="card" style={{ marginBottom: 22 }}>
          <div className="label" style={{ marginBottom: 14 }}>Daily targets</div>
          <div className="row row-4">
            <div><div className="field-label">Steps</div><input type="number" className="input" value={baselineSteps} onChange={(e) => setBaselineSteps(e.target.value)} /></div>
            <div><div className="field-label">Protein (g)</div><input type="number" className="input" value={proteinTarget} onChange={(e) => setProteinTarget(e.target.value)} /></div>
            <div><div className="field-label">Water ({waterUnit(unit)})</div><input type="number" step="0.1" className="input" value={waterTarget} onChange={(e) => setWaterTarget(e.target.value)} /></div>
            <div><div className="field-label">Sleep (hrs)</div><input type="number" step="0.1" className="input" value={sleepTarget} onChange={(e) => setSleepTarget(e.target.value)} /></div>
          </div>
        </div>

        <div className="card" style={{ marginBottom: 22, background: 'var(--surface-2)', borderLeft: '4px solid var(--teal)' }}>
          <h3 style={{ fontSize: 13, fontWeight: 600, marginBottom: 10, color: 'var(--text-mute)' }}>Before you start</h3>

          </p>
          <p style={{ fontSize: 13, color: 'var(--text-mute)', lineHeight: 1.65, marginBottom: 14 }}>

        </div>

        <button className="btn" style={{ width: '100%', padding: 16, fontSize: 14 }} onClick={save} disabled={saving || !name || !agreed}>
          {saving ? 'Saving...' : 'Start tracking'}
        </button>

  );
}

function Dashboard({ profile, logs, todayLog, setView }) {
  const unit = profile.unit_system || 'kg';
  const todayDate = ymd(today());
  const recent28 = useMemo(() => logs.filter(l => l.date !== todayDate).slice(-28), [logs, todayDate]);
  const baselines = { hrvAvg: avg(recent28, 'hrv'), rhrAvg: avg(recent28, 'rhr') };
  const recovery = calcRecovery(todayLog, baselines);
  const rec = recoveryLabel(recovery);
  const stepTarget = calcStepTarget(profile.baseline_steps, recovery);

  let cycleDay = null;
  let phase = null;
  if (profile.track_cycle && profile.last_period_start) {
    const days = daysBetween(parseYMD(profile.last_period_start), today());
    if (days >= 0) {
      cycleDay = days + 1;  // count from last period, no wrapping
      phase = calcPhase(cycleDay, profile.cycle_length, profile.period_length);
    }
  }
  const guide = phase ? PHASE_GUIDANCE[phase] : null;

  const recent7 = useMemo(() => logs.slice(-7), [logs]);
  const weight7d = avg(recent7, 'weight_kg');
  const startW = profile.start_weight_kg;
  const goalW = profile.goal_weight_kg;
  const change = (weight7d !== null && startW) ? (weight7d - startW) : null;
  const totalChange = (goalW !== null && startW !== null) ? (goalW - startW) : null;
  const goalDate = parseYMD(profile.goal_date);
  const daysLeft = goalDate ? Math.max(0, daysBetween(today(), goalDate)) : null;
  const recDot = rec.tone === 'green' ? 'var(--success)' : rec.tone === 'red' ? 'var(--danger)' : rec.tone === 'yellow' ? 'var(--warn)' : 'var(--text-faint)';

  const focus = todaysFocus({ recovery, phase, todayLog, profile, baselines });
  const progress = progressStatus(logs, profile);
  const changes = whatChanged(logs, profile, todayLog);
  const diagnosis = useMemo(() => diagnoseDay(todayLog, profile, logs), [todayLog, profile, logs]);
  const movers = useMemo(() => whatMovesYourScale(logs, profile), [logs, profile]);
  const story = useMemo(() => narrator(logs, profile, todayLog), [logs, profile, todayLog]);

    }},
  ];
  const extras = [
    { key: 'muscle', label: 'Muscle', val: (l) => l.muscle_kg ? fmt1(toDisplayWeight(l.muscle_kg, unit)) : '' },

  const cols = expanded ? [...essentials, ...extras] : essentials;

  return (

// CYCLE INSIGHTS
// ============================================================
function CycleInsights({ profile, logs }) {
  const unit = profile.unit_system || 'kg';
  let cycleDay = null;
  let phase = null;

  if (profile.track_cycle && profile.last_period_start) {
    const days = daysBetween(parseYMD(profile.last_period_start), today());
    if (days >= 0) cycleDay = days + 1;
    phase = calcPhase(cycleDay, profile.cycle_length, profile.period_length);
  }

  const guide = phase ? PHASE_GUIDANCE[phase] : null;

  // Phase averages (find which phase you do best in)
  const phaseAvgs = useMemo(() => {
    if (!profile.last_period_start) return null;
    const out = { Menstrual: { weights: [], hrv: [] }, Follicular: { weights: [], hrv: [] }, Ovulatory: { weights: [], hrv: [] }, Luteal: { weights: [], hrv: [] } };
    for (const l of logs) {
      const d = daysBetween(parseYMD(profile.last_period_start), parseYMD(l.date));
      if (d < 0) continue;
      const cd = (d % (profile.cycle_length || 28)) + 1;
      const p = calcPhase(cd, profile.cycle_length, profile.period_length);
      if (!p) continue;
      if (l.weight_kg) out[p].weights.push(l.weight_kg);
      if (l.hrv) out[p].hrv.push(l.hrv);
    }
    return out;
  }, [logs, profile]);

  return (
    <div className="fade-in">
      <h1 className="page-title">Cycle insights</h1>
      <p className="page-sub">How your body responds across your cycle.</p>

      {!profile.track_cycle ? (
        <div className="card">
          <p style={{ fontSize: 14, color: 'var(--text-mute)' }}>Cycle tracking is off. Enable it in Settings to see this page.</p>
        </div>
      ) : !cycleDay ? (
        <div className="card">
          <p style={{ fontSize: 14, color: 'var(--text-mute)' }}>Add your last period start date in Settings to unlock cycle insights.</p>
        </div>
      ) : (
        <>
          <div className="card" style={{ marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
              <h2 style={{ fontSize: 22, fontWeight: 600, color: 'var(--teal)' }}>{phase}</h2>
              <span className="pill pill-pink">Day {cycleDay} of {profile.cycle_length || 28}</span>
            </div>
            <CycleBar cycleDay={cycleDay} cycleLen={profile.cycle_length || 28} periodLen={profile.period_length || 5} />
          </div>

          {guide && (
            <div className="row row-3" style={{ marginBottom: 14 }}>
              <div className="card">
                <div className="label" style={{ color: 'var(--pink)' }}>Prioritize</div>
                <p style={{ fontSize: 14, lineHeight: 1.6, marginTop: 8 }}>{guide.prioritize}</p>
              </div>
              <div className="card">
                <div className="label" style={{ color: 'var(--pink)' }}>Train</div>
                <p style={{ fontSize: 14, lineHeight: 1.6, marginTop: 8 }}>{guide.train}</p>
              </div>
              <div className="card">
                <div className="label" style={{ color: 'var(--pink)' }}>Eat</div>
                <p style={{ fontSize: 14, lineHeight: 1.6, marginTop: 8 }}>{guide.eat}</p>
              </div>
            </div>
          )}

          {phaseAvgs && (
            <div className="card" style={{ marginBottom: 14 }}>
              <h3 style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}>How you log across phases</h3>
              <table>
                <thead>
                  <tr><th>Phase</th><th>Days logged</th><th>Avg weight ({weightUnit(unit)})</th><th>Avg HRV (ms)</th></tr>
                </thead>
                <tbody>
                  {Object.entries(phaseAvgs).map(([p, data]) => (
                    <tr key={p}>
                      <td style={{ fontWeight: 500, color: p === phase ? 'var(--teal)' : 'var(--text)' }}>{p}{p === phase ? ' Â· today' : ''}</td>
                      <td>{Math.max(data.weights.length, data.hrv.length)}</td>
                      <td>{data.weights.length ? fmt1(toDisplayWeight(data.weights.reduce((a,b)=>a+b,0)/data.weights.length, unit)) : 'â€“'}</td>
                      <td>{data.hrv.length ? fmt0(data.hrv.reduce((a,b)=>a+b,0)/data.hrv.length) : 'â€“'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <p style={{ fontSize: 12, color: 'var(--text-mute)', marginTop: 12, fontStyle: 'italic' }}>
                Patterns get more accurate after a couple of full cycles.
              </p>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// WEIGHT TRENDS
// ============================================================
function WeightTrends({ profile, logs }) {
  const unit = profile.unit_system || 'kg';

  const last30 = useMemo(() => {
    const out = [];
    for (let i = 29; i >= 0; i--) {
      const d = ymd(new Date(today().getTime() - i * 86400000));
      out.push(logs.find(l => l.date === d) || {});
    }
    return out;
  }, [logs]);

  const weights = last30.map(l => l.weight_kg ? toDisplayWeight(l.weight_kg, unit) : null);
  const bf = last30.map(l => l.body_fat_pct || null);
  const muscle = last30.map(l => l.muscle_kg ? toDisplayWeight(l.muscle_kg, unit) : null);
  const water = last30.map(l => l.body_water_pct || null);
  const calIn30 = last30.map(l => l.calories_in || null);
  const calOut30 = last30.map(l => l.calories_out || null);
  const steps30 = last30.map(l => l.steps || null);

  const w7 = avg(logs.slice(-7), 'weight_kg');
  const w14 = avg(logs.slice(-14), 'weight_kg');
  const w28 = avg(logs.slice(-28), 'weight_kg');
  const startW = profile.start_weight_kg;

  // Pull body-comp insights from the engine, plus build extra body-specific ones
  const allInsights = useMemo(() => generateInsights(logs, profile), [logs, profile]);
  const bodyInsights = useMemo(() => {
    const list = [
      ...allInsights.wins.filter(it => it.scope === 'body'),
      ...allInsights.gaps.filter(it => it.scope === 'body'),
      ...allInsights.stalls.filter(it => it.scope === 'body'),
      ...allInsights.cycle.filter(it => it.scope === 'body'),
    ];

    // Extra analysis only on Weight trends page
    if (logs.length >= 3) {
      // Body weight trajectory since first log
      const wLogs = logs.filter(l => l.weight_kg);
      if (wLogs.length >= 3) {
        const wStart = wLogs[0].weight_kg;
        const wNow = wLogs[wLogs.length-1].weight_kg;
        const wDiff = wNow - wStart;
        if (Math.abs(wDiff) >= 0.15) {
          list.push({
            headline: wDiff < 0
              ? `Weight down ${fmt1(toDisplayWeight(Math.abs(wDiff), unit))} ${weightUnit(unit)} since first log`
              : `Weight up ${fmt1(toDisplayWeight(wDiff, unit))} ${weightUnit(unit)} since first log`,
            detail: wDiff < 0
              ? `Scale is moving. Some of this is water (especially in first 2 weeks). Keep watching the 7-day average.`
              : `Could be water (luteal, sodium, glycogen) or genuine gain. Check the body-fat trend below to know.`,
            tone: wDiff < 0 ? 'good' : 'neutral',
          });
        } else {
          list.push({
            headline: `Weight stable since first log`,
            detail: `Within Â±${fmt1(toDisplayWeight(0.15, unit))} ${weightUnit(unit)}. Could mean stable, could mean too early to tell. Need 2+ weeks for a real signal.`,
            tone: 'neutral',
          });
        }
      }
    }

    if (logs.length >= 7) {
      // 7-day vs prior 7-day weight trend
      const last7 = logs.slice(-7).filter(l => l.weight_kg);
      const prior7 = logs.slice(-14, -7).filter(l => l.weight_kg);
      if (last7.length >= 3 && prior7.length >= 3) {
        const a = last7.reduce((s,l)=>s+l.weight_kg,0)/last7.length;
        const b = prior7.reduce((s,l)=>s+l.weight_kg,0)/prior7.length;
        const diff = a - b;
        if (Math.abs(diff) >= 0.15) {
          list.push({
            headline: diff < 0 ? `7-day avg is down ${fmt1(toDisplayWeight(Math.abs(diff), unit))} ${weightUnit(unit)}` : `7-day avg is up ${fmt1(toDisplayWeight(diff, unit))} ${weightUnit(unit)}`,
            detail: diff < 0
              ? `Your trend line is moving in the right direction. Daily weight will bounce â€” keep watching the average.`
              : `Trend line is climbing. Check what changed last week: sleep, alcohol, calories out.`,
            tone: diff < 0 ? 'good' : 'warn',
          });
        }
      }

      // Body fat trajectory
      const bfLogs = logs.filter(l => l.body_fat_pct);
      if (bfLogs.length >= 5) {
        const bfStart = bfLogs[0].body_fat_pct;
        const bfNow = bfLogs[bfLogs.length-1].body_fat_pct;
        const bfDiff = bfNow - bfStart;
        if (Math.abs(bfDiff) >= 0.3) {
          list.push({
            headline: bfDiff < 0 ? `Body fat down ${fmt1(Math.abs(bfDiff))}% since first log` : `Body fat up ${fmt1(bfDiff)}% since first log`,
            detail: bfDiff < 0
              ? `Body fat is the real signal â€” daily scale weight is mostly water. Keep going.`
              : `Body fat trending up. Check protein, training volume, and sleep â€” those are your levers.`,
            tone: bfDiff < 0 ? 'good' : 'warn',
          });
        }
      }

      // Muscle trajectory
      const mLogs = logs.filter(l => l.muscle_kg);
      if (mLogs.length >= 5) {
        const mStart = mLogs[0].muscle_kg;
        const mNow = mLogs[mLogs.length-1].muscle_kg;
        const mDiff = mNow - mStart;
        if (Math.abs(mDiff) >= 0.2) {
          list.push({
            headline: mDiff >= 0 ? `Muscle up ${fmt1(toDisplayWeight(mDiff, unit))} ${weightUnit(unit)} since first log` : `Muscle down ${fmt1(toDisplayWeight(Math.abs(mDiff), unit))} ${weightUnit(unit)} since first log`,
            detail: mDiff >= 0
              ? `Adding muscle in peri is hard. You're doing the work that protects metabolism long-term.`
              : `In peri, muscle loss accelerates fat regain. Increase protein, add 2-3 strength sessions/week.`,
            tone: mDiff >= 0 ? 'good' : 'warn',
          });
        }
      }

      // Body water pattern â€” explains scale spikes
      const bwLogs = logs.filter(l => l.body_water_pct).slice(-14);
      if (bwLogs.length >= 5) {
        const bwRange = Math.max(...bwLogs.map(l => l.body_water_pct)) - Math.min(...bwLogs.map(l => l.body_water_pct));
        if (bwRange >= 2) {
          list.push({
            headline: `Body water swings ${fmt1(bwRange)}% across days`,
            detail: `That's normal â€” it's why daily weight fluctuates. High carb days, salt, alcohol, and luteal phase all push water up. Don't chase it.`,
            tone: 'neutral',
          });
        }
      }
    }

    return list;
  }, [allInsights, logs, profile, unit]);

  return (
    <div className="fade-in">
      <h1 className="page-title">Weight trends</h1>
      <p className="page-sub">Body composition â€” what the scale won't tell you alone.</p>

      {/* BODY-COMP INSIGHTS at the top */}
      {bodyInsights.length === 0 ? (
        <div className="card-teal" style={{ marginBottom: 14 }}>
          <div className="label" style={{ color: 'rgba(255,255,255,0.7)', marginBottom: 10 }}>Body composition insights</div>
          <p style={{ fontSize: 14, opacity: 0.9, lineHeight: 1.6 }}>
            {logs.length < 5
              ? `Log weight and body fat ${5 - logs.length > 0 ? `for ${5 - logs.length} more day${5 - logs.length === 1 ? '' : 's'} ` : ''}to start seeing your real trend.`
              : 'Keep logging weight, body fat, and muscle. Patterns appear once we have ~7 days of complete data.'}
          </p>
        </div>
      ) : (
        <div className="card-teal" style={{ marginBottom: 14 }}>
          <div className="label" style={{ color: 'rgba(255,255,255,0.7)', marginBottom: 12 }}>Body composition insights</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            {bodyInsights.map((it, i) => {
              const dotColor = it.tone === 'good' ? 'var(--gold)' : it.tone === 'warn' ? 'var(--pink)' : 'rgba(255,255,255,0.5)';
              return (
                <div key={i} style={{ background: 'rgba(255,255,255,0.08)', borderRadius: 10, padding: 14, display: 'flex', gap: 12, alignItems: 'flex-start' }}>
                  <span style={{ width: 6, height: 6, borderRadius: '50%', background: dotColor, marginTop: 8, flexShrink: 0 }} />
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 4 }}>{it.headline}</div>
                    <div style={{ fontSize: 13, opacity: 0.9, lineHeight: 1.55 }}>{it.detail}</div>
                  </div>
                </div>
              );

function RecoveryView({ profile, logs }) {

    const out = [];
    for (let i = 13; i >= 0; i--) {
      const d = ymd(new Date(today().getTime() - i * 86400000));
      out.push(logs.find(l => l.date === d) || {});
    }
    return out;
  }, [logs]);
  const hrv14 = last14.map(l => l.hrv || null);
  const rhr14 = last14.map(l => l.rhr || null);
  const sleep14 = last14.map(l => l.sleep_hours || null);
  const steps14 = last14.map(l => l.steps || null);
  const calIn14 = last14.map(l => l.calories_in || null);
  const calOut14 = last14.map(l => l.calories_out || null);

  // Use the central insights engine for all 4 categories
  const insights = useMemo(() => generateInsights(logs, profile), [logs, profile]);

  const calIn7 = avg(logs.slice(-7), 'calories_in');
  const calOut7 = avg(logs.slice(-7), 'calories_out');

function SettingsView({ profile, onUpdate }) {
  const [name, setName] = useState(profile.name || '');
  const [unit, setUnit] = useState(profile.unit_system || 'kg');
  const [lifeStage, setLifeStage] = useState(profile.life_stage || 'Perimenopause');
  const [height, setHeight] = useState(profile.height_cm ? (toDisplayHeight(profile.height_cm, profile.unit_system) || '').toString().slice(0, 6) : '');
  const [age, setAge] = useState(profile.age || '');
  const [startWeight, setStartWeight] = useState(profile.start_weight_kg ? fmt1(toDisplayWeight(profile.start_weight_kg, profile.unit_system)) : '');
  const [goalWeight, setGoalWeight] = useState(profile.goal_weight_kg ? fmt1(toDisplayWeight(profile.goal_weight_kg, profile.unit_system)) : '');
  const [goalDate, setGoalDate] = useState(profile.goal_date || '');
  const [trackCycle, setTrackCycle] = useState(!!profile.track_cycle);
  const [regularity, setRegularity] = useState(profile.cycle_regularity || 'Regular');
  const [knowLength, setKnowLength] = useState(!!profile.cycle_length_auto);
  const [lastPeriod, setLastPeriod] = useState(profile.last_period_start || '');
  const [cycleLength, setCycleLength] = useState(profile.cycle_length || 28);
  const [periodLength, setPeriodLength] = useState(profile.period_length || 5);
  const [baselineSteps, setBaselineSteps] = useState(profile.baseline_steps || 8000);
  const [proteinTarget, setProteinTarget] = useState(profile.protein_target || 110);
  const [waterTarget, setWaterTarget] = useState(profile.water_target ? fmt1(toDisplayWater(profile.water_target, profile.unit_system)) : (isImperial(profile.unit_system) ? '84' : '2.5'));
  const [sleepTarget, setSleepTarget] = useState(profile.sleep_target || 7.5);
  const [dataShare, setDataShare] = useState(!!profile.data_sharing_consent);
  const [saving, setSaving] = useState(false);
  const [savedAt, setSavedAt] = useState(null);

  const isPeri = lifeStage === 'Perimenopause' || lifeStage === 'Post-menopause';
  const hasCycles = !(regularity === 'None anymore');

  async function save() {
    setSaving(true);
    const patch = {
      name, unit_system: unit, life_stage: lifeStage,
      height_cm: fromDisplayHeight(height, unit),
      age: age ? Number(age) : null,
      start_weight_kg: fromDisplayWeight(startWeight, unit),
      goal_weight_kg: fromDisplayWeight(goalWeight, unit),
      goal_date: goalDate || null,
      track_cycle: trackCycle && hasCycles,
      cycle_regularity: trackCycle ? regularity : null,
      cycle_length_auto: knowLength,
      last_period_start: lastPeriod || null,
      cycle_length: Number(cycleLength),
      period_length: Number(periodLength),
      baseline_steps: Number(baselineSteps),
      protein_target: Number(proteinTarget),
      water_target: fromDisplayWater(waterTarget, unit),
      sleep_target: Number(sleepTarget),
      data_sharing_consent: dataShare,
      // only stamp the timestamp on first opt-in
      data_sharing_consent_at: dataShare && !profile.data_sharing_consent ? new Date().toISOString() : profile.data_sharing_consent_at,
    };
    const { error } = await db.from('profiles').update(patch).eq('user_id', profile.user_id);
    setSaving(false);
    if (error) { alert(error.message); return; }
    setSavedAt(new Date());
    onUpdate();
  }

  return (
    <div className="fade-in">
      <h1 className="page-title">Settings</h1>
      <p className="page-sub">Update once. The dashboard adapts.</p>

      <div className="card" style={{ marginBottom: 14 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 14, color: 'var(--teal)' }}>About you</h3>
        <div className="row row-2">
          <div><div className="field-label">Name</div><input className="input" value={name} onChange={(e) => setName(e.target.value)} /></div>
          <div><div className="field-label">Life stage</div>
            <select className="input" value={lifeStage} onChange={(e) => setLifeStage(e.target.value)}>
              <option>Pre-menopause</option><option>Perimenopause</option><option>Post-menopause</option>
            </select>
          </div>
          <div><div className="field-label">Height ({heightUnit(unit)})</div><input type="number" step="0.1" className="input" value={height} onChange={(e) => setHeight(e.target.value)} /></div>
          <div><div className="field-label">Age</div><input type="number" className="input" value={age} onChange={(e) => setAge(e.target.value)} /></div>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 14 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 6, color: 'var(--teal)' }}>Units</h3>
        <p style={{ fontSize: 12, color: 'var(--text-mute)', marginBottom: 12 }}>Switch between metric (kg, cm, L) and imperial (lbs, in, fl oz). Affects everywhere.</p>
        <div style={{ display: 'flex', gap: 8, maxWidth: 320 }}>
          <PillBtn active={!isImperial(unit)} onClick={() => setUnit('kg')}>Metric</PillBtn>
          <PillBtn active={isImperial(unit)} onClick={() => setUnit('lbs')}>Imperial</PillBtn>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 14 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 14, color: 'var(--teal)' }}>Goal</h3>

          <div><div className="field-label">Start weight ({weightUnit(unit)})</div><input type="number" step="0.1" className="input" value={startWeight} onChange={(e) => setStartWeight(e.target.value)} /></div>

      <div className="card" style={{ marginBottom: 14 }}>
        <h3 style={{ fontSize: 14, fontWeight: 600, marginBottom: 14, color: 'var(--teal)' }}>Cycle</h3>
        <label style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>

        <div className="row row-4">

    const days = scope === 'week' ? 7 : 30;
    const cutoff = ymd(new Date(today().getTime() - days * 86400000));
    return logs.filter(l => l.date >= cutoff);
  }, [logs, scope]);

  const label = scope === 'week' ? 'this week' : scope === 'month' ? 'this month' : 'overall';
  const diagnosis = useMemo(() => diagnoseRange(scopedLogs, profile, label), [scopedLogs, profile, label]);

  const wLogs = scopedLogs.filter(l => l.weight_kg);

// Fetch all health log data (scans, s, meds, labs) for a date range
async function fetchHealthLog(dateFrom, dateTo) {
  const [scans, symptoms, meds, labs] = await Promise.all([
    db.from('body_scans')
      .select('*')
      .gte('scan_date', dateFrom)
      .lte('scan_date', dateTo)
      .order('scan_date', { ascending: false }),
    db.from('symptoms')
      .select('*')
      .gte('date', dateFrom)
      .lte('date', dateTo)
      .order('date', { ascending: false }),
    db.from('medications')
      .select('*')
      .order('start_date', { ascending: false }),
    db.from('labs')
      .select('*')
      .gte('test_date', dateFrom)
      .lte('test_date', dateTo)
      .order('test_date', { ascending: false }),
  ]);

  if (scans.error) throw scans.error;
  if (symptoms.error) throw symptoms.error;
  if (meds.error) throw meds.error;
  if (labs.error) throw labs.error;

  return {
    scans: scans.data || [],
    symptoms: symptoms.data || [],
    meds: meds.data || [],
    labs: labs.data || [],
  };
}
// Draw a simple line chart on a jsPDF doc â€” returns the y position after drawing
function drawPdfChart(doc, x, y, w, h, series, title, dates) {
  doc.setFontSize(9); doc.setTextColor(40, 60, 70); doc.setFont(undefined, 'bold');
  doc.text(title, x, y - 3);
  doc.setFont(undefined, 'normal');
  const leftSeries = series.filter(s => s.axis === 'left');
  const rightSeries = series.filter(s => s.axis === 'right');
  const leftAll = leftSeries.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  const rightAll = rightSeries.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
  if (!leftAll.length && !rightAll.length) {
    doc.setFontSize(8); doc.setTextColor(140);
    doc.text('No data for this period', x + 4, y + h/2);
    return y + h + 10;
  }
  const lMin = leftAll.length ? Math.min(...leftAll) : 0;
  const lMax = leftAll.length ? Math.max(...leftAll) : 1;
  const lRange = (lMax - lMin) || 1;
  const rMin = rightAll.length ? Math.min(...rightAll) : 0;
  const rMax = rightAll.length ? Math.max(...rightAll) : 1;
  const rRange = (rMax - rMin) || 1;
  const n = series[0]?.values.length || 0;
  // Frame + gridlines
  doc.setDrawColor(220); doc.setLineWidth(0.2);
  doc.rect(x, y, w, h);
  for (let i = 1; i < 4; i++) { const gy = y + (h/4) * i; doc.line(x, gy, x + w, gy); }
  // Plot each series
  series.forEach(s => {
    const min = s.axis === 'left' ? lMin : rMin;
    const range = s.axis === 'left' ? lRange : rRange;
    const pts = s.values.map((v, i) => {
      if (v === null || v === undefined) return null;
      return { px: x + (i / Math.max(n-1, 1)) * w, py: y + h - ((v - min) / range) * h };
    }).filter(Boolean);
    if (!pts.length) return;
    const rgb = hexToRgb(s.color);
    doc.setDrawColor(rgb.r, rgb.g, rgb.b);
    doc.setFillColor(rgb.r, rgb.g, rgb.b);
    doc.setLineWidth(0.5);
    for (let i = 1; i < pts.length; i++) doc.line(pts[i-1].px, pts[i-1].py, pts[i].px, pts[i].py);
    pts.forEach(p => doc.circle(p.px, p.py, 0.5, 'F'));
  });
  // Axis labels
  doc.setFontSize(6); doc.setTextColor(130);
  if (leftAll.length) {
    const lc = hexToRgb(leftSeries[0].color);
    doc.setTextColor(lc.r, lc.g, lc.b);
    doc.text(lMax.toFixed(1), x - 0.5, y + 1.5, { align: 'right' });
    doc.text(lMin.toFixed(1), x - 0.5, y + h, { align: 'right' });
  }
  if (rightAll.length) {
    const rc = hexToRgb(rightSeries[0].color);
    doc.setTextColor(rc.r, rc.g, rc.b);
    doc.text(rMax.toFixed(1), x + w + 0.5, y + 1.5);
    doc.text(rMin.toFixed(1), x + w + 0.5, y + h);
  }
  // Date labels (first/middle/last)
  if (dates && dates.length >= 2) {
    doc.setTextColor(140); doc.setFontSize(6);
    doc.text(dates[0], x, y + h + 4);
    if (dates.length > 4) doc.text(dates[Math.floor(dates.length/2)], x + w/2, y + h + 4, { align: 'center' });
    doc.text(dates[dates.length-1], x + w, y + h + 4, { align: 'right' });
  }
  // Legend
  doc.setFontSize(7); doc.setTextColor(80);
  let lx = x;
  series.forEach(s => {
    const rgb = hexToRgb(s.color);
    doc.setFillColor(rgb.r, rgb.g, rgb.b);
    doc.rect(lx, y + h + 7, 3, 1.5, 'F');
    doc.text(s.label, lx + 4, y + h + 8.5);
    lx += doc.getTextWidth(s.label) + 12;
  });
  return y + h + 14;
}

async function exportPDF(logs, profile, dateFrom, dateTo) {

  const unit = profile.unit_system || 'kg';
  const pageW = 210; const margin = 12;
  let y = margin;
  const filtered = logs.filter(l => l.date >= dateFrom && l.date <= dateTo).sort((a,b) => a.date.localeCompare(b.date));
  const health = await fetchHealthLog(dateFrom, dateTo);

  // ---------- HEADER ----------
  doc.setFontSize(18); doc.setTextColor(0, 104, 122); doc.setFont(undefined, 'bold');
  doc.text('Train With Me — Health Report', margin, y);
  y += 6;
  doc.setFontSize(10); doc.setTextColor(80); doc.setFont(undefined, 'normal');
  doc.text(`${profile.name || ''} · Period: ${dateFrom} to ${dateTo} · Generated ${ymd(today())}`, margin, y);
  y += 8;

  // ---------- HEADLINE STATS ----------
  const wLogs = filtered.filter(l => l.weight_kg);
  const bfLogs = filtered.filter(l => l.body_fat_pct);
  const mLogs = filtered.filter(l => l.muscle_kg);
  const wChange = wLogs.length >= 2 ? wLogs[wLogs.length-1].weight_kg - wLogs[0].weight_kg : null;
  const bfChange = bfLogs.length >= 2 ? bfLogs[bfLogs.length-1].body_fat_pct - bfLogs[0].body_fat_pct : null;
  const mChange = mLogs.length >= 2 ? mLogs[mLogs.length-1].muscle_kg - mLogs[0].muscle_kg : null;
  const avgSleep = avg(filtered, 'sleep_hours');
  const avgSteps = avg(filtered, 'steps');
  const avgProtein = avg(filtered, 'protein_g');
  const avgCalIn = avg(filtered, 'calories_in');
  const avgCalOut = avg(filtered, 'calories_out');
  const totalSessions = filtered.reduce((s,l) => s + ((l.sessions||[]).length), 0);

  doc.setFontSize(11); doc.setTextColor(0, 104, 122); doc.setFont(undefined, 'bold');
  doc.text('Summary', margin, y); y += 5;
  doc.setFont(undefined, 'normal'); doc.setFontSize(9); doc.setTextColor(40);
  const stats = [
    ['Days logged', String(filtered.length)],
    ['Weight change', wChange === null ? '—' : `${wChange > 0 ? '+' : ''}${fmt1(toDisplayWeight(wChange, unit))} ${weightUnit(unit)}`],

    ['Avg sleep', avgSleep ? fmt1(avgSleep) + 'h' : '—'],
    ['Avg steps', avgSteps ? fmt0(avgSteps) : '—'],
    ['Avg protein', avgProtein ? fmt0(avgProtein) + 'g' : '—'],
    ['Avg cal in', avgCalIn ? fmt0(avgCalIn) : '—'],
    ['Avg cal out', avgCalOut ? fmt0(avgCalOut) : '—'],
    ['Sessions', String(totalSessions)],
  ];
  doc.autoTable({
    startY: y, head: [], body: stats,
    theme: 'plain', styles: { fontSize: 9, cellPadding: 1.5 },
    columnStyles: { 0: { fontStyle: 'bold', cellWidth: 35, textColor: [80,80,80] } },
    margin: { left: margin, right: margin },
  });
  y = doc.lastAutoTable.finalY + 8;

  // ---------- CHARTS ----------
  const dates = filtered.map(l => l.date);
  const wVals = filtered.map(l => l.weight_kg ? toDisplayWeight(l.weight_kg, unit) : null);
  const bfVals = filtered.map(l => l.body_fat_pct || null);
  const mVals = filtered.map(l => l.muscle_kg ? toDisplayWeight(l.muscle_kg, unit) : null);

  const rhrVals = filtered.map(l => l.rhr || null);

  const proteinVals = filtered.map(l => l.protein_g || null);

  // BODY COMPOSITION

  doc.text('Body composition', margin, y); y += 4;
  doc.setFont(undefined, 'normal');
  y = drawPdfChart(doc, margin, y + 5, pageW - margin*2, 35,

      { values: calOutVals, color: '#00687a', axis: 'left', label: 'Calories out' },
      { values: proteinVals, color: '#cfff04', axis: 'right', label: 'Protein (g)' },

  doc.text('Training & activity', margin, y); y += 4;

  y = drawPdfChart(doc, margin, y + 5, pageW - margin*2, 35,
    [{ values: stepVals, color: '#00687a', axis: 'left', label: 'Daily steps' }], '', dates);
  y += 4;

  // ---------- ANALYSIS ----------
  if (y > 230) { doc.addPage(); y = margin; }
  doc.setFontSize(11); doc.setTextColor(0, 104, 122); doc.setFont(undefined, 'bold');
  doc.text('Analysis', margin, y); y += 5;
  const diagnosis = diagnoseRange(filtered, profile, `in this period`);
  if (diagnosis.length === 0) {
    doc.setFontSize(9); doc.setTextColor(120); doc.setFont(undefined, 'italic');
    doc.text('Not enough data to surface patterns for this period.', margin, y); y += 6;
  } else {
    doc.autoTable({
      startY: y,
      head: [['Type', 'Finding', 'Detail']],
      body: diagnosis.map(d => [d.tone === 'good' ? '✓' : d.tone === 'warn' ? '!' : '·', d.headline, d.detail]),
      theme: 'striped', styles: { fontSize: 8, cellPadding: 2, valign: 'top' },
      headStyles: { fillColor: [0, 104, 122], textColor: 255 },
      columnStyles: { 0: { cellWidth: 8, halign: 'center' }, 1: { cellWidth: 60, fontStyle: 'bold' } },

function ExportSection({ profile, logs }) {
  const [open, setOpen] = useState(false);

  const [customTo, setCustomTo] = useState(ymd(today()));
  const [busy, setBusy] = useState(false);

  const getRange = () => {
    if (range === '7d') return { from: ymd(new Date(today().getTime() - 6 * 86400000)), to: ymd(today()) };
    if (range === '30d') return { from: ymd(new Date(today().getTime() - 29 * 86400000)), to: ymd(today()) };
    return { from: customFrom, to: customTo };
  };

  async function doPDF() {
    setBusy(true);

function GoalProgressBar({ label, current, target, unit = '', higherIsBetter = false }) {
  if (current == null || target == null || !isFinite(current) || !isFinite(target)) return null;

  const rawPct = (current / target) * 100;
  const pct = Math.max(0, Math.min(130, Math.round(rawPct))); // allow slight overshoot for overdoing it

  const met = higherIsBetter ? current >= target : current <= target;
  const color = met
    ? 'var(--success)'
    : (rawPct > 115 && !higherIsBetter ? 'var(--error)' : 'var(--teal)');

  return (
    <div style={{ marginBottom: 10 }}>
      <div
        style={{
          display: 'flex',
          justifyContent: 'space-between',
          fontSize: 12,
          marginBottom: 4,

        <span style={{ color: met ? 'var(--success)' : 'var(--text-mute)' }}>
          {fmt1(current)} / {fmt1(target)} {unit} {met ? 'âœ“' : ''}

          background: 'var(--border)',
          overflow: 'hidden',

        <div
          style={{
            height: '100%',
            width: pct + '%',
            borderRadius: 999,
            background: color,
            transition: 'width 0.4s ease',
          }}
        />
      </div>
    </div>
  );

function ScanMetric({ label, value, prev, unit = '', convert, higherBetter, lowerBetter }) {
  if (value === null || value === undefined) return null;
  const displayVal = convert ? convert(value) : value;
  const displayPrev = prev !== null && prev !== undefined ? (convert ? convert(prev) : prev) : null;
  const diff = displayPrev !== null ? displayVal - displayPrev : null;
  let diffColor = 'var(--text-mute)';
  if (diff !== null && Math.abs(diff) > 0.05) {
    if (higherBetter) diffColor = diff > 0 ? 'var(--success)' : 'var(--pink)';
    else if (lowerBetter) diffColor = diff < 0 ? 'var(--success)' : 'var(--pink)';
  }
  return (
    <div>
      <div className="label" style={{ marginBottom: 4 }}>{label}</div>
      <div style={{ fontSize: 16, fontWeight: 600 }}>{fmt1(displayVal)} {unit}</div>
      {diff !== null && Math.abs(diff) > 0.05 && (
        <div style={{ fontSize: 11, color: diffColor, marginTop: 3 }}>
          {diff > 0 ? '+' : ''}{fmt1(diff)} from last
        </div>
      )}
    </div>
  );
}

  const [w, setW] = useState(scan?.weight_kg != null ? fmt1(toDisplayWeight(scan.weight_kg, unit)) : '');
  const [bf, setBf] = useState(scan?.body_fat_pct ?? '');
  const [lean, setLean] = useState(scan?.lean_mass_kg != null ? fmt1(toDisplayWeight(scan.lean_mass_kg, unit)) : '');
  const [fat, setFat] = useState(scan?.fat_mass_kg != null ? fmt1(toDisplayWeight(scan.fat_mass_kg, unit)) : '');
  const [visc, setVisc] = useState(scan?.visceral_fat ?? '');
  const [bone, setBone] = useState(scan?.bone_density ?? '');
  const [ecwTbw, setEcwTbw] = useState(scan?.ecw_tbw ?? '');
  const [android, setAndroid] = useState(scan?.android_fat_pct ?? '');
  const [gynoid, setGynoid] = useState(scan?.gynoid_fat_pct ?? '');
  const [notes, setNotes] = useState(scan?.notes || '');
  const [saving, setSaving] = useState(false);

  const isDexa = type === 'DEXA';
  const isInBody = type === 'InBody';

  async function save() {
    setSaving(true);
    const { data: { user } } = await db.auth.getUser();
    const row = {
      id: scan?.id,
      user_id: user.id,
      scan_date: date,
      scan_type: type,
      weight_kg: w ? fromDisplayWeight(Number(w), unit) : null,
      body_fat_pct: bf ? Number(bf) : null,
      lean_mass_kg: lean ? fromDisplayWeight(Number(lean), unit) : null,
      fat_mass_kg: fat ? fromDisplayWeight(Number(fat), unit) : null,
      visceral_fat: visc ? Number(visc) : null,
      bone_density: isDexa && bone ? Number(bone) : null,
      ecw_tbw: isInBody && ecwTbw ? Number(ecwTbw) : null,
      android_fat_pct: isDexa && android ? Number(android) : null,
      gynoid_fat_pct: isDexa && gynoid ? Number(gynoid) : null,
      notes: notes || null,
    };
    const { error } = await db.from('body_scans').upsert(row);
    setSaving(false);
    if (error) { alert(error.message); return; }
    onSave();
  }

  return (
    <div style={{ background: 'var(--surface-2)', borderRadius: 10, padding: 16, marginTop: 12, border: '1px solid var(--border)' }}>
      <div className="row row-3" style={{ marginBottom: 12 }}>
        <div><div className="field-label">Date</div><input type="date" className="input" value={date} onChange={e => setDate(e.target.value)} /></div>
        <div><div className="field-label">Scan type</div>
          <select className="input" value={type} onChange={e => setType(e.target.value)}>
            <option>InBody</option><option>DEXA</option><option>Hume</option><option>Other</option>
          </select>
        </div>
      </div>
      <div className="row row-4" style={{ marginBottom: 12 }}>
        <div><div className="field-label">Weight ({weightUnit(unit)})</div><input type="number" step="0.1" className="input" value={w} onChange={e => setW(e.target.value)} /></div>
        <div><div className="field-label">Body fat %</div><input type="number" step="0.1" className="input" value={bf} onChange={e => setBf(e.target.value)} /></div>
        <div><div className="field-label">Lean mass ({weightUnit(unit)})</div><input type="number" step="0.1" className="input" value={lean} onChange={e => setLean(e.target.value)} /></div>
        <div><div className="field-label">Fat mass ({weightUnit(unit)})</div><input type="number" step="0.1" className="input" value={fat} onChange={e => setFat(e.target.value)} /></div>
        <div><div className="field-label">Visceral fat</div><input type="number" step="0.1" className="input" value={visc} onChange={e => setVisc(e.target.value)} /></div>
        {isDexa && <div><div className="field-label">Bone density</div><input type="number" step="0.001" className="input" value={bone} onChange={e => setBone(e.target.value)} /></div>}
        {isInBody && <div><div className="field-label">ECW/TBW %</div><input type="number" step="0.1" className="input" value={ecwTbw} onChange={e => setEcwTbw(e.target.value)} /></div>}
        {isDexa && <div><div className="field-label">Android fat %</div><input type="number" step="0.1" className="input" value={android} onChange={e => setAndroid(e.target.value)} /></div>}
        {isDexa && <div><div className="field-label">Gynoid fat %</div><input type="number" step="0.1" className="input" value={gynoid} onChange={e => setGynoid(e.target.value)} /></div>}
      </div>
      <div style={{ marginBottom: 12 }}><div className="field-label">Notes</div><textarea rows="2" className="input" value={notes} onChange={e => setNotes(e.target.value)} /></div>
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
        <button onClick={onCancel} className="btn-ghost" style={{ padding: '8px 16px', fontSize: 12 }}>Cancel</button>
        <button onClick={save} disabled={saving} className="btn" style={{ padding: '8px 16px', fontSize: 12 }}>{saving ? 'Saving…' : editing ? 'Update' : 'Save scan'}</button>
      </div>
    </div>
  );
}

function LabsSection({ labs, onChange }) {
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ test_date: ymd(today()), marker: '', value: '', unit: '', reference_low: '', reference_high: '', notes: '' });
  const [saving, setSaving] = useState(false);

  const COMMON_MARKERS = ['Ferritin', 'Hemoglobin', 'TSH', 'Free T4', 'Free T3', 'Estradiol', 'FSH', 'LH', 'Progesterone', 'Testosterone (total)', 'DHEA-S', 'Cortisol (AM)', 'Vitamin D', 'B12', 'Folate', 'HbA1c', 'Fasting glucose', 'Insulin', 'CRP', 'Cholesterol (total)', 'LDL', 'HDL', 'Triglycerides'];

  async function save() {
    if (!form.marker || !form.value) { alert('Marker and value are required'); return; }
    setSaving(true);
    const { data: { user } } = await db.auth.getUser();
    const { error } = await db.from('labs').insert({
      ...form, user_id: user.id,
      value: Number(form.value),
      reference_low: form.reference_low ? Number(form.reference_low) : null,
      reference_high: form.reference_high ? Number(form.reference_high) : null,
    });
    setSaving(false);
    if (error) { alert(error.message); return; }
    setAdding(false);
    setForm({ test_date: ymd(today()), marker: '', value: '', unit: '', reference_low: '', reference_high: '', notes: '' });
    onChange();
  }

  // Group labs by marker for trend view
  const byMarker = {};
  for (const l of labs) {
    if (!byMarker[l.marker]) byMarker[l.marker] = [];
    byMarker[l.marker].push(l);
  }

  return (
    <>
      <div className="card" style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
          <div>
            <h3 style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Lab results</h3>
            <p style={{ fontSize: 13, color: 'var(--text-mute)' }}>Blood panels, hormone levels, anything from your GP or specialist.</p>
          </div>
          {!adding && <button onClick={() => setAdding(true)} className="btn" style={{ padding: '8px 16px', fontSize: 13 }}>+ Add result</button>}
        </div>
        {adding && (
          <div style={{ background: 'var(--surface-2)', borderRadius: 10, padding: 14, marginTop: 10, border: '1px solid var(--border)' }}>
            <div className="row row-3" style={{ marginBottom: 10 }}>
              <div><div className="field-label">Test date</div><input type="date" className="input" value={form.test_date} onChange={e => setForm(f => ({...f, test_date: e.target.value}))} /></div>
              <div><div className="field-label">Marker</div>
                <input className="input" list="markers" value={form.marker} onChange={e => setForm(f => ({...f, marker: e.target.value}))} placeholder="e.g. Ferritin" />
                <datalist id="markers">{COMMON_MARKERS.map(m => <option key={m} value={m} />)}</datalist>
              </div>
              <div><div className="field-label">Value</div><input type="number" step="any" className="input" value={form.value} onChange={e => setForm(f => ({...f, value: e.target.value}))} /></div>
              <div><div className="field-label">Unit</div><input className="input" value={form.unit} onChange={e => setForm(f => ({...f, unit: e.target.value}))} placeholder="e.g. µg/L" /></div>
              <div><div className="field-label">Reference low</div><input type="number" step="any" className="input" value={form.reference_low} onChange={e => setForm(f => ({...f, reference_low: e.target.value}))} /></div>
              <div><div className="field-label">Reference high</div><input type="number" step="any" className="input" value={form.reference_high} onChange={e => setForm(f => ({...f, reference_high: e.target.value}))} /></div>
            </div>
            <div style={{ marginBottom: 10 }}><div className="field-label">Notes</div><textarea rows="2" className="input" value={form.notes} onChange={e => setForm(f => ({...f, notes: e.target.value}))} /></div>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button onClick={() => setAdding(false)} className="btn-ghost" style={{ padding: '8px 16px', fontSize: 12 }}>Cancel</button>
              <button onClick={save} disabled={saving} className="btn" style={{ padding: '8px 16px', fontSize: 12 }}>{saving ? 'Saving…' : 'Save'}</button>
            </div>
          </div>
        )}
      </div>
      {labs.length === 0 && !adding && <div className="card"><p style={{ fontSize: 13, color: 'var(--text-mute)' }}>No lab results yet.</p></div>}
      {Object.entries(byMarker).map(([marker, entries]) => {
        const latest = entries[0];
        const prev = entries[1];
        const inRange = latest.reference_low != null && latest.reference_high != null
          ? latest.value >= latest.reference_low && latest.value <= latest.reference_high
          : null;
        return (
          <div key={marker} className="card" style={{ marginBottom: 8 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
              <span style={{ fontWeight: 600, fontSize: 14 }}>{marker}</span>
              <button onClick={async () => { if (confirm('Delete most recent entry?')) { await db.from('labs').delete().eq('id', latest.id); onChange(); } }} style={{ background: 'transparent', border: 'none', color: 'var(--text-faint)', fontSize: 12, cursor: 'pointer' }}>Delete</button>
            </div>
            <div style={{ display: 'flex', gap: 16, alignItems: 'baseline', flexWrap: 'wrap' }}>
              <span style={{ fontSize: 18, fontWeight: 700, color: inRange === false ? 'var(--danger)' : inRange === true ? 'var(--success)' : 'var(--text)' }}>
                {latest.value} {latest.unit}
              </span>
              {latest.reference_low != null && latest.reference_high != null && (
                <span style={{ fontSize: 12, color: 'var(--text-mute)' }}>ref: {latest.reference_low}–{latest.reference_high}</span>
              )}
              {prev && <span style={{ fontSize: 12, color: 'var(--text-mute)' }}>prev: {prev.value} ({prev.test_date})</span>}
              <span style={{ fontSize: 11, color: 'var(--text-faint)' }}>{latest.test_date}</span>
            </div>
            {inRange === false && <p style={{ fontSize: 12, color: 'var(--danger)', marginTop: 4 }}>Outside reference range — flag for your doctor.</p>}
            {latest.notes && <p style={{ fontSize: 12, color: 'var(--text-mute)', marginTop: 4, fontStyle: 'italic' }}>{latest.notes}</p>}
          </div>
        );
      })}
    </>
  );
}

// ============================================================
function App() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [profile, setProfile] = useState(null);
  const [logs, setLogs] = useState([]);
  const [view, setView] = useState('dashboard');

  useEffect(() => {
    db.auth.getSession().then(({ data }) => { setSession(data.session); setLoading(false); });
    const { data: sub } = db.auth.onAuthStateChange((_event, session) => setSession(session));
    return () => sub.subscription.unsubscribe();
  }, []);

  const loadData = useCallback(async () => {
    if (!session) return;
    const { data: prof } = await db.from('profiles').select('*').eq('user_id', session.user.id).maybeSingle();
    setProfile(prof);
    const { data: logRows } = await db.from('daily_logs').select('*').eq('user_id', session.user.id).order('date', { ascending: true });
    setLogs(logRows || []);
  }, [session]);

  useEffect(() => { loadData(); }, [loadData]);

  async function signOut() {
    await db.auth.signOut();
    setSession(null); setProfile(null); setLogs([]);
  }

  if (loading) return <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', color: 'var(--text-mute)', fontStyle: 'italic' }}>loadingâ€¦</div>;
  if (!session) return <AuthScreen />;
  if (!profile) return <Onboarding user={session.user} onDone={loadData} />;

  const todayLog = logs.find(l => l.date === ymd(today()));

  // Trial calc â€” counts from trial_started_at if set, otherwise null (trial hasn't started yet)
  let trialDaysLeft = null;
  if (profile.trial_started_at) {
    const elapsed = daysBetween(new Date(profile.trial_started_at), today());
    trialDaysLeft = Math.max(0, TRIAL_DAYS - elapsed);
  }
  const isPaid = !!profile.is_paid;

  return (
    <div className="layout">
      <Sidebar view={view} setView={setView} profile={profile} onSignOut={signOut} trialDaysLeft={trialDaysLeft} isPaid={isPaid} />
      <main className="main">
        {view === 'dashboard' && <Dashboard profile={profile} logs={logs} todayLog={todayLog} setView={setView} />}
        {view === 'log' && <DailyLog profile={profile} logs={logs} todayLog={todayLog} onLogSaved={loadData} />}
        {view === 'coach' && <CoachView profile={profile} logs={logs} />}
        {view === 'health' && <HealthLogView profile={profile} />}
        {view === 'cycle' && <CycleInsights profile={profile} logs={logs} />}
        {view === 'trends' && <WeightTrends profile={profile} logs={logs} />}
        {view === 'settings' && <SettingsView profile={profile} onUpdate={loadData} />}
        <div style={{ marginTop: 48, paddingTop: 20, borderTop: '1px solid var(--divider)', textAlign: 'center', fontSize: 11, color: 'var(--text-faint)', lineHeight: 1.6 }}>
          Educational use only â€” not medical advice. <button onClick={() => setView('settings')} style={{ background: 'transparent', border: 'none', color: 'var(--teal)', fontSize: 11, cursor: 'pointer', textDecoration: 'underline' }}>Full disclaimer in Settings</button>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
